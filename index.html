<!doctype html>
<html lang="th">
   <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
      <title>AIM PLAY — คลังเกมการเรียนรู้</title>

      <!-- Typography: Fredoka & Prompt -->
      <link rel="preconnect" href="https://fonts.googleapis.com" />
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
      <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Prompt:wght@500;600;700;800&display=swap" rel="stylesheet" />

      <!-- Tailwind CSS -->
      <script src="https://cdn.tailwindcss.com"></script>
      <script>
         tailwind.config = {
            theme: {
               extend: {
                  fontFamily: {
                     prompt: ['Prompt', 'sans-serif'],
                     fredoka: ['Fredoka', 'Prompt', 'sans-serif'],
                  },
                  colors: {
                     canvas: '#F6F8FC',
                     surface: '#FFFFFF',
                     ink: '#1E293B',
                  },
                  boxShadow: {
                     'pill': '0 6px 20px -4px rgba(15, 23, 42, 0.08), 0 2px 6px -1px rgba(15, 23, 42, 0.04)',
                     'clay': '0 6px 0 #E2E8F0, 0 12px 24px -6px rgba(15, 23, 42, 0.08)',
                     'clay-hover': '0 10px 0 #CBD5E1, 0 20px 32px -8px rgba(15, 23, 42, 0.14)',
                     'btn-pop': '0 4px 0 rgba(0, 0, 0, 0.18)',
                  }
               }
            }
         };
      </script>

      <style>
         * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
         }

         html, body {
            min-height: 100dvh;
            width: 100%;
            margin: 0;
            padding: 0;
            font-family: 'Prompt', sans-serif;
            background-color: #F4F7FB;
            color: #1E293B;
            overflow-x: hidden;
            user-select: none;
            -webkit-font-smoothing: antialiased;
         }

         /* Sunlit Playful Dot & Wave Canvas */
         .bg-playland {
            background-color: #F4F7FB;
            background-image:
               radial-gradient(circle at 12% 15%, rgba(251, 191, 36, 0.15) 0%, transparent 34%),
               radial-gradient(circle at 88% 12%, rgba(56, 189, 248, 0.15) 0%, transparent 36%),
               radial-gradient(circle at 82% 88%, rgba(244, 114, 182, 0.13) 0%, transparent 36%),
               radial-gradient(circle at 18% 85%, rgba(52, 211, 153, 0.13) 0%, transparent 36%),
               radial-gradient(#CBD5E1 1.3px, transparent 1.3px);
            background-size: 100% 100%, 100% 100%, 100% 100%, 100% 100%, 26px 26px;
            background-attachment: fixed;
         }

         /* High Contrast Accessibility Mode (Fixed selector: body.high-contrast.bg-playland) */
         body.high-contrast,
         body.high-contrast.bg-playland {
            background: #09090B !important;
            background-image: none !important;
            color: #FEF08A !important;
         }
         body.high-contrast .ambient-clouds {
            opacity: 0.08 !important;
         }
         body.high-contrast .floating-pill,
         body.high-contrast .game-card,
         body.high-contrast .bonus-mini-card,
         body.high-contrast .bonus-surface,
         body.high-contrast .modal-surface,
         body.high-contrast #emptyState {
            background-color: #121215 !important;
            border-color: #FACC15 !important;
            color: #FACC15 !important;
            box-shadow: none !important;
         }
         body.high-contrast .game-card > div,
         body.high-contrast .bonus-mini-card > div,
         body.high-contrast .modal-surface .bg-white,
         body.high-contrast .modal-surface .bg-white\/80,
         body.high-contrast .modal-surface .bg-slate-50,
         body.high-contrast .modal-surface .bg-slate-100,
         body.high-contrast .modal-surface .bg-slate-100\/80,
         body.high-contrast .modal-surface .bg-slate-100\/90 {
            background-color: #18181B !important;
            border-color: #52525B !important;
            color: #FEF08A !important;
         }
         body.high-contrast .card-title,
         body.high-contrast .modal-surface h3,
         body.high-contrast .modal-surface p,
         body.high-contrast .modal-surface span,
         body.high-contrast input {
            color: #FFFFFF !important;
         }
         body.high-contrast input::placeholder {
            color: #A1A1AA !important;
         }

         /* Tactile Button & Card Physics */
         .tactile-btn {
            transition: transform 0.14s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.14s ease, background-color 0.15s ease;
            touch-action: manipulation;
         }
         @media (hover: hover) {
            .tactile-btn:hover {
               transform: translateY(-2px);
            }
            .game-card:hover {
               transform: translateY(-5px);
            }
            .game-card:hover .illus-group {
               transform: scale(1.05) translateY(-2px);
            }
            .bonus-mini-card:hover {
               transform: translateY(-3px);
            }
         }
         .tactile-btn:active {
            transform: translateY(2px) scale(0.96);
         }

         .game-card, .bonus-mini-card {
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s ease, border-color 0.2s ease;
            touch-action: manipulation;
         }
         .game-card:active, .bonus-mini-card:active {
            transform: scale(0.98);
         }
         .illus-group {
            transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform-origin: center center;
         }

         /* Subtle Ambient Float */
         @keyframes floatSlow {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-4px); }
         }
         .animate-float-slow {
            animation: floatSlow 3.6s ease-in-out infinite;
         }

         @keyframes diceSpin {
            0% { transform: rotate(0deg) scale(1); }
            35% { transform: rotate(-28deg) scale(1.22); }
            75% { transform: rotate(388deg) scale(1.15); }
            100% { transform: rotate(360deg) scale(1); }
         }
         .dice-rolling {
            animation: diceSpin 0.65s cubic-bezier(0.34, 1.56, 0.64, 1);
         }

         @keyframes winnerPop {
            0% { transform: scale(0.92); }
            50% { transform: scale(1.04); }
            100% { transform: scale(1); }
         }
         .winner-pop {
            animation: winnerPop 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
         }

         @keyframes pointerBounceLeft {
            0%, 100% { transform: translateY(-50%) translateX(0); }
            50% { transform: translateY(-50%) translateX(4px); }
         }
         @keyframes pointerBounceRight {
            0%, 100% { transform: translateY(-50%) translateX(0); }
            50% { transform: translateY(-50%) translateX(-4px); }
         }
         .pointer-tick-left {
            animation: pointerBounceLeft 0.12s ease-out;
         }
         .pointer-tick-right {
            animation: pointerBounceRight 0.12s ease-out;
         }

         @keyframes suspensePulse {
            0% { transform: scale(1); }
            45% { transform: scale(1.035); }
            100% { transform: scale(1); }
         }
         .suspense-beat {
            animation: suspensePulse 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
         }

         @keyframes shockwaveRing {
            0% { transform: translateY(-50%) scale(0.95); opacity: 0.55; }
            100% { transform: translateY(-50%) scale(1.06); opacity: 0; }
         }
         .shockwave-active {
            animation: shockwaveRing 0.5s ease-out forwards;
         }

         @keyframes modalPopIn {
            0% { opacity: 0; transform: scale(0.93) translateY(10px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
         }
         .modal-enter {
            animation: modalPopIn 0.24s cubic-bezier(0.22, 1, 0.36, 1) forwards;
         }

         @keyframes ctaPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.025); }
         }
         .cta-ready {
            animation: ctaPulse 1.8s ease-in-out infinite;
         }

         /* Arcade Drum Cylindrical Vignette */
         .reel-mask {
            mask-image: linear-gradient(to bottom, transparent 0%, rgba(0,0,0,0.45) 11%, black 22%, black 78%, rgba(0,0,0,0.45) 89%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, rgba(0,0,0,0.45) 11%, black 22%, black 78%, rgba(0,0,0,0.45) 89%, transparent 100%);
         }

         /* Clean Custom Scrollbar */
         ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
         }
         ::-webkit-scrollbar-track {
            background: transparent;
         }
         ::-webkit-scrollbar-thumb {
            background: rgba(148, 163, 184, 0.45);
            border-radius: 999px;
         }
         ::-webkit-scrollbar-thumb:hover {
            background: rgba(100, 116, 139, 0.7);
         }
      </style>
   </head>

   <body class="bg-playland flex flex-col min-h-[100dvh] w-full">

      <!-- Decorative Background Clouds (Pure Light Ambient Art) -->
      <div class="ambient-clouds fixed inset-0 pointer-events-none overflow-hidden z-0 opacity-65">
         <svg class="absolute -top-6 left-[4%] w-36 sm:w-44 h-24 text-white/80 animate-float-slow" viewBox="0 0 200 100" fill="currentColor">
            <path d="M45 80h110a30 30 0 0 0 5-59.5A42 42 0 0 0 80 18a35 35 0 0 0-35 32A25 25 0 0 0 45 80z"/>
         </svg>
         <svg class="absolute top-14 right-[5%] w-40 sm:w-52 h-28 text-white/75 animate-float-slow" style="animation-delay: 1.4s" viewBox="0 0 200 100" fill="currentColor">
            <path d="M45 80h110a30 30 0 0 0 5-59.5A42 42 0 0 0 80 18a35 35 0 0 0-35 32A25 25 0 0 0 45 80z"/>
         </svg>
      </div>

      <!-- STICKY MOBILE-FIRST FLOATING HUD -->
      <header class="sticky top-0 z-30 w-full pointer-events-none pt-[max(0.65rem,env(safe-area-inset-top))] pb-2">
         <div class="w-full max-w-[1440px] mx-auto px-3 sm:px-6 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2 sm:gap-2.5">

            <!-- Top Row on Mobile: Floating Emblem + Counters (Left) & Icon Controls (Right) -->
            <div class="flex items-center justify-between gap-1.5 sm:gap-2 w-full sm:w-auto">
               <!-- Left Floating Pills: Brand Emblem + 12-Game Trophy + Bonus Vault Gift -->
               <div class="pointer-events-auto flex items-center gap-1.5 sm:gap-2 min-w-0">
                  <button type="button" onclick="resetAllFilters()" title="AIM PLAY — รีเซ็ตตัวกรอง" aria-label="AIM PLAY"
                     class="floating-pill tactile-btn h-11 sm:h-12 w-11 sm:w-12 rounded-2xl bg-white/95 backdrop-blur-md border-2 border-slate-200/90 shadow-pill flex items-center justify-center shrink-0">
                     <svg class="w-7 h-7 shrink-0" viewBox="0 0 36 36" fill="none">
                        <rect width="36" height="36" rx="11" fill="url(#brandGrad)"/>
                        <path d="M11 22.5C11 18.9 13.9 16 17.5 16h1c3.6 0 6.5 2.9 6.5 6.5a3.5 3.5 0 0 1-5.8 2.6l-1.2-1.1-1.2 1.1A3.5 3.5 0 0 1 11 22.5z" fill="#FFF"/>
                        <circle cx="15" cy="20.5" r="1.3" fill="#4F46E5"/>
                        <circle cx="21" cy="20.5" r="1.3" fill="#EC4899"/>
                        <path d="M18 9.5l1.1 2.2 2.4.4-1.7 1.7.4 2.4-2.2-1.1-2.2 1.1.4-2.4-1.7-1.7 2.4-.4L18 9.5z" fill="#FDE047"/>
                        <defs>
                           <linearGradient id="brandGrad" x1="0" y1="0" x2="36" y2="36" gradientUnits="userSpaceOnUse">
                              <stop stop-color="#6366F1"/>
                              <stop offset="0.55" stop-color="#EC4899"/>
                              <stop offset="1" stop-color="#F59E0B"/>
                           </linearGradient>
                        </defs>
                     </svg>
                  </button>

                  <!-- Played Trophy Counter Pill -->
                  <div id="playedCountPill" class="floating-pill h-11 sm:h-12 px-2.5 sm:px-3 rounded-2xl bg-white/95 backdrop-blur-md border-2 border-amber-200/90 shadow-pill flex items-center gap-1.5 shrink-0" title="เล่นแล้ว 0/12 เกม">
                     <svg class="w-5 h-5 text-amber-500 shrink-0" viewBox="0 0 24 24" fill="none">
                        <path d="M7 4h10v6a5 5 0 0 1-10 0V4z" fill="#FBBF24" stroke="#D97706" stroke-width="1.8"/>
                        <path d="M7 6H4.5A1.5 1.5 0 0 0 3 7.5v1A3.5 3.5 0 0 0 6.5 12H7M17 6h2.5A1.5 1.5 0 0 1 21 7.5v1a3.5 3.5 0 0 1-3.5 3.5H17" stroke="#D97706" stroke-width="1.8" stroke-linecap="round"/>
                        <path d="M12 15v4M8.5 19h7" stroke="#D97706" stroke-width="2" stroke-linecap="round"/>
                     </svg>
                     <span id="playedCountText" class="font-fredoka font-bold text-xs sm:text-sm text-amber-700">0/12</span>
                  </div>

                  <!-- Bonus Vault Gift Pill (+13) -->
                  <button type="button" onclick="openBonusVault()" title="คลังเกมเสริม" aria-label="คลังเกมเสริม"
                     class="floating-pill tactile-btn h-11 sm:h-12 px-2.5 sm:px-3 rounded-2xl bg-white/95 hover:bg-indigo-50 backdrop-blur-md border-2 border-indigo-200/80 hover:border-indigo-300 shadow-pill flex items-center gap-1.5 text-indigo-600 shrink-0">
                     <svg class="w-4 h-4 sm:w-5 sm:h-5 text-indigo-500 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="8" width="18" height="4" rx="1.5"/>
                        <path d="M12 8v13"/>
                        <path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/>
                        <path d="M7.5 8a2.5 2.5 0 0 1 0-5A4.8 8 0 0 1 12 8a4.8 8 0 0 1 4.5-5 2.5 2.5 0 0 1 0 5"/>
                     </svg>
                     <span id="hudBonusCountText" class="font-fredoka font-bold text-xs sm:text-sm text-indigo-600">+13</span>
                  </button>
               </div>

               <!-- Mobile-Only Floating Icon Actions (Search, Randomizer, Settings) -->
               <div class="pointer-events-auto flex sm:hidden items-center gap-1.5 shrink-0">
                  <button type="button" onclick="toggleMobileSearch()" id="mobileSearchToggleBtn" aria-label="ค้นหา"
                     class="floating-pill tactile-btn h-11 w-11 rounded-2xl bg-white/95 border-2 border-slate-200/90 shadow-pill text-slate-700 flex items-center justify-center">
                     <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                        <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>
                     </svg>
                  </button>

                  <button type="button" onclick="openRandomizer()" aria-label="สุ่มเกม"
                     class="tactile-btn relative h-11 w-11 rounded-2xl bg-gradient-to-br from-amber-400 via-orange-400 to-rose-500 text-white shadow-pill border-2 border-amber-200 flex items-center justify-center">
                     <svg class="w-5 h-5 shrink-0" viewBox="0 0 24 24" fill="none">
                        <rect x="3" y="3" width="18" height="18" rx="5" fill="#FFF" fill-opacity="0.22" stroke="#FFF" stroke-width="2"/>
                        <circle cx="8.5" cy="8.5" r="1.5" fill="#FFF"/>
                        <circle cx="15.5" cy="8.5" r="1.5" fill="#FFF"/>
                        <circle cx="12" cy="12" r="1.5" fill="#FFF"/>
                        <circle cx="8.5" cy="15.5" r="1.5" fill="#FFF"/>
                        <circle cx="15.5" cy="15.5" r="1.5" fill="#FFF"/>
                     </svg>
                     <span class="absolute -top-1 -right-1 w-3 h-3 rounded-full bg-yellow-300 border-2 border-white"></span>
                  </button>

                  <button type="button" onclick="openModal('settingsModal')" aria-label="ตั้งค่า"
                     class="floating-pill tactile-btn h-11 w-11 rounded-2xl bg-white/95 border-2 border-slate-200/90 shadow-pill text-slate-700 flex items-center justify-center">
                     <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="3"/>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l-.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9c.26.604.852.997 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                     </svg>
                  </button>
               </div>
            </div>

            <!-- Mobile Collapsible Search Pill -->
            <div id="mobileSearchDrawer" class="pointer-events-auto hidden sm:hidden w-full">
               <div class="floating-pill h-11 rounded-2xl bg-white border-2 border-indigo-300 shadow-pill flex items-center px-3 gap-2">
                  <svg class="w-4 h-4 text-indigo-500 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                     <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>
                  </svg>
                  <input type="text" id="mobileSearchInput" oninput="handleSearch(this.value)" placeholder="ค้นหาเกม..."
                     class="w-full bg-transparent text-sm font-semibold text-slate-800 outline-none placeholder:text-slate-400" />
                  <button type="button" onclick="clearSearch(true)" aria-label="ล้าง" class="w-7 h-7 rounded-xl bg-slate-100 text-slate-500 flex items-center justify-center shrink-0">
                     <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                        <path d="M18 6L6 18M6 6l12 12"/>
                     </svg>
                  </button>
               </div>
            </div>

            <!-- Center: Category Dock -->
            <div class="pointer-events-auto floating-pill h-11 sm:h-12 p-1 sm:p-1.5 rounded-2xl bg-white/95 backdrop-blur-md border-2 border-slate-200/90 shadow-pill grid grid-cols-5 sm:flex items-center gap-1 w-full sm:w-auto">
               <!-- All 12 Core Games -->
               <button type="button" onclick="setCategoryFilter('all')" id="tab-all" title="ทั้งหมด 12 เกม"
                  class="cat-tab h-full px-2 sm:px-3.5 rounded-xl font-fredoka font-bold text-xs sm:text-sm flex items-center justify-center gap-1 sm:gap-1.5 transition-all bg-slate-900 text-white shadow-sm">
                  <svg class="w-3.5 h-3.5 sm:w-4 sm:h-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                     <rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/>
                  </svg>
                  <span>12</span>
               </button>

               <!-- Group 1-4: Science & English -->
               <button type="button" onclick="setCategoryFilter('1-4')" id="tab-1-4" title="หมวด 1-4 (วิทย์-อังกฤษ)"
                  class="cat-tab h-full px-2 sm:px-3.5 rounded-xl font-fredoka font-bold text-xs sm:text-sm flex items-center justify-center gap-1 sm:gap-1.5 transition-all text-slate-600 hover:bg-sky-50 hover:text-sky-600">
                  <svg class="w-3.5 h-3.5 sm:w-4 sm:h-4 text-sky-500 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
                     <circle cx="12" cy="12" r="2.5"/><ellipse cx="12" cy="12" rx="9" ry="4" transform="rotate(30 12 12)"/><ellipse cx="12" cy="12" rx="9" ry="4" transform="rotate(-30 12 12)"/>
                  </svg>
                  <span>1-4</span>
               </button>

               <!-- Group 5-8: Health & Phonics (B01-B04) -->
               <button type="button" onclick="setCategoryFilter('5-8')" id="tab-5-8" title="หมวด 5-8 (สุขภาพ-โฟนิกส์)"
                  class="cat-tab h-full px-2 sm:px-3.5 rounded-xl font-fredoka font-bold text-xs sm:text-sm flex items-center justify-center gap-1 sm:gap-1.5 transition-all text-slate-600 hover:bg-rose-50 hover:text-rose-600">
                  <svg class="w-3.5 h-3.5 sm:w-4 sm:h-4 text-rose-500 shrink-0" viewBox="0 0 24 24" fill="currentColor">
                     <path d="M12 20.5s-7-4.5-9-9.2C1.4 7.7 4 4.5 7.5 4.5c2 0 3.6 1 4.5 2.4.9-1.4 2.5-2.4 4.5-2.4 3.5 0 6.1 3.2 4.5 6.8-2 4.7-9 9.2-9 9.2z"/>
                  </svg>
                  <span>5-8</span>
               </button>

               <!-- Group 9-12: Arcade & Skill (C01-C04) -->
               <button type="button" onclick="setCategoryFilter('9-12')" id="tab-9-12" title="หมวด 9-12 (อาร์เคด)"
                  class="cat-tab h-full px-2 sm:px-3.5 rounded-xl font-fredoka font-bold text-xs sm:text-sm flex items-center justify-center gap-1 sm:gap-1.5 transition-all text-slate-600 hover:bg-pink-50 hover:text-pink-600">
                  <svg class="w-3.5 h-3.5 sm:w-4 sm:h-4 text-pink-500 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
                     <line x1="6" y1="12" x2="10" y2="12"/><line x1="8" y1="10" x2="8" y2="14"/><line x1="15" y1="13" x2="15.01" y2="13"/><line x1="18" y1="11" x2="18.01" y2="11"/><rect x="2" y="6" width="20" height="12" rx="6"/>
                  </svg>
                  <span>9-12</span>
               </button>

               <!-- Favorite Filter Toggle -->
               <button type="button" onclick="toggleFavoriteFilter()" id="tab-fav" title="เกมโปรด"

         // Lazy & Safe Web Audio Synthesizer
         let audioCtx = null;
         function getAudioContext() {
            if (!audioCtx) {
               const Ctx = window.AudioContext || window.webkitAudioContext;
               if (Ctx) {
                  try { audioCtx = new Ctx(); } catch (e) {}
               }
            }
            if (audioCtx && audioCtx.state === 'suspended') {
               audioCtx.resume().catch(() => {});
            }
            return audioCtx;
         }

         function playSound(type, pitchFactor = 1) {
            if (!soundEnabled) return;
            const ctx = getAudioContext();
            if (!ctx) return;
            try {
               const now = ctx.currentTime;
               const osc = ctx.createOscillator();
               const gain = ctx.createGain();
               osc.connect(gain);
               gain.connect(ctx.destination);

               if (type === 'click') {
                  osc.type = 'sine';
                  osc.frequency.setValueAtTime(520, now);
                  osc.frequency.exponentialRampToValueAtTime(760, now + 0.055);
                  gain.gain.setValueAtTime(0.1, now);
                  gain.gain.exponentialRampToValueAtTime(0.001, now + 0.055);
                  osc.start(now);
                  osc.stop(now + 0.06);
               } else if (type === 'pop') {
                  osc.type = 'triangle';
                  osc.frequency.setValueAtTime(360, now);
                  osc.frequency.exponentialRampToValueAtTime(880, now + 0.09);
                  gain.gain.setValueAtTime(0.13, now);
                  gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
                  osc.start(now);
                  osc.stop(now + 0.1);
               } else if (type === 'tick') {
                  osc.type = 'triangle';
                  const baseFreq = 380 + pitchFactor * 420;
                  osc.frequency.setValueAtTime(baseFreq, now);
                  osc.frequency.exponentialRampToValueAtTime(baseFreq * 0.65, now + 0.032);
                  gain.gain.setValueAtTime(0.09, now);
                  gain.gain.exponentialRampToValueAtTime(0.001, now + 0.035);
                  osc.start(now);
                  osc.stop(now + 0.038);
               } else if (type === 'tension') {
                  osc.type = 'sine';
                  osc.frequency.setValueAtTime(140, now);
                  osc.frequency.exponentialRampToValueAtTime(55, now + 0.14);
                  gain.gain.setValueAtTime(0.22, now);
                  gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
                  osc.start(now);
                  osc.stop(now + 0.16);

                  const chime = ctx.createOscillator();
                  const cGain = ctx.createGain();
                  chime.connect(cGain);
                  cGain.connect(ctx.destination);
                  chime.type = 'triangle';
                  const noteFreq = 520 + pitchFactor * 360;
                  chime.frequency.setValueAtTime(noteFreq, now);
                  cGain.gain.setValueAtTime(0.11, now);
                  cGain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
                  chime.start(now);
                  chime.stop(now + 0.17);
               } else if (type === 'fanfare') {
                  [523.25, 659.25, 783.99, 1046.5].forEach((freq, idx) => {
                     const o = ctx.createOscillator();
                     const g = ctx.createGain();
                     o.connect(g);
                     g.connect(ctx.destination);
                     o.type = 'triangle';
                     o.frequency.setValueAtTime(freq, now + idx * 0.075);
                     g.gain.setValueAtTime(0.14, now + idx * 0.075);
                     g.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.075 + 0.24);
                     o.start(now + idx * 0.075);
                     o.stop(now + idx * 0.075 + 0.26);
                  });
               }
            } catch (e) {}
         }

         function getReelMetrics() {
            const frame = document.getElementById('reelFrame');
            const track = document.getElementById('reelTrack');
            const firstItem = track ? track.querySelector('.reel-item') : null;
            const isSmUp = window.innerWidth >= 640;
            const itemHeight = (firstItem && firstItem.offsetHeight > 0) ? firstItem.offsetHeight : (isSmUp ? 192 : 176);
            const frameHeight = (frame && frame.offsetHeight > 0) ? frame.offsetHeight : (isSmUp ? 248 : 232);
            const centerOffset = (frameHeight - itemHeight) / 2;
            return { itemHeight, frameHeight, centerOffset };
         }

            track.style.transform = `translate3d(0, ${finalY}px, 0)`;

         function startSlotSpin() {
            cancelAllSpinTimers();
            isSpinning = true;

            const pool = getPoolForSpinMode(spinMode);
            let candidates = pool;
            if (currentWinnerGame && pool.length > 1) {
               candidates = pool.filter(g => g.id !== currentWinnerGame.id);
            }
            const winner = candidates[Math.floor(Math.random() * candidates.length)];
            currentWinnerGame = winner;

            ['diceIcon', 'modalDiceIcon'].forEach(id => {
               const el = document.getElementById(id);
               if (el) {
                  el.classList.remove('dice-rolling');
                  void el.offsetWidth;
                  el.classList.add('dice-rolling');
               }
            });

            updateStageDots(0);
            updateWinnerFavoriteUI();

            const skipHint = document.getElementById('skipSpinHint');
            const playBtn = document.getElementById('randomModalPlayBtn');

            if (skipHint) skipHint.classList.remove('hidden');
            playBtn.classList.remove('cta-ready');
            playBtn.classList.add('opacity-45', 'pointer-events-none');
            playBtn.style.background = 'linear-gradient(135deg, #CBD5E1, #94A3B8)';
            playBtn.href = '#';
            playBtn.onclick = (e) => e.preventDefault();

            const totalItems = TARGET_REEL_INDEX + 2;
            const sequence = [];
            for (let i = 0; i < totalItems; i++) {
               if (i === TARGET_REEL_INDEX) {
                  sequence.push(winner);
               } else {
                  let rnd = pool[Math.floor(Math.random() * pool.length)];
                  if (pool.length > 1 && i > 0 && rnd.id === sequence[i - 1].id) {
                     rnd = pool[(pool.indexOf(rnd) + 1) % pool.length];
                  }
                  sequence.push(rnd);
               }
            }

            const track = document.getElementById('reelTrack');
            track.innerHTML = sequence.map(g => buildReelItemHTML(g)).join('');
            applySpotlightTheme(sequence[0], false);

            spinSetupRafId = requestAnimationFrame(() => {
               spinSetupRafId = null;
               if (!isSpinning) return;

               const { itemHeight, centerOffset } = getReelMetrics();
               const startY = centerOffset;
               const finalY = -(TARGET_REEL_INDEX * itemHeight) + centerOffset;
               const distance = finalY - startY;
               const duration = 2650;
               const startTime = performance.now();
               let lastTickIndex = 0;

               track.style.transform = `translate3d(0, ${startY}px, 0)`;

               function step(now) {
                  if (!isSpinning) return;
                  const elapsed = now - startTime;
                  const t = Math.min(elapsed / duration, 1);

                  let ease;
                  if (t < 0.48) {
                     ease = 1.54 * t;
                  } else {
                     const u = (t - 0.48) / 0.52;
                     ease = 0.7392 + 0.2608 * (1 - Math.pow(1 - u, 3.5));
                  }

                  const currentY = startY + distance * ease;
                  track.style.transform = `translate3d(0, ${currentY}px, 0)`;

                  const currentIndex = Math.min(
                     TARGET_REEL_INDEX,
                     Math.max(0, Math.floor((Math.abs(currentY - centerOffset) + itemHeight * 0.45) / itemHeight))
                  );

                  if (currentIndex > lastTickIndex) {
                     lastTickIndex = currentIndex;
                     const activeGame = sequence[currentIndex];
                     applySpotlightTheme(activeGame, false);
                     bouncePointers();

                     if (currentIndex >= TARGET_REEL_INDEX - 3) {
                        updateStageDots(2);
                        playSound('tension', (currentIndex - (TARGET_REEL_INDEX - 3)) / 4);
                        triggerShockwave(activeGame.theme.aura);
                        const cardEl = track.children[currentIndex];
                        if (cardEl) {
                           cardEl.classList.remove('suspense-beat');
                           void cardEl.offsetWidth;
                           cardEl.classList.add('suspense-beat');
                        }
                     } else {
                        if (t > 0.32) updateStageDots(1);
                        playSound('tick', t);
                     }
                  }

                  if (t < 1) {
                     spinAnimId = requestAnimationFrame(step);
                  } else {
                     finishSlotSpin();
                  }
               }

               spinAnimId = requestAnimationFrame(step);
            });
         }

         function bouncePointers() {
            const pL = document.getElementById('pointerLeft');
            const pR = document.getElementById('pointerRight');
            if (pL && pR) {
               pL.classList.remove('pointer-tick-left');
               pR.classList.remove('pointer-tick-right');
               void pL.offsetWidth;
               pL.classList.add('pointer-tick-left');
               pR.classList.add('pointer-tick-right');
            }
         }

         function handleReelTap() {
            if (!isSpinning || !currentWinnerGame) return;
            if (spinSetupRafId) {
               cancelAnimationFrame(spinSetupRafId);
               spinSetupRafId = null;
            }
            if (spinAnimId) {
               cancelAnimationFrame(spinAnimId);
               spinAnimId = null;
            }
            finishSlotSpin();
         }

         function finishSlotSpin() {
            isSpinning = false;
            spinAnimId = null;
            if (!currentWinnerGame) return;

            const { itemHeight, centerOffset } = getReelMetrics();
            const finalY = -(TARGET_REEL_INDEX * itemHeight) + centerOffset;

            const track = document.getElementById('reelTrack');
            if (track) {
               track.style.transform = `translate3d(0, ${finalY}px, 0)`;
               const winnerCard = track.children[TARGET_REEL_INDEX];
               if (winnerCard) {
                  winnerCard.classList.remove('winner-pop');
                  void winnerCard.offsetWidth;
                  winnerCard.classList.add('winner-pop');
               }
            }

            updateStageDots(3);
            updateWinnerFavoriteUI();
            applySpotlightTheme(currentWinnerGame, true);
            triggerShockwave(currentWinnerGame.theme.aura);

            const skipHint = document.getElementById('skipSpinHint');
            const playBtn = document.getElementById('randomModalPlayBtn');

            if (skipHint) skipHint.classList.add('hidden');

            playBtn.classList.remove('opacity-45', 'pointer-events-none');
            playBtn.classList.add('cta-ready');
            playBtn.style.background = currentWinnerGame.theme.btnGrad;
            playBtn.href = encodeURI(currentWinnerGame.filename);
            if (openInNewTab) {
               playBtn.target = '_blank';
               playBtn.rel = 'noopener noreferrer';
            } else {
               playBtn.removeAttribute('target');
               playBtn.removeAttribute('rel');
            }
            playBtn.onclick = (e) => {
               if (isSpinning || !currentWinnerGame) {
                  e.preventDefault();
                  return;
               }
               markAsPlayed(currentWinnerGame.id);
               closeRandomModal();
            };

            playSound('fanfare');
            launchConfetti(currentWinnerGame.theme);
         }

         // Celebratory Confetti Particle Burst using the winning game's signature palette
         function launchConfetti(gameTheme) {
            const canvas = document.getElementById('confettiCanvas');
            const modalCard = document.getElementById('randomModalCard');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            if (!ctx) return;
            canvas.width = canvas.offsetWidth || (modalCard ? modalCard.clientWidth : 340);
            canvas.height = canvas.offsetHeight || (modalCard ? modalCard.clientHeight : 420);

            const colors = gameTheme
               ? [gameTheme.primary, gameTheme.border, '#FBBF24', '#34D399', '#38BDF8', '#F472B6']
               : ['#F59E0B', '#EC4899', '#6366F1', '#10B981', '#38BDF8', '#F43F5E'];
            confettiParticles = [];
            for (let i = 0; i < 52; i++) {
               const angle = (Math.PI * 2 * i) / 52 + (Math.random() - 0.5) * 0.3;
               const speed = 2.6 + Math.random() * 5.4;
               confettiParticles.push({
                  x: canvas.width / 2,
                  y: canvas.height * 0.45,
                  vx: Math.cos(angle) * speed,
                  vy: Math.sin(angle) * speed - 2.5,
                  size: 5 + Math.random() * 5,
                  color: colors[Math.floor(Math.random() * colors.length)],
                  rotation: Math.random() * 360,
                  rotSpeed: (Math.random() - 0.5) * 14,
                  alpha: 1
               });
            }

            if (confettiAnimId) cancelAnimationFrame(confettiAnimId);

            function animateConfetti() {
               ctx.clearRect(0, 0, canvas.width, canvas.height);
               let alive = false;

               confettiParticles.forEach(p => {
                  p.x += p.vx;
                  p.y += p.vy;
                  p.vy += 0.18;
                  p.vx *= 0.98;
                  p.rotation += p.rotSpeed;
                  p.alpha -= 0.016;

                  if (p.alpha > 0) {
                     alive = true;
                     ctx.save();
                     ctx.globalAlpha = Math.max(0, p.alpha);
                     ctx.translate(p.x, p.y);
                     ctx.rotate((p.rotation * Math.PI) / 180);
                     ctx.fillStyle = p.color;
                     ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.65);
                     ctx.restore();
                  }
               });

               if (alive) {
                  confettiAnimId = requestAnimationFrame(animateConfetti);
               } else {
                  confettiAnimId = null;
                  ctx.clearRect(0, 0, canvas.width, canvas.height);
               }
            }

            confettiAnimId = requestAnimationFrame(animateConfetti);
         }

         // Modals, Body Scroll Lock & Accessibility Settings
         function syncBodyScrollLock() {
            const settingsOpen = !document.getElementById('settingsModal').classList.contains('hidden');
            const randomOpen = !document.getElementById('randomModal').classList.contains('hidden');
            const bonusOpen = !document.getElementById('bonusModal').classList.contains('hidden');
            document.body.style.overflow = (settingsOpen || randomOpen || bonusOpen) ? 'hidden' : '';
         }

         function openModal(id) {
            const m = document.getElementById(id);
            if (m) {
               if (id === 'settingsModal') disarmResetButton();
               m.classList.remove('hidden');
               syncBodyScrollLock();
            }
         }

         function closeModal(id) {
            playSound('click');
            const m = document.getElementById(id);
            if (m) {
               if (id === 'settingsModal') disarmResetButton();
               m.classList.add('hidden');
               syncBodyScrollLock();
            }
         }

         window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
               const settingsM = document.getElementById('settingsModal');
               if (settingsM && !settingsM.classList.contains('hidden')) closeModal('settingsModal');
               const bonusM = document.getElementById('bonusModal');
               if (bonusM && !bonusM.classList.contains('hidden')) closeModal('bonusModal');
               const randomM = document.getElementById('randomModal');
               if (randomM && !randomM.classList.contains('hidden')) closeRandomModal();
            }
         });

         function toggleHighContrast(enabled) {
            playSound('click');
            document.body.classList.toggle('high-contrast', enabled);
            safeSetStorage('aim_contrast', enabled);
         }

         function toggleSound(enabled) {
            soundEnabled = enabled;
            safeSetStorage('aim_sound', enabled);
            if (enabled) playSound('click');
         }

         function toggleNewTab(enabled) {
            openInNewTab = enabled;
            safeSetStorage('aim_new_tab', enabled);
            renderGames();
            renderBonusDock();
            renderBonusVault();
         }
      </script>
   </body>
</html>
