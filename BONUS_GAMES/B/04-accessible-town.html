<!doctype html>
<html lang="th">
   <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
      <title>น้องปุยเมฆ ผจญภัยในป่ามหัศจรรย์ - Simple Learning Adventure</title>
      <!-- Tailwind CSS for responsive layout & WCAG AAA utility styling -->
      <script src="https://cdn.tailwindcss.com"></script>
      <!-- Google Font: Mali (Playful, rounded, high-legibility Thai font ideal for children) -->
      <link rel="preconnect" href="https://fonts.googleapis.com" />
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
      <link href="https://fonts.googleapis.com/css2?family=Mali:wght@600;700&display=swap" rel="stylesheet" />

      <style>
         /* ==========================================================================
       CUSTOM THEME & ACCESSIBILITY STYLES (WCAG AAA HIGH CONTRAST LIGHT THEME)
       ========================================================================== */
         :root {
            --bg-cream: #fffdf7;
            --ink-dark: #0f172a; /* > 15:1 contrast against #FFFDF7 (WCAG AAA) */
            --accent-sky: #0284c7;
            --accent-mint: #059669;
            --accent-amber: #d97706;
            --accent-coral: #e11d48;
            --accent-purple: #7c3aed;
         }

         * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
         }

         body,
         html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Mali', cursive, sans-serif;
            background-color: var(--bg-cream);
            color: var(--ink-dark);
         }

         /* Tactile 3D Button Styling for Children (Clear boundaries & satisfying press) */
         .tactile-btn {
            border: 3px solid var(--ink-dark);
            box-shadow: 0 5px 0 var(--ink-dark);
            transition:
               transform 0.1s cubic-bezier(0.34, 1.56, 0.64, 1),
               box-shadow 0.1s ease,
               background-color 0.15s ease;
         }

         .tactile-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 0 var(--ink-dark);
         }

         .tactile-btn:active,
         .tactile-btn.pressed {
            transform: translateY(4px);
            box-shadow: 0 1px 0 var(--ink-dark);
         }

         .tactile-btn:focus-visible {
            outline: 4px solid #f59e0b;
            outline-offset: 3px;
         }

         /* Keycap styling for the Interactive WASD + Spacebar Tutorial */
         .keycap {
            border: 3.5px solid var(--ink-dark);
            box-shadow: 0 6px 0 var(--ink-dark);
            transition:
               transform 0.12s cubic-bezier(0.34, 1.56, 0.64, 1),
               box-shadow 0.12s ease;
         }

         .keycap.active-key {
            transform: translateY(5px) scale(0.96);
            box-shadow: 0 1px 0 var(--ink-dark);
         }

         .keycap.completed-key {
            ring: 4px solid #10b981;
         }

         /* Gentle floating animation for cute badges */
         @keyframes floatSlow {
            0%,
            100% {
               transform: translateY(0px);
            }
            50% {
               transform: translateY(-6px);
            }
         }

         .animate-float {
            animation: floatSlow 2.8s ease-in-out infinite;
         }

         @keyframes pulseRing {
            0% {
               transform: scale(0.95);
               opacity: 0.9;
            }
            70% {
               transform: scale(1.12);
               opacity: 0.3;
            }
            100% {
               transform: scale(0.95);
               opacity: 0.9;
            }
         }

         .animate-hint-pulse {
            animation: pulseRing 1.6s ease-in-out infinite;
         }

         /* Ensure canvas fills screen cleanly without scrollbars */
         #gameCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
         }
      </style>
   </head>
   <body class="relative w-screen h-screen overflow-hidden">
      <!-- ========================================================================
       MAIN GAME CANVAS (Renders World, Characters, Animations, Ghost Hints)
       ======================================================================== -->
      <canvas id="gameCanvas" aria-label="พื้นที่เล่นเกมผจญภัยของน้องปุยเมฆ"></canvas>

      <!-- ========================================================================
       MINIMALIST FLOATING HUD (NO NAVBAR - ONLY VISUAL STEP CARDS & ICON BUTTONS)
       ======================================================================== -->
      <div id="gameHud" class="pointer-events-none fixed inset-0 z-10 flex flex-col justify-between p-3 sm:p-5 hidden">
         <!-- Top Row: Level Indicator + Visual Step-by-Step Quest Cards (Left) & Assist Buttons (Right) -->
         <div class="flex flex-wrap items-start justify-between gap-3 w-full">
            <!-- Visual Quest Tracker (Picture-based, zero long sentences) -->
            <div
               class="pointer-events-auto flex items-center gap-2 sm:gap-3 bg-[#FFFDF7]/95 backdrop-blur-sm border-[3px] border-[#0F172A] rounded-3xl px-3 py-2 sm:px-4 sm:py-2.5 shadow-[0_4px_0_#0F172A]">
               <!-- Current Stage Pill -->
               <div class="flex flex-col items-center justify-center bg-[#FEF3C7] border-[2.5px] border-[#0F172A] rounded-2xl px-3 py-1.5 min-w-[64px]">
                  <span class="text-xs font-bold uppercase tracking-wider text-[#0F172A]">ด่าน</span>
                  <span id="hudLevelNum" class="text-xl sm:text-2xl font-bold leading-none text-[#0F172A]">1/5</span>
               </div>

               <!-- Live Score Pill -->
               <div class="flex flex-col items-center justify-center bg-[#DCFCE7] border-[2.5px] border-[#0F172A] rounded-2xl px-3 py-1.5 min-w-[68px]" aria-label="คะแนนสะสม">
                  <span class="text-xs font-bold text-[#0F172A]">คะแนน</span>
                  <span id="hudScoreNum" class="text-xl sm:text-2xl font-bold leading-none text-[#0F172A]">0</span>
               </div>

               <!-- Arrow Separator -->
               <svg class="w-5 h-5 text-[#0F172A] shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M5 12h14M13 5l7 7-7 7" />
               </svg>

               <!-- Step-by-Step Visual Task Slots (Dynamically Populated with Icons) -->
               <div id="hudStepSlots" class="flex items-center gap-2 sm:gap-2.5" role="list" aria-label="ขั้นตอนภารกิจ">
                  <!-- Visual Step Cards Injected Here -->
               </div>
            </div>

            <!-- Right Assist Controls: Repeat Audio/Visual, Progressive Hint/Example, Interactive Key Guide -->
            <div class="pointer-events-auto flex items-center gap-2.5 sm:gap-3">
               <!-- 1. Repeat Instruction Button (ฟังซ้ำ / ดูซ้ำ) -->
               <button
                  id="btnRepeat"
                  type="button"
                  aria-label="ฟังและดูคำแนะนำซ้ำ"
                  class="tactile-btn bg-[#E0F2FE] hover:bg-[#BAE6FD] text-[#0F172A] rounded-2xl p-3 sm:p-3.5 flex flex-col items-center justify-center min-w-[64px] min-h-[64px]">
                  <svg class="w-7 h-7 sm:w-8 sm:h-8" viewBox="0 0 24 24" fill="none" stroke="#0F172A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                     <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="#38BDF8" />
                     <path d="M15.54 8.46a5 5 0 0 1 0 7.07" />
                     <path d="M19.07 4.93a10 10 0 0 1 0 14.14" />
                  </svg>
                  <span class="text-xs font-bold mt-0.5">ฟังซ้ำ</span>
               </button>

               <!-- 2. Progressive Scaffolding / Ghost Demo Button (ดูตัวอย่าง / ช่วยเหลือ) -->
               <button
                  id="btnHint"
                  type="button"
                  aria-label="ดูตัวอย่างวิธีเล่นและขอความช่วยเหลือ"
                  class="tactile-btn bg-[#FEF08A] hover:bg-[#FDE047] text-[#0F172A] rounded-2xl p-3 sm:p-3.5 flex flex-col items-center justify-center min-w-[64px] min-h-[64px] relative">
                  <svg class="w-7 h-7 sm:w-8 sm:h-8" viewBox="0 0 24 24" fill="none" stroke="#0F172A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                     <path d="M9 18h6" />
                     <path d="M10 22h4" />
                     <path d="M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z" fill="#FACC15" />
                  </svg>
                  <span class="text-xs font-bold mt-0.5">ตัวอย่าง</span>
                  <!-- Hint Level Dots (1, 2, 3) -->
                  <div id="hintLevelDots" class="flex gap-1 mt-0.5">
                     <span class="w-2 h-2 rounded-full border border-[#0F172A] bg-white"></span>
                     <span class="w-2 h-2 rounded-full border border-[#0F172A] bg-white"></span>
                     <span class="w-2 h-2 rounded-full border border-[#0F172A] bg-white"></span>
                  </div>
               </button>

               <!-- 3. Open Tutorial Screen Button (วิธีบังคับ WASD + Spacebar) -->
               <button
                  id="btnOpenTutorial"
                  type="button"
                  aria-label="เปิดหน้าจอฝึกกดปุ่ม WASD และ Spacebar"
                  class="tactile-btn bg-[#F3E8FF] hover:bg-[#E9D5FF] text-[#0F172A] rounded-2xl p-3 sm:p-3.5 flex flex-col items-center justify-center min-w-[64px] min-h-[64px]">
                  <svg class="w-7 h-7 sm:w-8 sm:h-8" viewBox="0 0 24 24" fill="none" stroke="#0F172A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                     <rect x="2" y="6" width="20" height="12" rx="4" fill="#C084FC" />
                     <path d="M6 12h4M8 10v4" />
                     <circle cx="15" cy="11" r="1" fill="#0F172A" />
                     <circle cx="18" cy="13" r="1" fill="#0F172A" />
                  </svg>
                  <span class="text-xs font-bold mt-0.5">ปุ่มกด</span>
               </button>
            </div>
         </div>

         <!-- Bottom Row: Tactile Touch/Mouse On-Screen Controls (Accessibility for Touch & Motor Support) -->
         <div class="flex items-end justify-between w-full pb-1 sm:pb-2">
            <!-- Virtual WASD D-Pad (Bottom Left) -->
            <div class="pointer-events-auto grid grid-cols-3 gap-1.5 sm:gap-2 p-2 bg-[#FFFDF7]/85 backdrop-blur-sm border-[3px] border-[#0F172A] rounded-3xl shadow-[0_4px_0_#0F172A]">
               <div></div>
               <button
                  data-vkey="KeyW"
                  type="button"
                  aria-label="เดินขึ้น (W)"
                  class="tactile-btn bg-[#BAE6FD] active:bg-[#7DD3FC] w-12 h-12 sm:w-14 sm:h-14 rounded-2xl flex flex-col items-center justify-center font-bold text-base">
                  <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="#0F172A" stroke-width="3"><path d="M12 19V5M5 12l7-7 7 7" /></svg>
                  <span class="text-[11px] leading-none">W</span>
               </button>
               <div></div>

               <button
                  data-vkey="KeyA"
                  type="button"
                  aria-label="เดินซ้าย (A)"
                  class="tactile-btn bg-[#A7F3D0] active:bg-[#6EE7B7] w-12 h-12 sm:w-14 sm:h-14 rounded-2xl flex flex-col items-center justify-center font-bold text-base">
                  <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="#0F172A" stroke-width="3"><path d="M19 12H5M12 19l-7-7 7-7" /></svg>
                  <span class="text-[11px] leading-none">A</span>
               </button>
               <button
                  data-vkey="KeyS"
                  type="button"
                  aria-label="เดินลง (S)"
                  class="tactile-btn bg-[#FDE68A] active:bg-[#FCD34D] w-12 h-12 sm:w-14 sm:h-14 rounded-2xl flex flex-col items-center justify-center font-bold text-base">
                  <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="#0F172A" stroke-width="3"><path d="M12 5v14M19 12l-7 7-7-7" /></svg>
                  <span class="text-[11px] leading-none">S</span>
               </button>
               <button
                  data-vkey="KeyD"
                  type="button"
                  aria-label="เดินขวา (D)"
                  class="tactile-btn bg-[#FECDD3] active:bg-[#FDA4AF] w-12 h-12 sm:w-14 sm:h-14 rounded-2xl flex flex-col items-center justify-center font-bold text-base">
                  <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="#0F172A" stroke-width="3"><path d="M5 12h14M12 5l7 7-7 7" /></svg>
                  <span class="text-[11px] leading-none">D</span>
               </button>
            </div>

            <!-- Visual Helper Prompt Pill (Center Bottom - Icon Equation Only) -->
            <div id="hudVisualEquation" class="hidden md:flex items-center gap-3 bg-[#FFFDF7]/95 border-[3px] border-[#0F172A] rounded-full px-5 py-2.5 shadow-[0_4px_0_#0F172A]">
               <!-- Dynamically shows e.g. [Character Icon] + [Arrow] + [Target Icon] -->
            </div>

            <!-- Virtual Spacebar Action/Jump Button (Bottom Right) -->
            <div class="pointer-events-auto p-2 bg-[#FFFDF7]/85 backdrop-blur-sm border-[3px] border-[#0F172A] rounded-3xl shadow-[0_4px_0_#0F172A]">
               <button
                  data-vkey="Space"
                  type="button"
                  aria-label="กระโดดหรือเก็บของ (Spacebar)"
                  class="tactile-btn bg-[#DDD6FE] active:bg-[#C4B5FD] px-5 sm:px-7 h-16 sm:h-20 rounded-2xl flex flex-col items-center justify-center font-bold">
                  <svg class="w-7 h-7 sm:w-8 sm:h-8 mb-0.5" viewBox="0 0 24 24" fill="none" stroke="#0F172A" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
                     <path d="M12 19V5" />
                     <path d="M5 12l7-7 7 7" />
                     <path d="M4 21h16" />
                  </svg>
                  <span class="text-xs sm:text-sm tracking-wide">SPACE กระโดด</span>
               </button>
            </div>
         </div>
      </div>

      <!-- ========================================================================
       INTERACTIVE TUTORIAL & TITLE OVERLAY (LIGHT THEME + LIVE WASD/SPACE PLAYGROUND)
       Designed specifically for children with intellectual disabilities:
       - Minimal text, big colorful illustrated keycaps
       - Live interactive canvas where Pui-Mek responds immediately to key presses!
       ======================================================================== -->
      <div id="tutorialOverlay" class="fixed inset-0 z-30 flex items-center justify-center p-3 sm:p-6 bg-[#FEF9C3]/90 backdrop-blur-md overflow-y-auto">
         <div class="w-full max-w-4xl bg-[#FFFDF7] border-[4px] border-[#0F172A] rounded-[2rem] shadow-[0_10px_0_#0F172A] p-4 sm:p-7 flex flex-col gap-4 sm:gap-6 my-auto">
            <!-- Header: Cute Character Emblem & Title (Minimal, joyful) -->
            <div class="flex flex-col sm:flex-row items-center justify-between gap-3 border-b-[3px] border-dashed border-[#CBD5E1] pb-4">
               <div class="flex items-center gap-3 sm:gap-4">
                  <!-- Cute SVG Mascot Emblem -->
                  <div class="w-16 h-16 sm:w-20 sm:h-20 rounded-3xl bg-[#E0F2FE] border-[3px] border-[#0F172A] flex items-center justify-center shadow-[0_4px_0_#0F172A] animate-float shrink-0">
                     <svg class="w-12 h-12 sm:w-14 sm:h-14" viewBox="0 0 64 64">
                        <!-- Bunny/Cloud Ears -->
                        <ellipse cx="22" cy="16" rx="6" ry="12" fill="#FFFFFF" stroke="#0F172A" stroke-width="3" />
                        <ellipse cx="42" cy="16" rx="6" ry="12" fill="#FFFFFF" stroke="#0F172A" stroke-width="3" />
                        <ellipse cx="22" cy="16" rx="3" ry="7" fill="#FBCFE8" />
                        <ellipse cx="42" cy="16" rx="3" ry="7" fill="#FBCFE8" />
                        <!-- Fluffy Body -->
                        <circle cx="32" cy="38" r="20" fill="#FFFFFF" stroke="#0F172A" stroke-width="3" />
                        <!-- Happy Eyes -->
                        <circle cx="25" cy="35" r="3" fill="#0F172A" />
                        <circle cx="39" cy="35" r="3" fill="#0F172A" />
                        <circle cx="26" cy="34" r="1" fill="#FFFFFF" />
                        <circle cx="40" cy="34" r="1" fill="#FFFFFF" />
                        <!-- Rosy Cheeks -->
                        <ellipse cx="20" cy="40" rx="3.5" ry="2" fill="#FDA4AF" />
                        <ellipse cx="44" cy="40" rx="3.5" ry="2" fill="#FDA4AF" />
                        <!-- Cute Smile -->
                        <path d="M28 41 Q32 45 36 41" fill="none" stroke="#0F172A" stroke-width="2.5" stroke-linecap="round" />
                     </svg>
                  </div>
                  <div>
                     <h1 class="text-2xl sm:text-3xl font-bold text-[#0F172A] tracking-tight">น้องปุยเมฆ ผจญภัย</h1>
                     <p class="text-sm sm:text-base font-semibold text-[#334155] flex items-center gap-1.5 mt-0.5">
                        <span>ลองกดปุ่มด้านล่างดูสิ!</span>
                        <span class="inline-block px-2.5 py-0.5 bg-[#DCFCE7] border-2 border-[#0F172A] rounded-full text-xs font-bold text-[#0F172A]">กดได้เลย</span>
                     </p>
                  </div>
               </div>

               <!-- Interactive Checkmarks Progress (5 Keys: W, A, S, D, Space) -->
               <div class="flex items-center gap-1.5 bg-[#F8FAFC] border-[2.5px] border-[#0F172A] rounded-2xl px-3 py-2" aria-label="ความคืบหน้าการทดลองกดปุ่ม">
                  <span id="badge-KeyW" class="w-8 h-8 rounded-xl border-2 border-[#0F172A] bg-white flex items-center justify-center font-bold text-xs transition-colors">W</span>
                  <span id="badge-KeyA" class="w-8 h-8 rounded-xl border-2 border-[#0F172A] bg-white flex items-center justify-center font-bold text-xs transition-colors">A</span>
                  <span id="badge-KeyS" class="w-8 h-8 rounded-xl border-2 border-[#0F172A] bg-white flex items-center justify-center font-bold text-xs transition-colors">S</span>
                  <span id="badge-KeyD" class="w-8 h-8 rounded-xl border-2 border-[#0F172A] bg-white flex items-center justify-center font-bold text-xs transition-colors">D</span>
                  <span id="badge-Space" class="px-2.5 h-8 rounded-xl border-2 border-[#0F172A] bg-white flex items-center justify-center font-bold text-xs transition-colors">SPACE</span>
               </div>
            </div>

            <!-- Main Interactive Tutorial Area: Left = Illustrated Keycaps | Right = Live Mini-Stage -->
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-4 sm:gap-6 items-center">
               <!-- Left Column (7 cols): Tactile Illustrated Keycaps (WASD + Spacebar) -->
               <div class="lg:col-span-7 flex flex-col items-center justify-center gap-4 bg-[#F8FAFC] border-[3px] border-[#0F172A] rounded-3xl p-4 sm:p-5">
                  <!-- WASD Cluster with Cute Icons -->
                  <div class="grid grid-cols-3 gap-2.5 sm:gap-3">
                     <div></div>
                     <!-- W Key (Up) -->
                     <button id="tut-KeyW" type="button" class="keycap bg-[#BAE6FD] hover:bg-[#7DD3FC] w-20 h-20 sm:w-24 sm:h-24 rounded-2xl flex flex-col items-center justify-center cursor-pointer">
                        <svg class="w-7 h-7 sm:w-8 sm:h-8 text-[#0F172A]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                           <path d="M12 19V5M5 12l7-7 7 7" />
                        </svg>
                        <span class="text-xl sm:text-2xl font-bold leading-none mt-0.5">W</span>
                        <span class="text-xs font-bold text-[#0F172A]">ขึ้น</span>
                     </button>
                     <div></div>

                     <!-- A Key (Left) -->
                     <button id="tut-KeyA" type="button" class="keycap bg-[#A7F3D0] hover:bg-[#6EE7B7] w-20 h-20 sm:w-24 sm:h-24 rounded-2xl flex flex-col items-center justify-center cursor-pointer">
                        <svg class="w-7 h-7 sm:w-8 sm:h-8 text-[#0F172A]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                           <path d="M19 12H5M12 19l-7-7 7-7" />
                        </svg>
                        <span class="text-xl sm:text-2xl font-bold leading-none mt-0.5">A</span>
                        <span class="text-xs font-bold text-[#0F172A]">ซ้าย</span>
                     </button>

                     <!-- S Key (Down) -->
                     <button id="tut-KeyS" type="button" class="keycap bg-[#FDE68A] hover:bg-[#FCD34D] w-20 h-20 sm:w-24 sm:h-24 rounded-2xl flex flex-col items-center justify-center cursor-pointer">
                        <svg class="w-7 h-7 sm:w-8 sm:h-8 text-[#0F172A]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                           <path d="M12 5v14M19 12l-7 7-7-7" />
                        </svg>
                        <span class="text-xl sm:text-2xl font-bold leading-none mt-0.5">S</span>
                        <span class="text-xs font-bold text-[#0F172A]">ลง</span>
                     </button>

                     <!-- D Key (Right) -->
                     <button id="tut-KeyD" type="button" class="keycap bg-[#FECDD3] hover:bg-[#FDA4AF] w-20 h-20 sm:w-24 sm:h-24 rounded-2xl flex flex-col items-center justify-center cursor-pointer">
                        <svg class="w-7 h-7 sm:w-8 sm:h-8 text-[#0F172A]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                           <path d="M5 12h14M12 5l7 7-7 7" />
                        </svg>
                        <span class="text-xl sm:text-2xl font-bold leading-none mt-0.5">D</span>
                        <span class="text-xs font-bold text-[#0F172A]">ขวา</span>
                     </button>
                  </div>

                  <!-- Wide SPACEBAR Key with Star-Spring Illustration -->
                  <button
                     id="tut-Space"
                     type="button"
                     class="keycap bg-[#DDD6FE] hover:bg-[#C4B5FD] w-full max-w-[290px] h-16 sm:h-20 rounded-2xl flex items-center justify-center gap-3 px-4 cursor-pointer">
                     <svg class="w-8 h-8 sm:w-9 sm:h-9 shrink-0" viewBox="0 0 24 24" fill="none" stroke="#0F172A" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 2l2.4 7.4h7.6l-6.2 4.5 2.4 7.4-6.2-4.5-6.2 4.5 2.4-7.4-6.2-4.5h7.6z" fill="#FACC15" />
                     </svg>
                     <div class="flex flex-col items-start">
                        <span class="text-lg sm:text-xl font-bold leading-tight">SPACEBAR</span>
                        <span class="text-xs sm:text-sm font-bold text-[#0F172A]">กระโดด / เก็บของ</span>
                     </div>
                  </button>
               </div>

               <!-- Right Column (5 cols): Live Interactive Playground Canvas -->
               <div class="lg:col-span-5 flex flex-col items-center gap-2">

      <!-- ========================================================================
       GAME LOGIC, AUDIO SYNTHESIZER, PROGRESSIVE SCAFFOLDING & 5 UNIQUE STAGES
       ======================================================================== -->
      <script>
         /**
          * ========================================================================
          * 1. GENTLE MULTI-SENSORY AUDIO ENGINE (Web Audio API + Thai Speech)
          *    - Zero external audio files required (100% self-contained)
          *    - Uses soothing C-Major Pentatonic marimba chimes for positive feedback
          * ========================================================================
          */
         class SoundEngine {
            constructor() {
               this.ctx = null;
               this.enabled = true;
            }

            init() {
               if (!this.ctx) {
                  const AudioCtx = window.AudioContext || window.webkitAudioContext;
                  if (AudioCtx) {
                     this.ctx = new AudioCtx();
                  }
               }
               if (this.ctx && this.ctx.state === 'suspended') {
                  this.ctx.resume().catch(() => {});
               }
            }

            playTone(freq, duration = 0.25, type = 'sine', volume = 0.18, delay = 0) {
               if (!this.enabled) return;
               this.init();
               if (!this.ctx) return;

               try {
                  const now = this.ctx.currentTime + delay;
                  const osc = this.ctx.createOscillator();
                  const gain = this.ctx.createGain();

                  osc.type = type;
                  osc.frequency.setValueAtTime(freq, now);

                  gain.gain.setValueAtTime(0.001, now);
                  gain.gain.exponentialRampToValueAtTime(volume, now + 0.02);
                  gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

                  osc.connect(gain);
                  gain.connect(this.ctx.destination);

                  osc.start(now);
                  osc.stop(now + duration + 0.03);
               } catch (e) {
                  // Silently ignore audio block errors
               }
            }

            playStep() {
               this.playTone(261.63, 0.08, 'sine', 0.06); // Soft C4
            }

            playJump() {
               this.playTone(392.0, 0.14, 'sine', 0.15, 0); // G4
               this.playTone(523.25, 0.18, 'sine', 0.15, 0.06); // C5
            }

            playCollect() {
               this.playTone(523.25, 0.15, 'triangle', 0.2, 0); // C5
               this.playTone(659.25, 0.15, 'triangle', 0.2, 0.08); // E5
               this.playTone(783.99, 0.28, 'triangle', 0.2, 0.16); // G5
            }

            playHint() {
               this.playTone(587.33, 0.18, 'sine', 0.14, 0); // D5
               this.playTone(880.0, 0.26, 'sine', 0.14, 0.12); // A5
            }

            playNoteByColor(colorKey) {
               const map = {
                  pink: 523.25, // C5
                  blue: 659.25, // E5
                  yellow: 783.99, // G5
                  green: 1046.5, // C6
               };
               this.playTone(map[colorKey] || 523.25, 0.35, 'triangle', 0.22);
            }

            playVictory() {
               const notes = [523.25, 659.25, 783.99, 1046.5];
               notes.forEach((n, i) => {
                  this.playTone(n, 0.3, 'triangle', 0.22, i * 0.11);
               });
            }

            speakThai(text) {
               try {
                  if ('speechSynthesis' in window) {
                     window.speechSynthesis.cancel();
                     const utter = new SpeechSynthesisUtterance(text);
                     utter.lang = 'th-TH';
                     utter.rate = 0.9; // Slightly slower, clearer pace for children
                     utter.pitch = 1.15; // Friendly warm tone
                     window.speechSynthesis.speak(utter);
                  }
               } catch (e) {
                  // Graceful fallback if speech synthesis is unsupported
               }
            }
         }

         const sound = new SoundEngine();

         /**
          * ========================================================================
          * 2. INPUT MANAGER (Supports WASD, Arrow Keys, Spacebar, Virtual Buttons, & Tap-to-Walk)
          * ========================================================================
          */
         const inputState = {
            up: false,
            down: false,
            left: false,
            right: false,
            jumpPressed: false,
            pointerTarget: null, // { x, y } when child clicks/taps directly on the canvas
         };

         const tutorialTriedKeys = {
            KeyW: false,
            KeyA: false,
            KeyS: false,
            KeyD: false,
            Space: false,
         };

         function handleKeyTrigger(code, isDown) {
            if (isDown) sound.init();

            // Map Arrow keys & WASD uniformly so children never get confused
            if (code === 'KeyW' || code === 'ArrowUp') {
               inputState.up = isDown;
               if (isDown) {
                  inputState.pointerTarget = null;
                  markTutorialKey('KeyW');
               }
            }
            if (code === 'KeyS' || code === 'ArrowDown') {
               inputState.down = isDown;
               if (isDown) {
                  inputState.pointerTarget = null;
                  markTutorialKey('KeyS');
               }
            }
            if (code === 'KeyA' || code === 'ArrowLeft') {
               inputState.left = isDown;
               if (isDown) {
                  inputState.pointerTarget = null;
                  markTutorialKey('KeyA');
               }
            }
            if (code === 'KeyD' || code === 'ArrowRight') {
               inputState.right = isDown;
               if (isDown) {
                  inputState.pointerTarget = null;
                  markTutorialKey('KeyD');
               }
            }
            if (code === 'Space' || code === 'Enter') {
               if (isDown && !inputState.jumpPressed) {
                  inputState.jumpPressed = true;
                  triggerJumpAction();
                  markTutorialKey('Space');
               }
               if (!isDown) {
                  inputState.jumpPressed = false;
               }
            }
         }

         window.addEventListener('keydown', (e) => {
            if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) {
               e.preventDefault();
            }
            handleKeyTrigger(e.code, true);
         });

         window.addEventListener('keyup', (e) => {
            handleKeyTrigger(e.code, false);
         });

         // Bind On-Screen Virtual D-Pad & Spacebar Buttons (Mouse + Touch)
         document.querySelectorAll('[data-vkey]').forEach((btn) => {
            const code = btn.getAttribute('data-vkey');
            const press = (e) => {
               e.preventDefault();
               btn.classList.add('pressed');
               handleKeyTrigger(code, true);
            };
            const release = (e) => {
               e.preventDefault();
               btn.classList.remove('pressed');
               handleKeyTrigger(code, false);
            };
            btn.addEventListener('mousedown', press);
            btn.addEventListener('mouseup', release);
            btn.addEventListener('mouseleave', release);
            btn.addEventListener('touchstart', press, { passive: false });
            btn.addEventListener('touchend', release, { passive: false });
         });

         /**
          * ========================================================================
          * 3. INTERACTIVE TUTORIAL PLAYGROUND (WASD + SPACEBAR VISUAL DEMO)
          * ========================================================================
          */
         const tutorialOverlay = document.getElementById('tutorialOverlay');
         const tutorialCanvas = document.getElementById('tutorialCanvas');
         const tutCtx = tutorialCanvas.getContext('2d');

         const tutPlayer = {
            x: 0.5,
            y: 0.54,
            z: 0, // Jump height
            vz: 0,
            scaleX: 1,
            scaleY: 1,
            facing: 1,
         };

         // 4 directional stars + 1 top bell in the tutorial mini-stage
         let tutTargets = [
            { id: 'KeyW', x: 0.5, y: 0.24, icon: '⭐', color: '#38BDF8', collected: false, bounce: 0 },
            { id: 'KeyA', x: 0.22, y: 0.54, icon: '⭐', color: '#34D399', collected: false, bounce: 1 },
            { id: 'KeyS', x: 0.5, y: 0.82, icon: '⭐', color: '#FBBF24', collected: false, bounce: 2 },
            { id: 'KeyD', x: 0.78, y: 0.54, icon: '⭐', color: '#FB7185', collected: false, bounce: 3 },
         ];
         let tutBell = { x: 0.5, y: 0.36, ringTimer: 0 };
         let tutParticles = [];

         function markTutorialKey(keyId) {
            // Visual keycap highlight in the Tutorial UI
            const keyEl = document.getElementById(`tut-${keyId}`);
            if (keyEl) {
               keyEl.classList.add('active-key');
               setTimeout(() => keyEl.classList.remove('active-key'), 180);
            }

            if (!tutorialTriedKeys[keyId]) {
               tutorialTriedKeys[keyId] = true;
               const badge = document.getElementById(`badge-${keyId}`);
               if (badge) {
                  badge.style.backgroundColor = '#86EFAC';
                  badge.innerHTML = '✓';
               }
            }
         }

         // Allow clicking/tapping the big illustrated keycaps inside the Tutorial UI
         ['KeyW', 'KeyA', 'KeyS', 'KeyD', 'Space'].forEach((code) => {
            const el = document.getElementById(`tut-${code}`);
            if (!el) return;
            const triggerDemo = (e) => {
               e.preventDefault();
               sound.init();
               markTutorialKey(code);

               if (code === 'KeyW') tutPlayer.y = Math.max(0.22, tutPlayer.y - 0.14);
               if (code === 'KeyS') tutPlayer.y = Math.min(0.84, tutPlayer.y + 0.14);
               if (code === 'KeyA') {
                  tutPlayer.x = Math.max(0.2, tutPlayer.x - 0.14);
                  tutPlayer.facing = -1;
               }
               if (code === 'KeyD') {
                  tutPlayer.x = Math.min(0.8, tutPlayer.x + 0.14);
                  tutPlayer.facing = 1;
               }
               if (code === 'Space') {
                  tutPlayer.vz = 0.032;
                  tutPlayer.scaleX = 0.8;
                  tutPlayer.scaleY = 1.25;
                  sound.playJump();
                  tutBell.ringTimer = 1.0;
                  spawnTutSparkles(tutPlayer.x, tutPlayer.y - 0.12, '#A855F7');
               } else {
                  sound.playStep();
               }
            };
            el.addEventListener('click', triggerDemo);
         });

         function spawnTutSparkles(nx, ny, color) {
            for (let i = 0; i < 8; i++) {
               const angle = (Math.PI * 2 * i) / 8;
               tutParticles.push({
                  x: nx,
                  y: ny,
                  vx: Math.cos(angle) * 0.008,
                  vy: Math.sin(angle) * 0.008,
                  life: 1.0,
                  color,
               });
            }
         }

         function updateAndDrawTutorialCanvas(dt) {
            if (tutorialOverlay.classList.contains('hidden')) return;

            const rect = tutorialCanvas.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            if (tutorialCanvas.width !== Math.floor(rect.width * dpr)) {
               tutorialCanvas.width = Math.floor(rect.width * dpr);
               tutorialCanvas.height = Math.floor(rect.height * dpr);
            }

            const w = tutorialCanvas.width;
            const h = tutorialCanvas.height;
            tutCtx.clearRect(0, 0, w, h);

            // Update tutorial Pui-Mek movement from live keyboard input
            const speed = 0.45 * dt;
            if (inputState.up) tutPlayer.y = Math.max(0.22, tutPlayer.y - speed);
            if (inputState.down) tutPlayer.y = Math.min(0.84, tutPlayer.y + speed);
            if (inputState.left) {
               tutPlayer.x = Math.max(0.2, tutPlayer.x - speed);
               tutPlayer.facing = -1;
            }
            if (inputState.right) {
               tutPlayer.x = Math.min(0.8, tutPlayer.x + speed);
               tutPlayer.facing = 1;
            }

            // Jump physics in tutorial
            if (tutPlayer.z > 0 || tutPlayer.vz !== 0) {
               tutPlayer.z += tutPlayer.vz;
               tutPlayer.vz -= 0.0022;
               if (tutPlayer.z <= 0) {
                  tutPlayer.z = 0;
                  tutPlayer.vz = 0;
                  tutPlayer.scaleX = 1.2;
                  tutPlayer.scaleY = 0.82;
               }
            }
            tutPlayer.scaleX += (1 - tutPlayer.scaleX) * 0.18;
            tutPlayer.scaleY += (1 - tutPlayer.scaleY) * 0.18;

            // Soft decorative grass meadow circles
            tutCtx.fillStyle = '#D1FAE5';
            tutCtx.beginPath();
            tutCtx.arc(w * 0.5, h * 0.55, w * 0.38, 0, Math.PI * 2);
            tutCtx.fill();

            // Draw directional guide lines from center
            tutCtx.strokeStyle = '#94A3B8';
            tutCtx.lineWidth = 2 * dpr;
            tutCtx.setLineDash([6 * dpr, 6 * dpr]);
            tutCtx.beginPath();
            tutCtx.moveTo(w * 0.5, h * 0.24);
            tutCtx.lineTo(w * 0.5, h * 0.82);
            tutCtx.moveTo(w * 0.22, h * 0.54);
            tutCtx.lineTo(w * 0.78, h * 0.54);
            tutCtx.stroke();
            tutCtx.setLineDash([]);

            // Draw 4 directional stars
            const time = performance.now() * 0.004;
            tutTargets.forEach((t) => {
               const dist = Math.hypot(tutPlayer.x - t.x, tutPlayer.y - t.y);
               if (dist < 0.13 && !t.collected) {
                  t.collected = true;
                  sound.playCollect();
                  spawnTutSparkles(t.x, t.y, t.color);
                  // Respawn star gently after 2 seconds so child can keep playing
                  setTimeout(() => {
                     t.collected = false;
                  }, 2200);
               }

               const bob = Math.sin(time + t.bounce) * 4 * dpr;
               const tx = t.x * w;
               const ty = t.y * h + bob;

               tutCtx.fillStyle = t.collected ? '#E2E8F0' : t.color;
               tutCtx.strokeStyle = '#0F172A';
               tutCtx.lineWidth = 2.5 * dpr;
               tutCtx.beginPath();
               tutCtx.arc(tx, ty, 16 * dpr, 0, Math.PI * 2);
               tutCtx.fill();
               tutCtx.stroke();

               tutCtx.font = `bold ${15 * dpr}px Mali, sans-serif`;
               tutCtx.textAlign = 'center';
               tutCtx.textBaseline = 'middle';
               tutCtx.fillStyle = '#0F172A';
               tutCtx.fillText(t.collected ? '✓' : '★', tx, ty + 1 * dpr);
            });

            // Draw Spacebar Golden Bell above center
            if (tutBell.ringTimer > 0) tutBell.ringTimer = Math.max(0, tutBell.ringTimer - dt * 1.8);
            const bellAngle = Math.sin(tutBell.ringTimer * 25) * 0.35 * tutBell.ringTimer;
            tutCtx.save();
            tutCtx.translate(w * 0.5, h * 0.37);
            tutCtx.rotate(bellAngle);
            tutCtx.fillStyle = tutBell.ringTimer > 0 ? '#FDE047' : '#FEF08A';
            tutCtx.strokeStyle = '#0F172A';
            tutCtx.lineWidth = 2.5 * dpr;
            tutCtx.beginPath();
            tutCtx.arc(0, 0, 15 * dpr, 0, Math.PI * 2);
            tutCtx.fill();
            tutCtx.stroke();
            tutCtx.font = `${16 * dpr}px sans-serif`;
            tutCtx.textAlign = 'center';
            tutCtx.textBaseline = 'middle';
            tutCtx.fillText('🔔', 0, 1 * dpr);
            tutCtx.restore();

            // Draw Pui-Mek Character in Tutorial Arena
            drawPuiMek(tutCtx, tutPlayer.x * w, (tutPlayer.y - tutPlayer.z) * h, 24 * dpr, tutPlayer.scaleX, tutPlayer.scaleY, tutPlayer.facing, false);

            // Update & draw tutorial sparkles
            for (let i = tutParticles.length - 1; i >= 0; i--) {
               const p = tutParticles[i];
               p.x += p.vx;
               p.y += p.vy;
               p.life -= dt * 1.8;
               if (p.life <= 0) {
                  tutParticles.splice(i, 1);
                  continue;
               }
               tutCtx.globalAlpha = p.life;
               tutCtx.fillStyle = p.color;
               tutCtx.beginPath();
               tutCtx.arc(p.x * w, p.y * h, 5 * dpr * p.life, 0, Math.PI * 2);
               tutCtx.fill();
               tutCtx.globalAlpha = 1;
            }
         }

         /**
          * ========================================================================
          * 4. MAIN ADVENTURE GAME STATE & 5 DISTINCT NON-REPETITIVE STAGES
          * ========================================================================
          */
         const canvas = document.getElementById('gameCanvas');
         const ctx = canvas.getContext('2d');

         const game = {
            started: false,
            currentStageIndex: 0,
            stageScores: [0, 0, 0, 0, 0], // 30 pts from steps + 20 pts completion bonus = 50 pts per stage (250 max)
            stageComplete: false,
            idleTimer: 0,
            hintLevel: 0, // 0 = None, 1 = Target Glow, 2 = Path + Ghost Demo, 3 = Direct Guide/Auto-Assist
