<!doctype html>
<html lang="th">
   <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
      <title>AR Color Spelling Game: Magic Spell — Colors Collection</title>
      <!-- โหลดฟอนต์อ่านง่ายสำหรับเด็กประถมศึกษาและผู้มีภาวะ Dyslexia -->
      <link rel="preconnect" href="https://fonts.googleapis.com" />
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
      <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet" />
      <!-- MediaPipe Hands สำหรับตรวจจับมือ 21 จุดแบบเรียลไทม์ (มีระบบ Fallback อัตโนมัติหากไม่มีอินเทอร์เน็ตหรือกล้อง) -->
      <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

      <style>
         :root {
            --bg-pastel-1: #e0f2fe;
            --bg-pastel-2: #f3e8ff;
            --bg-pastel-3: #fef3c7;
            --card-bg: rgba(255, 255, 255, 0.96);
            --card-border: #ffffff;
            --text-main: #1e1b4b;
            --text-muted: #6366f1;
            --accent-mint: #10b981;
            --accent-gold: #f59e0b;
            --accent-gold-bg: #fef08a;
            --accent-purple: #8b5cf6;
            --accent-blue: #3b82f6;
            --shadow-soft: 0 8px 0 rgba(30, 27, 75, 0.14), 0 16px 32px rgba(15, 23, 42, 0.18);
            --font-en: 'Fredoka', sans-serif;
            --font-th: 'Prompt', sans-serif;
         }

         body.high-contrast {
            --card-bg: #ffffff;
            --card-border: #0f172a;
            --text-main: #000000;
            --text-muted: #1e293b;
            --accent-gold-bg: #fde047;
         }

         * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
         }

         html,
         body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: var(--font-th);
            color: var(--text-main);
            background: linear-gradient(135deg, #e0f2fe 0%, #f5d0fe 50%, #fef3c7 100%);
            touch-action: manipulation;
         }

         /* พื้นที่เกมหลักเต็มหน้าจอ Fullscreen ไม่มี Navbar */
         #app-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
         }

         /* แคนวาส AR และฟองอากาศ */
         #game-canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
            z-index: 1;
         }

         /* ซ่อนแท็กวิดีโอกล้องต้นฉบับ */
         #webcam-video {
            display: none;
         }

         /* ปุ่มลอยมุมซ้ายบนและขวาบน (ไม่มีแถบ Navbar) */
         .floating-top-left {
            position: absolute;
            top: 16px;
            left: 16px;
            z-index: 12;
            display: flex;
            align-items: center;
            gap: 10px;
         }

         .floating-top-right {
            position: absolute;
            top: 16px;
            right: 16px;
            z-index: 12;
            display: flex;
            align-items: center;
            gap: 10px;
         }

         .score-pill {
            display: flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(180deg, #fef9c3 0%, #fde047 100%);
            border: 3px solid #ffffff;
            padding: 8px 18px;
            border-radius: 999px;
            font-family: var(--font-en);
            font-weight: 700;
            font-size: 20px;
            color: #78350f;
            box-shadow:
               0 5px 0 #eab308,
               0 10px 20px rgba(15, 23, 42, 0.16);
         }

         body.high-contrast .score-pill {
            color: #000000;
            border-color: #000000;
         }

         .icon-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 3px solid #ffffff;
            background: linear-gradient(180deg, #ffffff 0%, #f1f5f9 100%);
            color: #312e81;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow:
               0 5px 0 #cbd5e1,
               0 10px 18px rgba(15, 23, 42, 0.16);
            transition:
               transform 0.12s ease,
               box-shadow 0.12s ease;
         }

         .icon-btn:hover,
         .icon-btn:focus-visible {
            transform: translateY(-2px);
            outline: 3px solid #fde047;
         }

         .icon-btn:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #cbd5e1;
         }

         /* ป้ายวงกลมสีโจทย์ตรงกลางสไตล์เหรียญเวทมนตร์ */
         #center-prompt-card {
            position: absolute;
            top: 44%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 8;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.95);
            border: 4px solid #ffffff;
            border-radius: 36px;
            padding: 14px 24px 16px;
            box-shadow:
               0 8px 0 rgba(99, 102, 241, 0.22),
               0 18px 36px rgba(15, 23, 42, 0.18);
            pointer-events: auto;
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
         }

         .color-swatch-ring {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            padding: 6px;
            background: linear-gradient(135deg, #fde047, #ffffff, #a5b4fc);
            box-shadow:
               0 6px 16px rgba(0, 0, 0, 0.14),
               inset 0 2px 4px rgba(255, 255, 255, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
         }

         #prompt-color-circle {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.9);
            box-shadow:
               inset 0 -6px 12px rgba(0, 0, 0, 0.16),
               inset 0 6px 10px rgba(255, 255, 255, 0.5);
            transition: background-color 0.3s ease;
         }

         .prompt-label-row {
            display: flex;
            align-items: center;
            gap: 10px;
         }

         #prompt-thai-text {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: 0.5px;
         }

         .speak-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(180deg, #60a5fa 0%, #2563eb 100%);
            color: #ffffff;
            border: 3px solid #ffffff;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow:
               0 4px 0 #1d4ed8,
               0 8px 14px rgba(37, 99, 235, 0.3);
            transition:
               transform 0.12s ease,
               box-shadow 0.12s ease;
         }

         .speak-btn:hover {
            transform: scale(1.08);
         }

         .speak-btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #1d4ed8;
         }

         /* ถาดช่องสะกดคำด้านล่างสไตล์แท่นอัญมณี */
         #bottom-spelling-area {
            position: absolute;
            bottom: 22px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            width: min(96vw, 720px);
            pointer-events: auto;
         }

         #slots-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            flex-wrap: nowrap;
            background: rgba(255, 255, 255, 0.96);
            border: 4px solid #ffffff;
            padding: 14px 22px;
            border-radius: 32px;
            box-shadow:
               0 8px 0 rgba(99, 102, 241, 0.2),
               0 16px 32px rgba(15, 23, 42, 0.18);
         }

         body.high-contrast #slots-container {
            background: #ffffff;
            border-color: #000000;
         }

         .letter-slot {
            width: clamp(50px, 11.5vw, 74px);
            height: clamp(58px, 12.5vw, 82px);
            border-radius: 22px;
            background: #f1f5f9;
            border: 3px dashed #94a3b8;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-en);
            font-size: clamp(28px, 6.2vw, 44px);
            font-weight: 700;
            color: var(--text-main);
            box-shadow: inset 0 4px 8px rgba(15, 23, 42, 0.1);
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
         }

         .letter-slot.next-target {
            border-color: #3b82f6;
            background: #dbeafe;
            transform: scale(1.06);
            box-shadow:
               0 0 0 4px rgba(59, 130, 246, 0.3),
               inset 0 2px 6px rgba(59, 130, 246, 0.2);
         }

         .letter-slot.filled {
            border-style: solid;
            border-width: 3px;
            border-color: #ffffff;
            background: linear-gradient(180deg, #34d399 0%, #059669 100%);
            color: #ffffff;
            text-shadow: 0 2px 0 rgba(6, 78, 59, 0.45);
            transform: scale(1.05);
            box-shadow:
               0 5px 0 #047857,
               0 8px 16px rgba(16, 185, 129, 0.3);
         }

         .letter-slot.celebrate {
            animation: slotWave 0.55s ease forwards;
            border-color: #ffffff;
            background: linear-gradient(180deg, #fde047 0%, #f59e0b 100%);
            color: #78350f;
            text-shadow: none;
            box-shadow: 0 5px 0 #b45309;
         }

         @keyframes slotWave {
            0% {
               transform: translateY(0) scale(1.05);
            }
            45% {
               transform: translateY(-16px) scale(1.18);
            }
            100% {
               transform: translateY(0) scale(1.06);
            }
         }

         /* แถบแจ้งเตือนสั้นๆ สไตล์เกม */
         #toast-banner {
            position: absolute;
            top: 78px;
            left: 50%;
            transform: translateX(-50%) translateY(-16px);
            z-index: 25;
            background: #ffffff;
            border: 3px solid #f59e0b;
            color: #1e1b4b;
            padding: 8px 20px;
            border-radius: 999px;
            font-size: 16px;
            font-weight: 700;
            opacity: 0;
            pointer-events: none;
            transition:
               opacity 0.2s ease,
               transform 0.2s ease;
            box-shadow:
               0 6px 0 rgba(245, 158, 11, 0.25),
               0 12px 24px rgba(0, 0, 0, 0.15);
            text-align: center;
            max-width: 90vw;
         }

         #toast-banner.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
         }

         /* หน้าจอเริ่มเกม Fullscreen สไตล์เกมเวทมนตร์ (Light Theme + Visual Art) */
         #start-screen {
            position: fixed;
            inset: 0;
            z-index: 60;
            background: radial-gradient(circle at 50% 25%, #ffffff 0%, #e0f2fe 45%, #f3e8ff 85%, #fce7f3 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
         }

         #start-screen.hidden {
            display: none;
         }

         /* ฟองอากาศตกแต่งลอยฉากหลังหน้าเริ่มเกม */
         .deco-bubble {
            position: absolute;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-en);
            font-weight: 700;
            color: #ffffff;
            border: 3px solid #ffffff;
            box-shadow:
               inset -6px -6px 14px rgba(0, 0, 0, 0.12),
               inset 6px 6px 12px rgba(255, 255, 255, 0.65),
               0 10px 24px rgba(99, 102, 241, 0.18);
            animation: floatDeco 4.5s ease-in-out infinite;
            pointer-events: none;
         }

         @keyframes floatDeco {
            0%,
            100% {
               transform: translateY(0px) rotate(-4deg);
            }
            50% {
               transform: translateY(-16px) rotate(4deg);
            }
         }

         .start-hero-box {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 520px;
            width: 100%;
         }

         .game-logo-art {
            width: min(86vw, 360px);
            height: auto;
            filter: drop-shadow(0 12px 20px rgba(79, 70, 229, 0.22));
            margin-bottom: 12px;
            animation: heroBounce 3s ease-in-out infinite;
         }

         @keyframes heroBounce {
            0%,
            100% {
               transform: translateY(0);
            }
            50% {
               transform: translateY(-8px);
            }
         }

         /* แผงปุ่มเล่นขนาดใหญ่แบบไอคอนและภาพประกอบ */
         .play-modes-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            width: 100%;
            margin-top: 8px;
         }

         .mode-tile-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 22px 14px;
            border-radius: 32px;
            border: 4px solid #ffffff;
            cursor: pointer;
            transition:
               transform 0.14s cubic-bezier(0.34, 1.56, 0.64, 1),
               box-shadow 0.14s ease;
         }

         .mode-tile-btn:hover {
            transform: translateY(-5px) scale(1.02);
         }

         .mode-tile-btn:active {
            transform: translateY(4px) scale(0.98);
         }

         .tile-ar {
            background: linear-gradient(180deg, #34d399 0%, #059669 100%);
            color: #ffffff;
            box-shadow:
               0 8px 0 #047857,
               0 18px 32px rgba(16, 185, 129, 0.35);
         }

         .tile-ar:active {
            box-shadow: 0 2px 0 #047857;
         }

         .tile-touch {
            background: linear-gradient(180deg, #60a5fa 0%, #2563eb 100%);
            color: #ffffff;
            box-shadow:
               0 8px 0 #1d4ed8,
               0 18px 32px rgba(37, 99, 235, 0.35);
         }

         .tile-touch:active {
            box-shadow: 0 2px 0 #1d4ed8;
         }

         .tile-icon-badge {
            width: 72px;
            height: 72px;
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.25);
            border: 3px solid rgba(255, 255, 255, 0.75);
            display: flex;
            align-items: center;
            justify-content: center;
         }

         .tile-label {
            font-family: var(--font-en);
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 0 rgba(0, 0, 0, 0.2);
         }

         .start-floating-gear {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 5;
         }

         /* หน้าต่าง Overlay สไตล์เกม 3D (Light Theme) */
         .modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 70;
            background: rgba(241, 245, 249, 0.78);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
         }

         .modal-overlay.hidden {
            display: none;
         }

         .modal-card {
            background: #ffffff;
            border: 5px solid #e0e7ff;
            border-radius: 36px;
            width: min(94vw, 520px);
            max-height: 92vh;
            overflow-y: auto;
            padding: 26px 22px;
            box-shadow:
               0 10px 0 #c7d2fe,
               0 24px 48px rgba(30, 27, 75, 0.18);
            text-align: center;
         }

         .modal-title {
            font-family: var(--font-en);
            font-size: clamp(28px, 6vw, 38px);
            font-weight: 700;
            color: #312e81;
            margin-bottom: 14px;
         }

         .btn-large {
            width: 100%;
            padding: 15px 22px;
            border-radius: 24px;
            border: 3px solid #ffffff;
            font-family: var(--font-en);
            font-size: 22px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition:
               transform 0.12s ease,
               box-shadow 0.12s ease;
         }

         .btn-large:active {
            transform: translateY(4px);
         }

         .btn-ar {
            background: linear-gradient(180deg, #34d399 0%, #059669 100%);
            color: #ffffff;
            text-shadow: 0 2px 0 rgba(6, 78, 59, 0.35);
            box-shadow:
               0 6px 0 #047857,
               0 12px 24px rgba(16, 185, 129, 0.3);
         }

         .btn-ar:active {
            box-shadow: 0 2px 0 #047857;
         }

         /* ฟอร์มตั้งค่า Accessibility กระชับด้วยไอคอน */
         .settings-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            text-align: left;
            margin-bottom: 20px;
         }

         .setting-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            background: #f8fafc;
            border: 2px solid #e2e8f0;
            padding: 12px 16px;
            border-radius: 22px;
         }

         .setting-label {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 16px;
            color: #1e1b4b;
         }

         select.accessible-select {
            padding: 8px 12px;
            border-radius: 14px;
            border: 2px solid #cbd5e1;
            font-family: var(--font-th);
            font-size: 14px;
            font-weight: 700;
            background: #ffffff;
            color: #1e1b4b;
            cursor: pointer;
         }

         input[type='checkbox'].accessible-toggle {
            width: 28px;
            height: 28px;
            accent-color: #10b981;
            cursor: pointer;
         }

         /* ตารางสมุดสะสม 12 สีเมื่อจบเกม */
         .collection-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 12px;
            margin: 14px 0 20px;
         }

         .color-card-item {
            background: #f8fafc;
            border: 3px solid #e2e8f0;
            border-radius: 22px;
            padding: 12px 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            box-shadow: 0 4px 0 #cbd5e1;
            transition:
               transform 0.12s ease,
               border-color 0.12s ease;
         }

         .color-card-item:hover {
            transform: translateY(-3px);
            border-color: #6366f1;
         }

         .color-card-item:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #cbd5e1;
         }

         .mini-swatch {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            border: 3px solid #ffffff;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.18);
         }

         .card-en {
            font-family: var(--font-en);
            font-weight: 700;
            font-size: 18px;
            color: #1e1b4b;
         }

         .card-th {
            font-size: 13px;
            font-weight: 600;
            color: #64748b;
         }

         /* ป้ายฝึกเล่น Tutorial แบบไอคอนกระชับ */
         #tutorial-banner {
            position: absolute;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 12;
            background: linear-gradient(180deg, #fef08a 0%, #fde047 100%);
            border: 3px solid #ffffff;
            color: #78350f;
            padding: 6px 12px 6px 16px;
            border-radius: 999px;
            font-family: var(--font-en);
            font-size: 16px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow:
               0 5px 0 #eab308,
               0 10px 20px rgba(0, 0, 0, 0.15);
         }

         #tutorial-banner.hidden {
            display: none;
         }

         .skip-tut-btn {
            background: linear-gradient(180deg, #fb923c 0%, #ea580c 100%);
            color: #ffffff;
            border: 2px solid #ffffff;
            border-radius: 999px;
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 3px 0 #9a3412;
         }

         .skip-tut-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #9a3412;
         }

         @media (max-width: 600px) {
            .score-pill {
               font-size: 17px;
               padding: 6px 14px;
            }
            .icon-btn {
               width: 44px;
               height: 44px;
            }
            #center-prompt-card {
               padding: 12px 18px;
               top: 43%;
            }
            .color-swatch-ring {
               width: 76px;
               height: 76px;
            }
            #prompt-thai-text {
               font-size: 22px;
            }
            .play-modes-row {
               gap: 12px;
            }
            .mode-tile-btn {
               padding: 18px 10px;
            }
         }
      </style>
   </head>
   <body>
      <div id="app-container">
         <!-- กล้องเว็บแคม (ซ่อนไว้และวาดลง Canvas) -->
         <video id="webcam-video" playsinline autoplay muted></video>
         <!-- พื้นที่วาด AR, เส้นมือ 21 จุด, ฟองอากาศตัวอักษร และเอฟเฟกต์ -->
         <canvas id="game-canvas"></canvas>

         <!-- ปุ่มลอยมุมซ้ายบน (คะแนนดาว 1/12) -->
         <div class="floating-top-left">
            <div class="score-pill" id="score-display" aria-live="polite">
               <svg width="24" height="24" viewBox="0 0 24 24" fill="#f59e0b" stroke="#92400e" stroke-width="2">

         /**

         const COLOR_WORDS = [
            { word: 'RED', thai: 'สีแดง', hex: '#ef4444', distractors: ['B', 'P'] },
            { word: 'BLUE', thai: 'สีน้ำเงิน', hex: '#2563eb', distractors: ['D', 'O'] },

            { word: 'GREEN', thai: 'สีเขียว', hex: '#16a34a', distractors: ['A', 'L', 'B'] },
            { word: 'BROWN', thai: 'สีน้ำตาล', hex: '#854d0e', distractors: ['P', 'D', 'L'] },

         // ชุดสีสำหรับฟองอากาศลอยตัว (Glossy Bubble Gradients)

            { top: '#6ee7b7', mid: '#10b981', rim: '#a7f3d0' }, // เขียวมินต์
            { top: '#fca5a5', mid: '#ef4444', rim: '#fecaca' }, // แดงปะการัง

            { top: '#93c5fd', mid: '#3b82f6', rim: '#bfdbfe' }, // ฟ้าสดใส

         ];

         /**
          * ============================================================================
          * 2. สถานะของเกมและการตั้งค่า (Game State & Accessibility Config)

            mode: 'start', // 'start' | 'tutorial' | 'playing' | 'completed'
            currentIndex: 0,
            slots: [], // [{ targetChar, filledChar, isFilled }]
            bubbles: [], // ฟองอากาศตัวอักษรบนหน้าจอ

         const ctx = canvas.getContext('2d');

         const slotsContainer = document.getElementById('slots-container');
         const scoreTextEl = document.getElementById('score-text');
         const promptColorCircle = document.getElementById('prompt-color-circle');
         const promptThaiText = document.getElementById('prompt-thai-text');
         const toastBanner = document.getElementById('toast-banner');

         /**
          * ============================================================================
          * 3. ระบบเสียงสังเคราะห์ (Web Audio API) และเสียงอ่านสองภาษา (Web Speech API)
          * ============================================================================
          */
         let audioCtx = null;

         function initAudio() {
            if (!audioCtx) {
               const AudioContextClass = window.AudioContext || window.webkitAudioContext;
               if (AudioContextClass) {
                  audioCtx = new AudioContextClass();
               }
            }
            if (audioCtx && audioCtx.state === 'suspended') {
               audioCtx.resume();
            }
         }

         // เสียงฟองสบู่แตกและโน้ตดนตรีไล่ระดับ
         function playPopSound(stepIndex = 0) {
            if (state.settings.muted) return;
            initAudio();
            if (!audioCtx) return;

            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            // โน้ต Pentatonic สดใสไล่ระดับตามจำนวนตัวอักษรที่วางถูก
            const scale = [523.25, 587.33, 659.25, 783.99, 880.0, 1046.5];
            const baseFreq = scale[stepIndex % scale.length];

            osc.type = 'sine';
            osc.frequency.setValueAtTime(baseFreq * 0.75, now);
            osc.frequency.exponentialRampToValueAtTime(baseFreq * 1.35, now + 0.14);

            gain.gain.setValueAtTime(0.28, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);

            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.23);
         }

         // เสียงเตือนนุ่มนวลเมื่อหยิบตัวอักษรผิด
         function playGentleBounceSound() {
            if (state.settings.muted) return;
            initAudio();
            if (!audioCtx) return;

            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'triangle';
            osc.frequency.setValueAtTime(260, now);
            osc.frequency.linearRampToValueAtTime(195, now + 0.18);

            gain.gain.setValueAtTime(0.18, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);

            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.21);
         }

         // เสียงดนตรีฉลองเมื่อสะกดครบทั้งคำ
         function playWordCompleteFanfare() {
            if (state.settings.muted) return;
            initAudio();
            if (!audioCtx) return;

            const notes = [523.25, 659.25, 783.99, 1046.5];
            notes.forEach((freq, idx) => {
               const now = audioCtx.currentTime + idx * 0.09;
               const osc = audioCtx.createOscillator();
               const gain = audioCtx.createGain();

               osc.type = 'triangle';
               osc.frequency.setValueAtTime(freq, now);

               gain.gain.setValueAtTime(0.24, now);
               gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);

               osc.connect(gain);
               gain.connect(audioCtx.destination);
               osc.start(now);
               osc.stop(now + 0.36);
            });
         }

         // อ่านออกเสียงสองภาษา (en-US และ th-TH)
         function speakBilingualPrompt(wordObj) {
            if (state.settings.muted || !('speechSynthesis' in window)) return;
            try {
               window.speechSynthesis.cancel();

               const enUtter = new SpeechSynthesisUtterance(wordObj.word.toLowerCase());
               enUtter.lang = 'en-US';
               enUtter.rate = 0.88;

               const thUtter = new SpeechSynthesisUtterance(wordObj.thai);
               thUtter.lang = 'th-TH';
               thUtter.rate = 0.95;

               window.speechSynthesis.speak(enUtter);
               window.speechSynthesis.speak(thUtter);
            } catch (err) {
               // ข้ามหากเบราว์เซอร์จำกัดเสียงสังเคราะห์
            }
         }

         function speakSingleLetter(letter) {
            if (state.settings.muted || !('speechSynthesis' in window)) return;
            try {
               window.speechSynthesis.cancel();
               const utter = new SpeechSynthesisUtterance(letter.toLowerCase());
               utter.lang = 'en-US';
               utter.rate = 0.95;
               window.speechSynthesis.speak(utter);
            } catch (err) {}
         }

         function speakCompletedWord(wordObj) {
            if (state.settings.muted || !('speechSynthesis' in window)) return;
            try {
               window.speechSynthesis.cancel();
               const utter = new SpeechSynthesisUtterance(`${wordObj.word.toLowerCase()}! ${wordObj.thai}`);
               utter.lang = 'en-US';
               utter.rate = 0.9;
               window.speechSynthesis.speak(utter);
            } catch (err) {}
         }

         // แสดงข้อความแจ้งเตือนชั่วคราวบนหน้าจอ
         let toastTimer = null;
         function showToast(message, duration = 2200) {
            toastBanner.textContent = message;
            toastBanner.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
               toastBanner.classList.remove('show');
            }, duration);
         }

         /**
          * ============================================================================
          * 4. ระบบจัดการโจทย์คำศัพท์ ฟองอากาศ และการตรวจสอบการสะกดคำ
          * ============================================================================
          */
         function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
         }
         window.addEventListener('resize', resizeCanvas);
         resizeCanvas();

         function getCurrentWordObj() {
            if (state.mode === 'tutorial') {
               return { word: 'RED', thai: 'สีแดง', hex: '#ef4444', distractors: ['K'] };
            }
            return COLOR_WORDS[state.currentIndex];
         }

         function loadLevel(index) {
            state.isTransitioning = false;
            state.grabbedBubble = null;
            state.dwellTargetId = null;
            state.dwellProgress = 0;

            const wordObj = getCurrentWordObj();

            // อัปเดต HUD คะแนนและป้ายสีตรงกลาง
            if (state.mode === 'tutorial') {
               scoreTextEl.textContent = 'TUTORIAL';
            } else {
               scoreTextEl.textContent = `${index + 1} / ${COLOR_WORDS.length}`;
            }

            promptColorCircle.style.backgroundColor = wordObj.hex;
            promptThaiText.textContent = wordObj.thai;

            // สร้างช่องสะกดคำด้านล่าง
            state.slots = wordObj.word.split('').map((ch) => ({
               targetChar: ch,
               filledChar: '',
               isFilled: false,
            }));
            renderSlots();

            // สร้างรายการตัวอักษรทั้งหมด (ตัวจริง + ตัวลวง)
            const chars = [...wordObj.word.split(''), ...wordObj.distractors];
            // สลับลำดับแบบสุ่ม
            for (let i = chars.length - 1; i > 0; i--) {
               const j = Math.floor(Math.random() * (i + 1));
               [chars[i], chars[j]] = [chars[j], chars[i]];
            }

            spawnBubbles(chars);
            speakBilingualPrompt(wordObj);
         }

         // สร้างฟองอากาศตัวอักษรโดยจัดตำแหน่งกระจายรอบป้ายสีตรงกลางไม่ให้ทับซ้อนกัน
         function spawnBubbles(chars) {
            state.bubbles = [];
            const w = canvas.width;
            const h = canvas.height;
            const radius = Math.max(36, Math.min(54, Math.min(w, h) * 0.068));

            const centerSafeX = w * 0.5;
            const centerSafeY = h * 0.45;
            const safeRectW = Math.min(320, w * 0.55);
            const safeRectH = 220;

            chars.forEach((char, idx) => {
               let bx = 0;
               let by = 0;
               let valid = false;
               let attempts = 0;

               while (!valid && attempts < 120) {
                  attempts++;
                  bx = radius + 24 + Math.random() * (w - (radius + 24) * 2);
                  by = 95 + radius + Math.random() * (h - 245 - radius * 2);

                  // หลีกเลี่ยงป้ายสีตรงกลาง
                  const inCenterCard = Math.abs(bx - centerSafeX) < safeRectW * 0.5 + radius && Math.abs(by - centerSafeY) < safeRectH * 0.5 + radius;

                  if (inCenterCard) continue;

                  // หลีกเลี่ยงการซ้อนทับกับฟองอื่น
                  const overlapsOther = state.bubbles.some((other) => {
                     const dx = bx - other.x;
                     const dy = by - other.y;
                     return Math.hypot(dx, dy) < radius + other.radius + 16;
                  });

                  if (!overlapsOther) valid = true;
               }

               const angle = Math.random() * Math.PI * 2;
               const baseSpeed = 48 + Math.random() * 26;

               state.bubbles.push({
                  id: `bubble-${idx}-${Date.now()}`,
                  char,
                  x: bx,
                  y: by,
                  vx: Math.cos(angle) * baseSpeed,
                  vy: Math.sin(angle) * baseSpeed,
                  radius,
                  palette: BUBBLE_PALETTES[idx % BUBBLE_PALETTES.length],
                  bobPhase: Math.random() * Math.PI * 2,
                  shakeTimer: 0,
                  scale: 1,
               });
            });
         }

         function renderSlots() {
            slotsContainer.innerHTML = '';
            const nextEmptyIdx = state.slots.findIndex((s) => !s.isFilled);

            state.slots.forEach((slot, idx) => {
               const slotEl = document.createElement('div');
               slotEl.className = 'letter-slot';
               if (slot.isFilled) {
                  slotEl.classList.add('filled');
                  slotEl.textContent = slot.filledChar;
               } else if (state.settings.strictOrder && idx === nextEmptyIdx) {
                  slotEl.classList.add('next-target');
               }
               slotsContainer.appendChild(slotEl);
            });
         }

         // ตรวจสอบเมื่อผู้เล่นวางหรือแตะฟองอากาศตัวอักษรลงในช่องสะกดคำ
         function handleBubbleGrab(bubble, preferredSlotIdx = -1) {
            if (state.isTransitioning) return;

            let targetSlotIdx = -1;

            if (state.settings.strictOrder) {
               // โหมดเรียงจากซ้ายไปขวา
               const nextIdx = state.slots.findIndex((s) => !s.isFilled);
               if (nextIdx !== -1 && state.slots[nextIdx].targetChar === bubble.char) {
                  targetSlotIdx = nextIdx;
               }
            } else {
               // หากลากมาวางตรงช่องที่ต้องการและช่องนั้นว่างและตรงตัวอักษร ให้ลงช่องนั้นก่อน
               if (preferredSlotIdx >= 0 && preferredSlotIdx < state.slots.length && !state.slots[preferredSlotIdx].isFilled && state.slots[preferredSlotIdx].targetChar === bubble.char) {
                  targetSlotIdx = preferredSlotIdx;
               } else {
                  // โหมดยืดหยุ่น: หาช่องที่ยังว่างช่องแรกที่ตรงกับตัวอักษรนี้ (รองรับตัวอักษรซ้ำเช่น EE, LL, PP)
                  targetSlotIdx = state.slots.findIndex((s) => !s.isFilled && s.targetChar === bubble.char);
               }
            }

            if (targetSlotIdx !== -1) {
               // หยิบตัวอักษรถูกต้อง!
               state.slots[targetSlotIdx].isFilled = true;
               state.slots[targetSlotIdx].filledChar = bubble.char;

               const filledCount = state.slots.filter((s) => s.isFilled).length;
               playPopSound(filledCount - 1);
               speakSingleLetter(bubble.char);
               createBubbleBurstParticles(bubble.x, bubble.y, bubble.palette.mid);

               // ลบฟองอากาศที่ถูกหยิบออก
               state.bubbles = state.bubbles.filter((b) => b.id !== bubble.id);
               state.grabbedBubble = null;
               state.dwellTargetId = null;
               state.dwellProgress = 0;

               renderSlots();

               // ตรวจสอบว่าสะกดครบทุกช่องหรือยัง
               if (filledCount === state.slots.length) {
                  onWordCompleted();
               }
            } else {
               // หยิบตัวอักษรผิด -> เด้งกลับนุ่มนวลโดยไม่หักคะแนน
               state.grabbedBubble = null;
               bubble.shakeTimer = 0.45;
               bubble.vy = -Math.abs(bubble.vy || 70) - 45;
               playGentleBounceSound();
               showToast(`ไม่ใช่ตัว "${bubble.char}"`, 1300);
            }
         }

         // เมื่อสะกดคำศัพท์ครบทุกช่อง
         function onWordCompleted() {
            state.isTransitioning = true;
            const wordObj = getCurrentWordObj();
            playWordCompleteFanfare();
            speakCompletedWord(wordObj);

            // ทำเอฟเฟกต์ช่องตัวอักษรเด้งเรียงตัวจากซ้ายไปขวา
            const slotEls = slotsContainer.querySelectorAll('.letter-slot');
            slotEls.forEach((el, idx) => {
               setTimeout(() => {
                  el.classList.add('celebrate');
               }, idx * 90);
            });

            setTimeout(() => {
               if (state.mode === 'tutorial') {
                  document.getElementById('tutorial-banner').classList.add('hidden');
                  state.mode = 'playing';
                  state.currentIndex = 0;
                  loadLevel(0);
                  return;
               }

               if (state.currentIndex + 1 < COLOR_WORDS.length) {
                  state.currentIndex++;
                  loadLevel(state.currentIndex);
               } else {
                  // ครบทั้ง 12 คำ เปิดสมุดสะสม 12 สี
                  state.mode = 'completed';
                  showCompletionGallery();
               }
            }, 1650);
         }

         // ตรวจสอบการโต้ตอบระหว่างนิ้วมือ AR กับฟองอากาศตัวอักษร (จีบนิ้วหยิบแล้วลากลงช่องด้านล่าง)
         function updateHandInteractions(dt) {
            if (!state.cameraActive || state.handsDetected.length === 0 || state.isTransitioning) {
               if (state.grabbedBubble) {
                  // หากมือหลุดเฟรมขณะถือฟองที่ถูกต้อง ให้วางลงช่องอัตโนมัติเพื่อความลื่นไหล
                  const isValidChar = state.slots.some((s) => !s.isFilled && s.targetChar === state.grabbedBubble.char);
                  if (isValidChar) {
                     handleBubbleGrab(state.grabbedBubble);
                  } else {
                     state.grabbedBubble = null;
                  }
               }
               state.dwellTargetId = null;
               state.dwellProgress = 0;
               clearSlotHighlights();
               return;
            }

            // วิเคราะห์ตำแหน่งมือทั้งหมดที่ตรวจพบ
            let activePinchCenter = null;
            let isPinchingNow = false;
            let hoveredBubble = null;

            for (const landmarks of state.handsDetected) {
               const thumbTip = {
                  x: (1 - landmarks[4].x) * canvas.width,
                  y: landmarks[4].y * canvas.height,
               };
               const indexTip = {
                  x: (1 - landmarks[8].x) * canvas.width,
                  y: landmarks[8].y * canvas.height,
               };

               const pinchCenter = {
                  x: (thumbTip.x + indexTip.x) * 0.5,
                  y: (thumbTip.y + indexTip.y) * 0.5,
               };

               const wrist = { x: (1 - landmarks[0].x) * canvas.width, y: landmarks[0].y * canvas.height };
               const middleMcp = { x: (1 - landmarks[9].x) * canvas.width, y: landmarks[9].y * canvas.height };
               const palmSize = Math.max(40, Math.hypot(wrist.x - middleMcp.x, wrist.y - middleMcp.y));
               const pinchDist = Math.hypot(thumbTip.x - indexTip.x, thumbTip.y - indexTip.y);

               // เกณฑ์จีบนิ้ว (มี Hysteresis ป้องกันการหลุดง่ายขณะลาก)
               const pinchThreshold = state.grabbedBubble ? palmSize * 0.58 : palmSize * 0.45;
               if (pinchDist < pinchThreshold) {
                  isPinchingNow = true;
                  activePinchCenter = pinchCenter;
               }

               if (!state.grabbedBubble) {
                  for (const bubble of state.bubbles) {
                     const dIndex = Math.hypot(indexTip.x - bubble.x, indexTip.y - bubble.y);
                     const dPinch = Math.hypot(pinchCenter.x - bubble.x, pinchCenter.y - bubble.y);
                     if (dIndex <= bubble.radius * 1.25 || dPinch <= bubble.radius * 1.25) {
                        hoveredBubble = bubble;
                        activePinchCenter = pinchCenter;
                        break;
                     }
                  }
               }
            }

            const grabMode = state.settings.grabMode;

            // กรณีที่ 1: กำลังใช้มือ AR จีบนิ้วถือฟองอากาศลากอยู่!
            if (state.grabbedBubble) {
               const b = state.grabbedBubble;

               if (isPinchingNow && activePinchCenter) {
                  // ฟองอากาศเคลื่อนที่ตามปลายนิ้วที่จีบอย่างนุ่มนวล
                  b.x += (activePinchCenter.x - b.x) * 0.45;
                  b.y += (activePinchCenter.y - b.y) * 0.45;

                  // ไฮไลต์ช่องสะกดคำด้านล่างเมื่อลากฟองเข้าใกล้
                  const nearestSlotIdx = findNearestSlotIndex(b.x, b.y);
                  highlightTargetSlot(nearestSlotIdx);

                  // หากลากลงมาถึงโซนช่องสะกดคำด้านล่างแล้ว ให้ดูดเข้าช่องทันที!
                  const slotsRect = slotsContainer.getBoundingClientRect();
                  if (b.y >= slotsRect.top - b.radius * 0.65) {
                     clearSlotHighlights();
                     handleBubbleGrab(b, nearestSlotIdx);
                  }
                  return;
               } else {
                  // ผู้เล่นปล่อยนิ้วที่จีบออก -> วางฟองอากาศลงช่องสะกดคำทันที
                  const nearestSlotIdx = findNearestSlotIndex(b.x, b.y);
                  clearSlotHighlights();
                  handleBubbleGrab(b, nearestSlotIdx);
                  return;
               }
            }

            // กรณีที่ 2: ยังไม่ได้ถือฟอง ตรวจสอบการเริ่มจีบนิ้วหยิบ หรือ จ่อค้าง 0.8 วินาที
            if (hoveredBubble) {
               if ((grabMode === 'both' || grabMode === 'pinch') && isPinchingNow) {
                  // เริ่มจับฟองติดมือ AR!
                  state.grabbedBubble = hoveredBubble;
                  state.dwellTargetId = null;
                  state.dwellProgress = 0;
                  playPopSound(0);
                  return;
               }

               if (grabMode === 'both' || grabMode === 'dwell') {
                  if (state.dwellTargetId === hoveredBubble.id) {
                     state.dwellProgress += dt / 0.8;
                     if (state.dwellProgress >= 1) {
                        handleBubbleGrab(hoveredBubble);
                        return;
                     }
                  } else {
                     state.dwellTargetId = hoveredBubble.id;
                     state.dwellProgress = 0.05;
                  }
               }
            } else {
               state.dwellTargetId = null;
               state.dwellProgress = 0;
            }
         }

         // หาช่องสะกดคำด้านล่างที่อยู่ใกล้ตำแหน่งฟองอากาศมากที่สุด
         function findNearestSlotIndex(x, y) {
            const slotEls = slotsContainer.querySelectorAll('.letter-slot');
            let bestIdx = -1;
            let bestDist = Infinity;

            slotEls.forEach((el, idx) => {
               if (state.slots[idx] && state.slots[idx].isFilled) return;
               const rect = el.getBoundingClientRect();
               const cx = rect.left + rect.width * 0.5;
               const cy = rect.top + rect.height * 0.5;
               const dist = Math.hypot(x - cx, y - cy);
               if (dist < bestDist) {
                  bestDist = dist;
                  bestIdx = idx;
               }
            });
            return bestIdx;
         }

         function highlightTargetSlot(slotIdx) {
            const slotEls = slotsContainer.querySelectorAll('.letter-slot');
            slotEls.forEach((el, idx) => {
               if (idx === slotIdx && !state.slots[idx].isFilled) {
                  el.classList.add('next-target');
               } else if (!state.settings.strictOrder) {
                  el.classList.remove('next-target');
               }
            });
         }

         function clearSlotHighlights() {
            if (state.settings.strictOrder) {
               renderSlots();
               return;
            }
            const slotEls = slotsContainer.querySelectorAll('.letter-slot');
            slotEls.forEach((el) => el.classList.remove('next-target'));
         }

         // สร้างประกายดาวเมื่อฟองอากาศแตก
         function createBubbleBurstParticles(x, y, color) {
            const count = state.settings.sensoryCalm ? 8 : 22;
            for (let i = 0; i < count; i++) {
               const angle = (Math.PI * 2 * i) / count + Math.random() * 0.3;
               const speed = 90 + Math.random() * 170;
               state.particles.push({
                  x,
                  y,
                  vx: Math.cos(angle) * speed,
                  vy: Math.sin(angle) * speed,
                  size: 4 + Math.random() * 5,
                  color: i % 2 === 0 ? '#fde047' : color,
                  life: 1.0,
               });
            }
         }

         /**
          * ============================================================================
          * 5. ระบบกล้อง AR และ Hand-Tracking (MediaPipe Hands + Fallback อัตโนมัติ)
          * ============================================================================
          */
         let mpHands = null;
         let handLoopRunning = false;

         async function startARCameraMode() {
            initAudio();

            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
               beginTutorialOrGame();
               return;
            }

            try {
               const stream = await navigator.mediaDevices.getUserMedia({
                  video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: 'user' },
                  audio: false,
               });
               videoEl.srcObject = stream;
               await videoEl.play();

               state.cameraActive = true;

               setupMediaPipeHands();
               beginTutorialOrGame();
            } catch (err) {
               state.cameraActive = false;
               beginTutorialOrGame();
            }
         }

         function startTouchOnlyMode() {
            initAudio();
            state.cameraActive = false;
            beginTutorialOrGame();
         }

         function beginTutorialOrGame() {
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('tutorial-banner').classList.remove('hidden');
            state.mode = 'tutorial';
            loadLevel(0);
         }

         function setupMediaPipeHands() {
            if (typeof Hands === 'undefined') {
               return;
            }
            try {
               mpHands = new Hands({
                  locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`,
               });

               mpHands.setOptions({
                  maxNumHands: 2,
                  modelComplexity: 1,
                  minDetectionConfidence: 0.6,
                  minTrackingConfidence: 0.55,
               });

               mpHands.onResults((results) => {
                  state.handsDetected = results.multiHandLandmarks || [];
               });

               if (!handLoopRunning) {
                  handLoopRunning = true;
                  processVideoFrame();
               }
            } catch (err) {
               // ใช้เมาส์/สัมผัสได้ตามปกติหากโหลดโมเดลไม่สำเร็จ
            }
         }

         async function processVideoFrame() {
            if (state.cameraActive && mpHands && videoEl.readyState >= 2) {
               try {
                  await mpHands.send({ image: videoEl });
               } catch (err) {}
            }
            requestAnimationFrame(processVideoFrame);
         }

         /**
          * ============================================================================
          * 6. การวาดกราฟิกบน Canvas (AR Camera Feed, Glossy Bubbles, Hand Skeleton)
          * ============================================================================
          */
         const HAND_CONNECTIONS = [
            [0, 1],
            [1, 2],
            [2, 3],
            [3, 4], // นิ้วโป้ง
            [0, 5],
            [5, 6],
            [6, 7],
            [7, 8], // นิ้วชี้
            [5, 9],
            [9, 10],
            [10, 11],
            [11, 12], // นิ้วกลาง
            [9, 13],
            [13, 14],
            [14, 15],
            [15, 16], // นิ้วนาง
            [13, 17],
            [17, 18],
            [18, 19],
            [19, 20], // นิ้วก้อย
            [0, 17], // ฝ่ามือ
         ];

         function updateAndDraw(now) {
            const dt = Math.min(0.05, (now - state.lastFrameTime) / 1000);
            state.lastFrameTime = now;

            const w = canvas.width;
            const h = canvas.height;
            ctx.clearRect(0, 0, w, h);

            // 1. วาดภาพกล้องเว็บแคมแบบกลับด้าน (Mirrored) หรือพื้นหลังห้องเรียนเวทมนตร์
            if (state.cameraActive && videoEl.readyState >= 2) {
               ctx.save();
               ctx.translate(w, 0);
               ctx.scale(-1, 1);

               // คำนวณสัดส่วนภาพแบบ Object-Fit: Cover
               const vidRatio = videoEl.videoWidth / videoEl.videoHeight;
               const canvasRatio = w / h;
               let drawW = w,
                  drawH = h,
                  offsetX = 0,
                  offsetY = 0;
               if (canvasRatio > vidRatio) {
                  drawH = w / vidRatio;
                  offsetY = (h - drawH) * 0.5;
               } else {
                  drawW = h * vidRatio;
                  offsetX = (w - drawW) * 0.5;
               }
               ctx.drawImage(videoEl, offsetX, offsetY, drawW, drawH);
               ctx.restore();

               // ฟิลเตอร์โปร่งแสงเบาๆ ให้ตัวอักษรอ่านง่ายขึ้น
               ctx.fillStyle = state.settings.highContrast ? 'rgba(255, 255, 255, 0.35)' : 'rgba(15, 23, 42, 0.14)';
               ctx.fillRect(0, 0, w, h);
            } else {
               // พื้นหลังห้องเรียนเวทมนตร์พาสเทล (เมื่อไม่ได้เปิดกล้อง)
               const bgGrad = ctx.createLinearGradient(0, 0, w, h);
               bgGrad.addColorStop(0, '#dbeafe');
               bgGrad.addColorStop(0.5, '#fae8ff');
               bgGrad.addColorStop(1, '#fef3c7');
               ctx.fillStyle = bgGrad;
               ctx.fillRect(0, 0, w, h);
            }

            // 2. อัปเดตตำแหน่งและวาดฟองอากาศตัวอักษร
            const speedMult = Number(state.settings.bubbleSpeed);
            const centerSafeX = w * 0.5;
            const centerSafeY = h * 0.45;
            const safeHalfW = Math.min(165, w * 0.28);
            const safeHalfH = 115;

            state.bubbles.forEach((b) => {
               const isGrabbed = state.grabbedBubble && state.grabbedBubble.id === b.id;
               b.bobPhase += dt * 2.4;
               if (b.shakeTimer > 0) {
                  b.shakeTimer = Math.max(0, b.shakeTimer - dt);
               }

               if (speedMult > 0 && !isGrabbed) {
                  b.x += b.vx * speedMult * dt;
                  b.y += b.vy * speedMult * dt;

                  // เด้งขอบหน้าจออย่างนุ่มนวล
                  const minX = b.radius + 14;
                  const maxX = w - b.radius - 14;
                  const minY = 85 + b.radius;
                  const maxY = h - 150 - b.radius;

                  if (b.x < minX) {
                     b.x = minX;
                     b.vx = Math.abs(b.vx);
                  }
                  if (b.x > maxX) {
                     b.x = maxX;
                     b.vx = -Math.abs(b.vx);
                  }
                  if (b.y < minY) {
                     b.y = minY;
                     b.vy = Math.abs(b.vy);
                  }
                  if (b.y > maxY) {
                     b.y = maxY;
                     b.vy = -Math.abs(b.vy);
                  }

                  // ผลักฟองออกเบาๆ หากลอยเข้าใกล้ป้ายสีตรงกลาง
                  const dxC = b.x - centerSafeX;
                  const dyC = b.y - centerSafeY;
                  if (Math.abs(dxC) < safeHalfW + b.radius && Math.abs(dyC) < safeHalfH + b.radius) {
                     b.vx += Math.sign(dxC || 1) * 180 * dt;
                     b.vy += Math.sign(dyC || 1) * 180 * dt;
                  }
               }

               // ผลักฟองอากาศไม่ให้ทับซ้อนกันเอง (ยกเว้นฟองที่กำลังถูกมือหยิบ)
               if (!isGrabbed) {
                  state.bubbles.forEach((other) => {
                     if (b.id === other.id) return;
                     const dx = b.x - other.x;
                     const dy = b.y - other.y;
                     const dist = Math.hypot(dx, dy);
                     const minDist = b.radius + other.radius + 10;
                     if (dist > 0 && dist < minDist) {
                        const push = (minDist - dist) * 0.5;
                        const nx = dx / dist;
                        const ny = dy / dist;
                        b.x += nx * push;
                        b.y += ny * push;
                     }
                  });
               }

               drawGlossyBubble(b, isGrabbed);
            });

            // 3. วาดประกายดาวเมื่อฟองแตก
            for (let i = state.particles.length - 1; i >= 0; i--) {
               const p = state.particles[i];
               p.x += p.vx * dt;
               p.y += p.vy * dt;
               p.vy += 220 * dt;
               p.life -= dt * 1.9;
               if (p.life <= 0) {
                  state.particles.splice(i, 1);
                  continue;
               }
               ctx.save();
               ctx.globalAlpha = p.life;
               ctx.fillStyle = p.color;
               ctx.beginPath();
               ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
               ctx.fill();
               ctx.restore();
            }

            // 4. อัปเดตการโต้ตอบมือ AR และวาดเส้นโครงร่างมือ 21 จุด
            updateHandInteractions(dt);
            drawHandSkeletons();

            requestAnimationFrame(updateAndDraw);
         }

         function drawGlossyBubble(b, isGrabbed = false) {
            const shakeOffset = b.shakeTimer > 0 ? Math.sin(b.shakeTimer * 45) * 7 : 0;
            const drawX = b.x + shakeOffset;
            const drawY = isGrabbed ? b.y : b.y + Math.sin(b.bobPhase) * 4;
            const r = isGrabbed ? b.radius * 1.14 : b.radius;

            ctx.save();

            // เส้นประนำสายตาจากฟองที่มือ AR ถืออยู่ไปยังถาดช่องสะกดคำด้านล่าง
            if (isGrabbed) {
               const slotsRect = slotsContainer.getBoundingClientRect();
               ctx.save();
               ctx.beginPath();
               ctx.setLineDash([8, 8]);
               ctx.moveTo(drawX, drawY + r);
               ctx.lineTo(drawX, slotsRect.top + 10);
               ctx.strokeStyle = '#fde047';
               ctx.lineWidth = 4;
               ctx.stroke();
               ctx.restore();
            }

            // วงแหวนความคืบหน้า Dwell-Grab (จ่อมือค้าง 0.8 วินาที)
            if (state.dwellTargetId === b.id && state.dwellProgress > 0) {
               ctx.beginPath();
               ctx.arc(drawX, drawY, r + 9, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * state.dwellProgress);
               ctx.strokeStyle = '#10b981';
               ctx.lineWidth = 6;
               ctx.lineCap = 'round';
               ctx.stroke();
            }

            // วงกลมไล่เฉดสีฟองอากาศ
            const grad = ctx.createRadialGradient(drawX - r * 0.3, drawY - r * 0.35, r * 0.1, drawX, drawY, r);
            grad.addColorStop(0, b.palette.top);
            grad.addColorStop(0.72, b.palette.mid);
            grad.addColorStop(1, b.palette.rim);

            ctx.globalAlpha = state.settings.highContrast ? 0.98 : 0.9;
            ctx.beginPath();
            ctx.arc(drawX, drawY, r, 0, Math.PI * 2);
            ctx.fillStyle = grad;
            ctx.fill();

            // ขอบเรืองแสงสีขาวรอบฟองอากาศ
            ctx.lineWidth = state.settings.highContrast ? 4 : 3;
            ctx.strokeStyle = '#ffffff';
            ctx.stroke();

            // แสงสะท้อนเงาด้านบนซ้าย (Glossy Highlight)
            ctx.globalAlpha = 0.55;
            ctx.beginPath();
            ctx.ellipse(drawX - r * 0.34, drawY - r * 0.36, r * 0.24, r * 0.13, -Math.PI / 4, 0, Math.PI * 2);
            ctx.fillStyle = '#ffffff';
            ctx.fill();

            // ตัวอักษรภาษาอังกฤษพิมพ์ใหญ่ตรงกลางฟอง
            ctx.globalAlpha = 1;
            ctx.font = `700 ${Math.round(r * 0.95)}px Fredoka, sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            // เงาตัวอักษรให้อ่านง่ายชัดเจน
            ctx.fillStyle = 'rgba(15, 23, 42, 0.38)';
            ctx.fillText(b.char, drawX, drawY + 3);

            ctx.fillStyle = '#ffffff';
            ctx.fillText(b.char, drawX, drawY);

            ctx.restore();
         }

         function drawHandSkeletons() {
            if (!state.cameraActive || state.handsDetected.length === 0) return;

            const w = canvas.width;
            const h = canvas.height;

            for (const landmarks of state.handsDetected) {
               const pts = landmarks.map((lm) => ({
                  x: (1 - lm.x) * w,
                  y: lm.y * h,
               }));

               ctx.save();
               // วาดเส้นเชื่อมข้อต่อนิ้วสีเขียวมินต์เรืองแสง
               ctx.strokeStyle = '#34d399';
               ctx.lineWidth = 4;
               ctx.lineCap = 'round';

               for (const [i, j] of HAND_CONNECTIONS) {
                  ctx.beginPath();
                  ctx.moveTo(pts[i].x, pts[i].y);
                  ctx.lineTo(pts[j].x, pts[j].y);
                  ctx.stroke();
               }

               // วาดจุดข้อต่อ 21 จุด
               pts.forEach((pt, idx) => {
                  const isTip = idx === 4 || idx === 8;
                  ctx.beginPath();
                  ctx.arc(pt.x, pt.y, isTip ? 9 : 4.5, 0, Math.PI * 2);
                  ctx.fillStyle = isTip ? '#fde047' : '#ffffff';
                  ctx.fill();
                  ctx.lineWidth = 2;
                  ctx.strokeStyle = '#059669';
                  ctx.stroke();
               });

               ctx.restore();
            }
         }

         /**
          * ============================================================================
          * 7. การโต้ตอบด้วยเมาส์, นิ้วสัมผัสหน้าจอ (Touch) และคีย์บอร์ด
          * ============================================================================
          */
         function handlePointerDown(clientX, clientY) {
            if (state.mode !== 'playing' && state.mode !== 'tutorial') return;
            initAudio();

            const rect = canvas.getBoundingClientRect();
            const px = clientX - rect.left;
            const py = clientY - rect.top;

            // ตรวจสอบจากฟองบนสุดลงล่าง
            for (let i = state.bubbles.length - 1; i >= 0; i--) {
               const b = state.bubbles[i];
               if (Math.hypot(px - b.x, py - b.y) <= b.radius * 1.12) {
                  handleBubbleGrab(b);
                  break;
               }
            }
         }

         canvas.addEventListener('pointerdown', (e) => {
            handlePointerDown(e.clientX, e.clientY);
         });

         // รองรับการพิมพ์แป้นพิมพ์ A-Z สำหรับเด็กที่ใช้คีย์บอร์ดหรือสวิตช์
         window.addEventListener('keydown', (e) => {
            if (state.mode !== 'playing' && state.mode !== 'tutorial') return;
            const key = e.key.toUpperCase();
            if (/^[A-Z]$/.test(key)) {
               const matchingBubble = state.bubbles.find((b) => b.char === key);
               if (matchingBubble) {
                  handleBubbleGrab(matchingBubble);
               } else {
                  playGentleBounceSound();
                  showToast(`ไม่มีตัว "${key}"`, 1100);
               }
            }
         });

         /**
          * ============================================================================
          * 8. สมุดสะสมเวทมนตร์ 12 สี (Completion Gallery) และปุ่มควบคุม UI
          * ============================================================================
          */
         function showCompletionGallery() {
            const grid = document.getElementById('collection-grid');
            grid.innerHTML = '';

            COLOR_WORDS.forEach((item) => {
               const card = document.createElement('div');
               card.className = 'color-card-item';
               card.innerHTML = `
          <div class="mini-swatch" style="background-color: ${item.hex};"></div>
          <div class="card-en">${item.word}</div>
          <div class="card-th">${item.thai}</div>
        `;
               card.addEventListener('click', () => {
                  initAudio();
                  playPopSound(2);
                  speakBilingualPrompt(item);
               });
               grid.appendChild(card);
            });

            document.getElementById('completion-modal').classList.remove('hidden');
         }

         // ผูกเหตุการณ์ปุ่มต่างๆ
         document.getElementById('btn-start-ar').addEventListener('click', startARCameraMode);
         document.getElementById('btn-start-touch').addEventListener('click', startTouchOnlyMode);

         document.getElementById('btn-skip-tutorial').addEventListener('click', () => {
            document.getElementById('tutorial-banner').classList.add('hidden');
            state.mode = 'playing';
            state.currentIndex = 0;
            loadLevel(0);
         });

         document.getElementById('btn-speak-word').addEventListener('click', () => {
            initAudio();
            speakBilingualPrompt(getCurrentWordObj());
         });

         document.getElementById('btn-mute').addEventListener('click', () => {
            state.settings.muted = !state.settings.muted;
            document.getElementById('icon-sound-on').style.display = state.settings.muted ? 'none' : 'block';
            document.getElementById('icon-sound-off').style.display = state.settings.muted ? 'block' : 'none';
            if (state.settings.muted && 'speechSynthesis' in window) {
               window.speechSynthesis.cancel();
            }
         });

         // เปิด-ปิดหน้าต่างตั้งค่า Accessibility
         const settingsModal = document.getElementById('settings-modal');
         document.getElementById('btn-open-settings').addEventListener('click', () => {
            settingsModal.classList.remove('hidden');
         });
         document.getElementById('btn-start-settings').addEventListener('click', () => {
            settingsModal.classList.remove('hidden');
         });
         document.getElementById('btn-close-settings').addEventListener('click', () => {
            state.settings.grabMode = document.getElementById('setting-grab-mode').value;
            state.settings.bubbleSpeed = parseFloat(document.getElementById('setting-bubble-speed').value);
            state.settings.strictOrder = document.getElementById('setting-strict-order').checked;
            state.settings.highContrast = document.getElementById('setting-high-contrast').checked;
            state.settings.sensoryCalm = document.getElementById('setting-sensory-calm').checked;

            document.body.classList.toggle('high-contrast', state.settings.highContrast);
            renderSlots();
            settingsModal.classList.add('hidden');
            showToast('บันทึกแล้ว', 1200);
         });

         // เริ่มเกมใหม่เมื่อเล่นครบ 12 สี
         document.getElementById('btn-restart-game').addEventListener('click', () => {
            document.getElementById('completion-modal').classList.add('hidden');
            state.mode = 'playing';
            state.currentIndex = 0;
            loadLevel(0);
         });

         // เริ่มต้นลูปวาดแคนวาส
         window.onload = function () {
            requestAnimationFrame(updateAndDraw);
         };
      </script>
   </body>
</html>
