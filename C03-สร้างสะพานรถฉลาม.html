<!doctype html>
<html lang="en">
   <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
      <title>Shark Monster Truck Bridge Builder: Phonics Spelling</title>
      <link rel="preconnect" href="https://fonts.googleapis.com" />
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
      <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet" />
      <style>
         :root {
            --sky-top: #4fc3f7;
            --sky-mid: #b3e5fc;
            --sky-bottom: #e1f5fe;
            --mountain-far: #81d4fa;
            --mountain-near: #4dd0e1;
            --grass-top: #66bb6a;
            --grass-edge: #43a047;
            --cliff-main: #8d6e63;
            --cliff-dark: #6d4c41;
            --cliff-shadow: #4e342e;
            --wood-light: #ffe0b2;
            --wood-mid: #ffcc80;
            --wood-border: #d88c3a;
            --wood-shadow: #a15c19;
            --truck-blue: #0288d1;
            --truck-light: #29b6f6;
            --truck-dark: #01579b;
            --vowel-color: #d32f2f;
            --consonant-color: #1a237e;
            --ui-surface: rgba(255, 255, 255, 0.94);
            --ui-border: #90caf9;
            --focus-ring: #ff6f00;
         }

         body.high-contrast {
            --sky-top: #e3f2fd;
            --sky-mid: #ffffff;
            --sky-bottom: #ffffff;
            --mountain-far: #cfd8dc;
            --mountain-near: #b0bec5;
            --grass-top: #2e7d32;
            --grass-edge: #1b5e20;
            --cliff-main: #4e342e;
            --cliff-dark: #3e2723;
            --wood-light: #fffde7;
            --wood-mid: #fff59d;
            --wood-border: #000000;
            --wood-shadow: #000000;
            --vowel-color: #b71c1c;
            --consonant-color: #000000;
            --ui-surface: #ffffff;
            --ui-border: #000000;
         }

         * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
         }

         html,
         body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Fredoka', 'Nunito', sans-serif;
            background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 58%, var(--sky-bottom) 100%);
            color: #102a43;
         }

         /* Decorative Scenery Layer */
         #scenery-layer {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
         }

         .cloud {
            position: absolute;
            opacity: 0.92;
            animation: floatCloud linear infinite;
         }

         body.sensory-calm .cloud {
            animation: none !important;
         }

         @keyframes floatCloud {
            0% {
               transform: translateX(-220px);
            }
            100% {
               transform: translateX(calc(100vw + 220px));
            }
         }

         /* App Container */
         #app {
            position: relative;
            z-index: 1;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
         }

         /* Screen Transitions */
         .screen {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            transition:
               opacity 0.25s ease,
               transform 0.25s ease;
         }

         .screen.hidden {
            opacity: 0;
            pointer-events: none;
            transform: scale(0.98);
         }

         /* Common Interactive Buttons */
         .btn {
            font-family: 'Fredoka', sans-serif;
            font-weight: 700;
            border: 3px solid transparent;
            border-radius: 20px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition:
               transform 0.12s ease,
               box-shadow 0.12s ease,
               background-color 0.15s ease;
            box-shadow: 0 5px 0 rgba(0, 0, 0, 0.18);
            min-height: 48px;
            min-width: 48px;
         }

         .btn:hover {
            transform: translateY(-2px);
         }

         .btn:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 rgba(0, 0, 0, 0.18);
         }

         .btn:focus-visible,
         .tile:focus-visible,
         .bridge-slot:focus-visible {
            outline: 4px solid var(--focus-ring);
            outline-offset: 3px;
         }

         body.high-contrast .btn {
            border-color: #000000 !important;
            box-shadow: 0 4px 0 #000000;
         }

         .btn-primary {
            background: linear-gradient(180deg, #ffca28 0%, #ffa000 100%);
            color: #3e2723;
            border-color: #ff6f00;
            font-size: clamp(1.2rem, 2.5vw, 1.55rem);
            padding: 14px 32px;
         }

         .btn-blue {
            background: linear-gradient(180deg, #29b6f6 0%, #0288d1 100%);
            color: #ffffff;
            border-color: #01579b;
         }

         .btn-green {
            background: linear-gradient(180deg, #66bb6a 0%, #388e3c 100%);
            color: #ffffff;
            border-color: #1b5e20;
         }

         .btn-white {
            background: var(--ui-surface);
            color: #102a43;
            border-color: var(--ui-border);
         }

         /* ================= START SCREEN ================= */
         #start-screen {
            align-items: center;
            justify-content: center;
            padding: 16px;
            text-align: center;
            overflow-y: auto;
         }

         .hero-card {
            background: var(--ui-surface);
            border: 5px solid var(--ui-border);
            border-radius: 36px;
            padding: clamp(20px, 3vw, 32px);
            max-width: 720px;
            width: 100%;
            box-shadow: 0 16px 34px rgba(1, 87, 155, 0.22);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
         }

         body.high-contrast .hero-card {
            border-color: #000000;
         }

         .hero-title {
            margin: 0;
            font-size: clamp(1.95rem, 4.5vw, 3rem);
            line-height: 1.1;
            color: #01579b;
            text-shadow: 0 3px 0 #b3e5fc;
         }

         .hero-preview-box {
            width: 100%;
            max-width: 480px;
            height: 150px;
            background: linear-gradient(180deg, #b3e5fc 0%, #e1f5fe 75%, #66bb6a 75%, #43a047 100%);
            border-radius: 26px;
            border: 4px solid #81d4fa;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            padding: 0 24px 18px 24px;
         }

         .level-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            width: 100%;
         }

         .level-card {
            background: #f8fafc;
            border: 4px solid #cbd5e1;
            border-radius: 24px;
            padding: 14px 10px;
            cursor: pointer;
            text-align: center;
            transition: all 0.15s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            position: relative;
            box-shadow: 0 5px 0 #cbd5e1;
         }

         .level-card:hover {
            transform: translateY(-3px);
            border-color: #29b6f6;
            background: #f0f9ff;
         }

         .level-card.selected {
            border-color: #ff8f00;
            background: #fff8e1;
            box-shadow: 0 5px 0 #ffb300;
            transform: translateY(-2px);
         }

         body.high-contrast .level-card {
            border-color: #000000;
            background: #ffffff;
         }

         body.high-contrast .level-card.selected {
            background: #fff9c4;
            border-width: 4px;
         }

         .level-num {
            font-size: 1.5rem;
            font-weight: 700;
            color: #01579b;
            line-height: 1;
         }

         .level-tag {
            background: #0288d1;
            color: white;
            font-size: 0.92rem;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 999px;
         }

         .start-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            justify-content: center;
            align-items: center;
            margin-top: 4px;
         }

         /* ================= GAMEPLAY SCREEN ================= */
         #game-screen {
            justify-content: space-between;
            padding: clamp(10px, 1.8vh, 18px) clamp(12px, 2.2vw, 26px);
         }

         /* Top HUD Bar */
         .top-hud {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: flex-start;
            gap: 10px;
            width: 100%;
            z-index: 10;
         }

         .hud-left {
            display: flex;
            align-items: center;
            gap: 10px;
         }

         /* Icon-Only Circular Game HUD Buttons */
         .icon-btn-circle {
            width: clamp(48px, 6vw, 56px);
            height: clamp(48px, 6vw, 56px);
            border-radius: 50%;
            background: var(--ui-surface);
            border: 3px solid var(--ui-border);
            color: #01579b;
            box-shadow: 0 5px 0 rgba(1, 87, 155, 0.18);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition:
               transform 0.12s ease,
               box-shadow 0.12s ease;
         }

         .icon-btn-circle:hover {
            transform: translateY(-2px) scale(1.04);
         }

         .icon-btn-circle:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 rgba(1, 87, 155, 0.18);
         }

         body.high-contrast .icon-btn-circle {
            border-color: #000000;
            color: #000000;
            box-shadow: 0 4px 0 #000000;
         }

         /* Top Center Picture Card */
         .picture-card-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
         }

         .picture-card {
            width: clamp(145px, 22vw, 195px);
            height: clamp(130px, 19vh, 172px);
            background: linear-gradient(180deg, #ffffff 0%, #f0f9ff 100%);
            border: 5px solid #ffffff;
            outline: 4px solid #81d4fa;
            border-radius: 30px;
            box-shadow: 0 12px 24px rgba(1, 87, 155, 0.24);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            position: relative;
            cursor: pointer;
            transition: transform 0.15s ease;
         }

         .picture-card:hover {
            transform: scale(1.04);
         }

         .picture-card:active {
            transform: scale(0.97);
         }

         body.high-contrast .picture-card {
            outline: 4px solid #000000;
            background: #ffffff;
         }

         .picture-card svg {
            width: 85%;
            height: 85%;
            overflow: visible;
         }

         .hud-right {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 10px;
            flex-wrap: wrap;
         }

         .speaker-btn-large {
            width: clamp(56px, 7.5vw, 68px);
            height: clamp(56px, 7.5vw, 68px);
            border-radius: 50%;
            background: linear-gradient(180deg, #4fc3f7 0%, #0288d1 100%);
            border: 4px solid #ffffff;
            outline: 3px solid #0277bd;
            color: #ffffff;
            box-shadow: 0 6px 0 #01579b;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.12s ease;
         }

         .speaker-btn-large:hover {
            transform: scale(1.06);
         }

         .speaker-btn-large:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #01579b;
         }

         .speaker-btn-large.speaking {
            animation: pulseSpeak 0.55s ease-in-out infinite alternate;
         }

         @keyframes pulseSpeak {
            from {
               transform: scale(1);
            }
            to {
               transform: scale(1.12);
            }
         }

         .progress-pill {
            background: #ffffff;
            border: 3px solid #81d4fa;
            border-radius: 999px;
            padding: 8px 18px;
            font-size: clamp(1.1rem, 2.2vw, 1.35rem);
            font-weight: 700;
            color: #01579b;
            box-shadow: 0 4px 0 rgba(1, 87, 155, 0.15);
         }

         /* ================= CENTER CANYON & BRIDGE ARENA ================= */
         .canyon-arena {
            position: relative;
            flex: 1;
            width: 100%;
            max-width: 1180px;
            margin: 0 auto;
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            min-height: 230px;
            padding-bottom: 6px;
         }

         /* Left Cliff (Truck Start) */
         .cliff-left {
            width: 28%;
            height: 56%;
            background: linear-gradient(180deg, var(--cliff-main) 0%, var(--cliff-dark) 65%, var(--cliff-shadow) 100%);
            border-top-right-radius: 26px;
            border-bottom-left-radius: 24px;
            position: relative;
            box-shadow: inset -10px 0 18px rgba(0, 0, 0, 0.18);
         }

         .cliff-left::before {
            content: '';
            position: absolute;
            top: -16px;
            left: 0;
            right: -4px;
            height: 26px;
            background: linear-gradient(180deg, var(--grass-top) 0%, var(--grass-edge) 100%);
            border-top-right-radius: 22px;
            border-bottom-right-radius: 12px;
            border-bottom-left-radius: 8px;
            box-shadow: 0 4px 0 rgba(0, 0, 0, 0.15);
         }

         /* Right Cliff (Rainbow Finish) */
         .cliff-right {
            width: 28%;
            height: 56%;
            background: linear-gradient(180deg, var(--cliff-main) 0%, var(--cliff-dark) 65%, var(--cliff-shadow) 100%);
            border-top-left-radius: 26px;
            border-bottom-right-radius: 24px;
            position: relative;
            box-shadow: inset 10px 0 18px rgba(0, 0, 0, 0.18);
         }

         .cliff-right::before {
            content: '';
            position: absolute;
            top: -16px;
            left: -4px;
            right: 0;
            height: 26px;
            background: linear-gradient(180deg, var(--grass-top) 0%, var(--grass-edge) 100%);
            border-top-left-radius: 22px;
            border-bottom-left-radius: 12px;
            border-bottom-right-radius: 8px;
            box-shadow: 0 4px 0 rgba(0, 0, 0, 0.15);
         }

         /* Canyon Gap & 3-Slot Suspension Bridge */
         .bridge-gap {
            width: 44%;
            height: 56%;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
         }

         /* Anchor ropes connecting cliffs to bridge */
         .bridge-cables {
            position: absolute;
            top: -12px;
            left: -8px;
            right: -8px;
            height: 36px;
            pointer-events: none;
            z-index: 1;
         }

         .bridge-slots-row {
            position: relative;
            top: -22px;
            width: 100%;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: clamp(6px, 1.2vw, 12px);
            padding: 0 6px;
            z-index: 4;
            transition: transform 0.15s ease;
         }

         .bridge-slots-row.wobble {
            animation: bridgeWobble 0.55s ease-in-out;
         }

         @keyframes bridgeWobble {
            0%,
            100% {
               transform: rotate(0deg) translateY(0);
            }
            20% {
               transform: rotate(-3deg) translateY(4px);
            }
            40% {
               transform: rotate(3deg) translateY(2px);
            }
            60% {
               transform: rotate(-2deg) translateY(4px);
            }
            80% {
               transform: rotate(2deg) translateY(1px);
            }
         }

         .bridge-slot {
            aspect-ratio: 1 / 1;
            max-height: 98px;
            min-height: 62px;
            width: 100%;
            border: 4px dashed #ffffff;
            background: rgba(255, 255, 255, 0.28);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: pointer;
            transition:
               transform 0.15s ease,
               background-color 0.15s ease,
               border-color 0.15s ease;
            box-shadow: inset 0 2px 8px rgba(1, 87, 155, 0.14);
         }

         body.high-contrast .bridge-slot {
            border-color: #000000;
            background: rgba(255, 255, 255, 0.85);
         }

         .bridge-slot.drag-over {
            background: rgba(255, 238, 88, 0.55);
            border-color: #ff8f00;
            transform: scale(1.06);
         }

         .bridge-slot.filled {
            border-style: solid;
            border-color: var(--wood-border);
            background: linear-gradient(180deg, var(--wood-light) 0%, var(--wood-mid) 100%);
            box-shadow:
               0 6px 0 var(--wood-shadow),
               0 8px 14px rgba(0, 0, 0, 0.2);
         }

         .bridge-slot.filled:hover {
            transform: translateY(-2px);
         }

         .bridge-slot.active-step {
            transform: translateY(5px) scale(1.07);
            background: linear-gradient(180deg, #fff59d 0%, #ffd54f 100%);
            border-color: #ff6f00;
            box-shadow:
               0 2px 0 #e65100,
               0 0 22px rgba(255, 213, 79, 0.95);
         }

         .bridge-slot.wrong-slot {
            border-color: #e53935;
            background: #ffebee;
            animation: shakeSlot 0.4s ease;
         }

         @keyframes shakeSlot {
            0%,
            100% {
               transform: translateX(0);
            }
            25% {
               transform: translateX(-6px);
            }
            75% {
               transform: translateX(6px);
            }
         }

         .slot-index-hint {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.75);
            pointer-events: none;
         }

         body.high-contrast .slot-index-hint {
            background: #000000;
         }

         body.high-contrast .slot-index-hint {
            color: #000000;
         }

         .slot-letter {
            font-size: clamp(1.9rem, 4.2vw, 2.9rem);
            font-weight: 700;
            line-height: 1;
            pointer-events: none;
         }

         /* Shark Monster Truck Entity */
         #shark-truck {
            position: absolute;
            bottom: calc(56% + 10px);
            left: 6%;
            width: clamp(145px, 20vw, 215px);
            z-index: 6;
            transform-origin: bottom center;
            transition:
               left 0.45s cubic-bezier(0.34, 1.56, 0.64, 1),
               transform 0.25s ease;
            pointer-events: none;
         }

         #shark-truck.idle-bounce .truck-body-group {
            animation: engineBounce 0.65s ease-in-out infinite alternate;
         }

         body.sensory-calm #shark-truck.idle-bounce .truck-body-group {
            animation: none !important;
         }

         @keyframes engineBounce {
            from {
               transform: translateY(0px);
            }
            to {
               transform: translateY(-3px);
            }
         }

         #shark-truck.driving .wheel-spin {
            animation: spinWheel 0.45s linear infinite;
         }

         @keyframes spinWheel {
            from {
               transform: rotate(0deg);
            }
            to {
               transform: rotate(360deg);
            }
         }

         /* Rainbow Finish Arch */
         .rainbow-finish {
            position: absolute;
            bottom: calc(56% + 8px);
            right: 4%;
            width: clamp(135px, 19vw, 195px);
            z-index: 3;
            pointer-events: none;
         }

         /* Tutorial Hand Pointer */
         .tutorial-pointer {
            position: fixed;
            z-index: 50;
            pointer-events: none;
            width: 54px;
            height: 54px;
            transition: all 0.45s ease;
            animation: tapBounce 0.7s ease-in-out infinite alternate;
         }

         @keyframes tapBounce {
            from {
               transform: translateY(0) scale(1);
            }
            to {
               transform: translateY(-10px) scale(1.08);
            }
         }

         /* ================= BOTTOM WOODEN TILE TRAY ================= */
         .tray-container {
            width: 100%;
            max-width: 780px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.42);
            backdrop-filter: blur(6px);
            border: 3px solid rgba(255, 255, 255, 0.85);
            border-radius: 32px;
            padding: clamp(10px, 1.6vh, 16px) 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: clamp(12px, 2vw, 22px);
            flex-wrap: wrap;
            z-index: 10;
            box-shadow: 0 10px 24px rgba(1, 87, 155, 0.16);
         }

         body.high-contrast .tray-container {
            background: #ffffff;
            border-color: #000000;
         }

         .tiles-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: clamp(10px, 2vw, 18px);
            flex-wrap: wrap;
            min-height: 76px;
         }

         .tile {
            width: clamp(66px, 9.5vw, 84px);
            height: clamp(66px, 9.5vw, 84px);
            background: linear-gradient(180deg, var(--wood-light) 0%, var(--wood-mid) 100%);
            border: 4px solid var(--wood-border);
            border-radius: 20px;
            box-shadow:
               0 6px 0 var(--wood-shadow),
               0 8px 14px rgba(0, 0, 0, 0.16);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(2rem, 4.2vw, 2.8rem);
            font-weight: 700;
            cursor: grab;
            position: relative;
            transition:
               transform 0.14s ease,
               box-shadow 0.14s ease,
               opacity 0.2s ease;
            touch-action: none;
         }

         .tile:hover:not(.used) {
            transform: translateY(-4px) scale(1.04);
         }

         .tile:active:not(.used) {
            cursor: grabbing;
            transform: translateY(2px);
            box-shadow: 0 2px 0 var(--wood-shadow);
         }

         .tile.used {
            opacity: 0.24;
            pointer-events: none;
            transform: scale(0.92);
            box-shadow: none;
         }

         .tile.dragging-ghost {
            position: fixed;
            z-index: 100;
            pointer-events: none;
            transform: scale(1.12) rotate(-4deg);
            box-shadow: 0 14px 26px rgba(0, 0, 0, 0.28);
         }

         /* Color coding for Phonics / Dyslexia support */
         .letter-vowel {
            color: var(--vowel-color);
         }

         .letter-consonant {
            color: var(--consonant-color);
         }

         body.no-vowel-highlight .letter-vowel,
         body.no-vowel-highlight .letter-consonant {
            color: #2c1810;
         }

         body.high-contrast.no-vowel-highlight .letter-vowel,
         body.high-contrast.no-vowel-highlight .letter-consonant {
            color: #000000;
         }

         .tray-helper-controls {
            display: flex;
            align-items: center;
            gap: 10px;
         }

         .helper-icon-btn {
            width: 52px;
            height: 52px;
            border-radius: 18px;
            padding: 0;
            min-width: 52px;
            min-height: 52px;
         }

         .btn-sm {
            padding: 6px 14px;
            font-size: 0.9rem;

            content: '';

            left: 2px;

            height: 24px;

                  { word: 'net', thai: 'สวิงจับแมลง', phonemes: ['n', 'e', 't'], distractors: ['i', 'b', 'p'] },
               ],
            },
         ];

         const VOWELS = new Set(['a', 'e', 'i', 'o', 'u']);

         // Phonetic pronunciation helpers for SpeechSynthesis
         const LETTER_PHONICS_SPEECH = {
            a: 'ah',
            b: 'buh',
            c: 'kuh',
            d: 'duh',
            e: 'eh',
            f: 'fff',
            g: 'guh',
            h: 'huh',
            i: 'ih',
            j: 'juh',
            k: 'kuh',
            l: 'lll',
            m: 'mmm',
            n: 'nnn',
            o: 'aw',
            p: 'puh',
            r: 'rrr',
            s: 'sss',
            t: 'tuh',
            u: 'uh',
            v: 'vvv',
            w: 'wuh',
            x: 'ks',
            y: 'yuh',
            z: 'zzz',
         };

         // -------------------------------------------------------------------------
         // 3. WEB AUDIO API PROCEDURAL SOUND EFFECTS & SPEECH SYNTHESIS
         // -------------------------------------------------------------------------
         class SoundEngine {
            constructor() {
               this.ctx = null;
            }

            ensureContext() {
               if (!this.ctx) {
                  const AudioCtx = window.AudioContext || window.webkitAudioContext;
                  if (AudioCtx) this.ctx = new AudioCtx();
               }
               if (this.ctx && this.ctx.state === 'suspended') {
                  this.ctx.resume().catch(() => {});
               }
            }

            playWoodKnock(pitchOffset = 0) {
               this.ensureContext();
               if (!this.ctx) return;
               const now = this.ctx.currentTime;
               const osc = this.ctx.createOscillator();
               const gain = this.ctx.createGain();
               osc.type = 'triangle';
               osc.frequency.setValueAtTime(240 + pitchOffset * 45, now);
               osc.frequency.exponentialRampToValueAtTime(110, now + 0.09);

               gain.gain.setValueAtTime(0.28, now);
               gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);

               osc.connect(gain);
               gain.connect(this.ctx.destination);
               osc.start(now);
               osc.stop(now + 0.11);
            }

            playTileReturn() {
               this.ensureContext();
               if (!this.ctx) return;
               const now = this.ctx.currentTime;
               const osc = this.ctx.createOscillator();
               const gain = this.ctx.createGain();
               osc.type = 'sine';
               osc.frequency.setValueAtTime(340, now);
               osc.frequency.exponentialRampToValueAtTime(190, now + 0.12);

               gain.gain.setValueAtTime(0.18, now);
               gain.gain.exponentialRampToValueAtTime(0.001, now + 0.13);

               osc.connect(gain);
               gain.connect(this.ctx.destination);
               osc.start(now);
               osc.stop(now + 0.14);
            }

            playStepChime(stepIndex) {
               this.ensureContext();
               if (!this.ctx) return;
               const notes = [523.25, 659.25, 783.99]; // C5, E5, G5
               const freq = notes[stepIndex] || 523.25;
               const now = this.ctx.currentTime;
               const osc = this.ctx.createOscillator();
               const gain = this.ctx.createGain();
               osc.type = 'sine';
               osc.frequency.setValueAtTime(freq, now);

               gain.gain.setValueAtTime(0.24, now);
               gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);

               osc.connect(gain);
               gain.connect(this.ctx.destination);
               osc.start(now);
               osc.stop(now + 0.26);
            }

            playTruckRev(calmMode = false) {
               if (calmMode) return;
               this.ensureContext();
               if (!this.ctx) return;
               const now = this.ctx.currentTime;
               const osc = this.ctx.createOscillator();
               const gain = this.ctx.createGain();
               osc.type = 'sawtooth';
               osc.frequency.setValueAtTime(85, now);
               osc.frequency.linearRampToValueAtTime(135, now + 0.18);
               osc.frequency.linearRampToValueAtTime(95, now + 0.35);
               osc.frequency.linearRampToValueAtTime(160, now + 0.65);

               gain.gain.setValueAtTime(0.08, now);
               gain.gain.exponentialRampToValueAtTime(0.001, now + 0.7);

               osc.connect(gain);
               gain.connect(this.ctx.destination);
               osc.start(now);
               osc.stop(now + 0.72);
            }

            playGentleWobble() {
               this.ensureContext();
               if (!this.ctx) return;
               const now = this.ctx.currentTime;
               const osc = this.ctx.createOscillator();
               const gain = this.ctx.createGain();
               osc.type = 'triangle';
               osc.frequency.setValueAtTime(220, now);
               osc.frequency.linearRampToValueAtTime(175, now + 0.16);
               osc.frequency.linearRampToValueAtTime(205, now + 0.32);

               gain.gain.setValueAtTime(0.2, now);
               gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);

               osc.connect(gain);
               gain.connect(this.ctx.destination);
               osc.start(now);
               osc.stop(now + 0.36);
            }

            playFanfare() {
               this.ensureContext();
               if (!this.ctx) return;
               const melody = [523.25, 659.25, 783.99, 1046.5];
               const now = this.ctx.currentTime;
               melody.forEach((freq, idx) => {
                  const osc = this.ctx.createOscillator();
                  const gain = this.ctx.createGain();
                  osc.type = 'triangle';
                  const start = now + idx * 0.1;
                  osc.frequency.setValueAtTime(freq, start);
                  gain.gain.setValueAtTime(0.22, start);
                  gain.gain.exponentialRampToValueAtTime(0.001, start + 0.35);
                  osc.connect(gain);
                  gain.connect(this.ctx.destination);
                  osc.start(start);
                  osc.stop(start + 0.36);
               });
            }

            speak(text, rate = 0.9, onEnd = null) {
               if (!('speechSynthesis' in window)) {
                  if (onEnd) setTimeout(onEnd, 450);
                  return;
               }
               try {
                  window.speechSynthesis.cancel();
                  const utter = new SpeechSynthesisUtterance(text);
                  utter.lang = 'en-US';
                  utter.rate = rate;
                  utter.pitch = 1.08;
                  const btn = document.getElementById('btn-speak-word');
                  if (btn) btn.classList.add('speaking');
                  utter.onend = () => {
                     if (btn) btn.classList.remove('speaking');
                     if (onEnd) onEnd();
                  };
                  utter.onerror = () => {
                     if (btn) btn.classList.remove('speaking');
                     if (onEnd) onEnd();
                  };
                  window.speechSynthesis.speak(utter);
               } catch (e) {
                  if (onEnd) setTimeout(onEnd, 400);
               }
            }
         }

         const sound = new SoundEngine();

         // -------------------------------------------------------------------------
         // 4. GAME STATE & PERSISTENCE
         // -------------------------------------------------------------------------
         const state = {
            stageIndex: 0,
            wordIndex: 0,
            slots: [null, null, null], // Holds tile objects { id, char }
            trayTiles: [], // Holds { id, char, used }
            isAnimating: false,
            tutorialShown: false,
            completedStages: {},
            settings: {
               vowelHighlight: true,
               letterAudio: true,
               highContrast: false,
               sensoryCalm: false,
            },
         };

         function loadSavedData() {
            try {
               const raw = localStorage.getItem('shark_bridge_phonics_v1');
               if (raw) {
                  const parsed = JSON.parse(raw);
                  if (parsed.settings) Object.assign(state.settings, parsed.settings);
                  if (parsed.completedStages) state.completedStages = parsed.completedStages;
                  if (parsed.tutorialShown) state.tutorialShown = parsed.tutorialShown;
               }
            } catch (e) {
               // Fallback silently if storage unavailable
            }
         }

         function saveGameData() {
            try {
               localStorage.setItem(
                  'shark_bridge_phonics_v1',
                  JSON.stringify({
                     settings: state.settings,
                     completedStages: state.completedStages,
                     tutorialShown: state.tutorialShown,
                  }),
               );
            } catch (e) {
               // Ignore storage errors
            }
         }

         // -------------------------------------------------------------------------
         // 5. CONFETTI PARTICLE SYSTEM
         // -------------------------------------------------------------------------
         const fxCanvas = document.getElementById('fx-canvas');
         const fxCtx = fxCanvas.getContext('2d');
         let particles = [];
         let fxAnimId = null;

         function resizeFxCanvas() {
            fxCanvas.width = window.innerWidth;
            fxCanvas.height = window.innerHeight;
         }
         window.addEventListener('resize', resizeFxCanvas);
         resizeFxCanvas();

         function spawnCelebrationConfetti(x, y) {
            if (state.settings.sensoryCalm) return;
            const colors = ['#ffca28', '#29b6f6', '#ef5350', '#66bb6a', '#ab47bc', '#ff7043'];
            for (let i = 0; i < 55; i++) {
               const angle = Math.random() * Math.PI * 2;
               const speed = 3 + Math.random() * 8;
               particles.push({
                  x,
                  y,
                  vx: Math.cos(angle) * speed,
                  vy: Math.sin(angle) * speed - 4,
                  size: 7 + Math.random() * 7,
                  color: colors[i % colors.length],
                  rot: Math.random() * 360,
                  vRot: (Math.random() - 0.5) * 12,
                  life: 1.0,
               });
            }
            if (!fxAnimId) renderConfettiLoop();
         }

         function renderConfettiLoop() {
            fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
            particles.forEach((p) => {
               p.x += p.vx;
               p.y += p.vy;
               p.vy += 0.25; // gravity
               p.rot += p.vRot;
               p.life -= 0.016;

               fxCtx.save();
               fxCtx.translate(p.x, p.y);
               fxCtx.rotate((p.rot * Math.PI) / 180);
               fxCtx.globalAlpha = Math.max(0, p.life);
               fxCtx.fillStyle = p.color;
               fxCtx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.65);
               fxCtx.restore();
            });

            particles = particles.filter((p) => p.life > 0);
            if (particles.length > 0) {
               fxAnimId = requestAnimationFrame(renderConfettiLoop);
            } else {
               fxAnimId = null;
            }
         }

         // -------------------------------------------------------------------------
         // 6. UI & ACCESSIBILITY INITIALIZATION
         // -------------------------------------------------------------------------
         function applyAccessibilitySettings() {
            document.body.classList.toggle('no-vowel-highlight', !state.settings.vowelHighlight);
            document.body.classList.toggle('high-contrast', state.settings.highContrast);
            document.body.classList.toggle('sensory-calm', state.settings.sensoryCalm);

            const syncSwitch = (id, isOn) => {
               const el = document.getElementById(id);
               if (!el) return;
               el.classList.toggle('on', isOn);
               el.setAttribute('aria-checked', String(isOn));
            };

            syncSwitch('toggle-vowels', state.settings.vowelHighlight);
            syncSwitch('toggle-letter-audio', state.settings.letterAudio);
            syncSwitch('toggle-contrast', state.settings.highContrast);
            syncSwitch('toggle-calm', state.settings.sensoryCalm);
         }

         function updateStageCompletionBadges() {
            STAGES.forEach((stage, idx) => {
               const badge = document.getElementById(`badge-stage-${idx}`);
               if (!badge) return;
               if (state.completedStages[idx]) {
                  badge.textContent = '★★★';
                  badge.style.background = '#43a047';
               }
            });
         }

         function hideTutorialHand() {
            document.getElementById('tutorial-hand').classList.add('hidden');
         }

         function showTutorialHandIfFirstTime() {
            if (state.tutorialShown || state.stageIndex !== 0 || state.wordIndex !== 0) return;
            const firstEmptyIdx = state.slots.findIndex((s) => s === null);
            if (firstEmptyIdx === -1) {
               hideTutorialHand();
               return;
            }
            const targetWord = STAGES[0].words[0].word;
            const neededChar = targetWord[firstEmptyIdx];
            const tileEl = Array.from(document.querySelectorAll('.tile:not(.used)')).find((el) => el.dataset.char === neededChar);

            if (tileEl) {
               const rect = tileEl.getBoundingClientRect();
               const hand = document.getElementById('tutorial-hand');
               hand.style.left = `${rect.left + rect.width / 2 - 14}px`;
               hand.style.top = `${rect.top + rect.height / 2}px`;
               hand.classList.remove('hidden');
            }
         }

         // -------------------------------------------------------------------------
         // 7. CORE GAMEPLAY MECHANICS (LOAD WORD, PLACE TILE, DRAG & DROP, CROSSING)
         // -------------------------------------------------------------------------
         function getCurrentWordObj() {
            return STAGES[state.stageIndex].words[state.wordIndex];
         }

         function shuffleArray(arr) {
            const copy = [...arr];
            for (let i = copy.length - 1; i > 0; i--) {
               const j = Math.floor(Math.random() * (i + 1));
               [copy[i], copy[j]] = [copy[j], copy[i]];
            }
            return copy;
         }

         function resetTruckPosition(instant = false) {
            const truck = document.getElementById('shark-truck');
            if (instant) truck.style.transition = 'none';
            truck.classList.remove('driving');
            truck.classList.add('idle-bounce');
            truck.style.left = window.innerWidth <= 680 ? '2%' : '6%';
            truck.style.transform = 'translateX(0) rotate(0deg)';
            if (instant) {
               void truck.offsetWidth;
               truck.style.transition = 'left 0.45s cubic-bezier(0.34, 1.56, 0.64, 1), transform 0.25s ease';
            }
         }

         function loadWordChallenge(autoSpeak = true) {
            state.isAnimating = false;
            state.slots = [null, null, null];
            hideTutorialHand();
            resetTruckPosition(true);

            const stage = STAGES[state.stageIndex];
            const wordObj = getCurrentWordObj();

            // Update HUD
            document.getElementById('hud-progress').textContent = `${state.wordIndex + 1} / ${stage.words.length}`;
            document.getElementById('picture-svg-container').innerHTML = getWordIllustrationSVG(wordObj.word);

            // Build shuffled letter tiles (3 target letters + stage distractors)
            const rawLetters = [...wordObj.phonemes, ...wordObj.distractors];
            let shuffled = shuffleArray(rawLetters);
            // Avoid accidental pre-solved order in first 3 tiles
            if (shuffled.slice(0, 3).join('') === wordObj.word) {
               shuffled.reverse();
            }

            state.trayTiles = shuffled.map((char, idx) => ({
               id: `tile-${idx}-${char}`,
               char,
               used: false,
            }));

            renderBridgeSlots();
            renderTrayTiles();

            if (autoSpeak) {
               setTimeout(() => {
                  sound.speak(wordObj.word, 0.88);
                  showTutorialHandIfFirstTime();
               }, 250);
            }
         }

         function renderBridgeSlots() {
            const slotEls = document.querySelectorAll('.bridge-slot');
            slotEls.forEach((slotEl, idx) => {
               const tileObj = state.slots[idx];
               slotEl.className = 'bridge-slot';
               slotEl.innerHTML = '';

               if (tileObj) {
                  slotEl.classList.add('filled');
                  const span = document.createElement('span');
                  span.className = `slot-letter ${VOWELS.has(tileObj.char) ? 'letter-vowel' : 'letter-consonant'}`;
                  span.textContent = tileObj.char;
                  slotEl.appendChild(span);
                  slotEl.setAttribute('aria-label', `Slot ${idx + 1}: ${tileObj.char}`);
               } else {
                  const hint = document.createElement('span');
                  hint.className = 'slot-index-hint';
                  slotEl.appendChild(hint);
                  slotEl.setAttribute('aria-label', `Empty Slot ${idx + 1}`);
               }
            });
         }

         function renderTrayTiles() {
            const trayRow = document.getElementById('tiles-row');
            trayRow.innerHTML = '';

            state.trayTiles.forEach((tileObj) => {
               const btn = document.createElement('button');
               btn.type = 'button';
               btn.className = `tile ${tileObj.used ? 'used' : ''} ${VOWELS.has(tileObj.char) ? 'letter-vowel' : 'letter-consonant'}`;
               btn.textContent = tileObj.char;
               btn.dataset.tileId = tileObj.id;
               btn.dataset.char = tileObj.char;
               btn.setAttribute('aria-label', `Letter ${tileObj.char}. Tap or drag onto bridge.`);

               // Pointer Drag & One-Tap Support
               setupTilePointerInteraction(btn, tileObj);
               trayRow.appendChild(btn);
            });
         }

         function placeTileInSlot(tileObj, targetSlotIndex = null) {
            if (state.isAnimating || !tileObj || tileObj.used) return;

            // Determine slot index: specified or first empty slot from left to right
            let slotIdx = targetSlotIndex;
            if (slotIdx === null || slotIdx === undefined) {
               slotIdx = state.slots.findIndex((s) => s === null);
            }
            if (slotIdx === -1 || slotIdx < 0 || slotIdx > 2) return;

            // If target slot already occupied, return existing tile back to tray first
            if (state.slots[slotIdx]) {
               const prev = state.slots[slotIdx];
               prev.used = false;
            }

            tileObj.used = true;
            state.slots[slotIdx] = tileObj;

            sound.playWoodKnock(slotIdx);
            if (state.settings.letterAudio) {
               sound.speak(LETTER_PHONICS_SPEECH[tileObj.char] || tileObj.char, 1.0);
            }

            renderBridgeSlots();
            renderTrayTiles();

            if (state.tutorialShown === false && state.stageIndex === 0 && state.wordIndex === 0) {
               if (state.slots.every((s) => s !== null)) {
                  state.tutorialShown = true;
                  saveGameData();
                  hideTutorialHand();
               } else {
                  showTutorialHandIfFirstTime();
               }
            }

            // Automatically evaluate once all 3 bridge planks are placed
            if (state.slots.every((s) => s !== null)) {
               setTimeout(evaluateBridgeSpelling, 320);
            }
         }

         function removeTileFromSlot(slotIdx) {
            if (state.isAnimating) return;
            const tileObj = state.slots[slotIdx];
            if (!tileObj) return;

            tileObj.used = false;
            state.slots[slotIdx] = null;
            sound.playTileReturn();
            renderBridgeSlots();
            renderTrayTiles();
         }

         // -------------------------------------------------------------------------
         // 8. UNIFIED POINTER DRAG-AND-DROP + ONE-TAP AUTO-FILL
         // -------------------------------------------------------------------------
         function setupTilePointerInteraction(tileEl, tileObj) {
            tileEl.addEventListener('pointerdown', (e) => {
               if (state.isAnimating || tileObj.used) return;
               e.preventDefault();
               sound.ensureContext();

               const startX = e.clientX;
               const startY = e.clientY;
               let hasDragged = false;
               let ghostEl = null;

               const onPointerMove = (moveEvt) => {
                  const dx = moveEvt.clientX - startX;
                  const dy = moveEvt.clientY - startY;
                  if (!hasDragged && Math.hypot(dx, dy) > 10) {
                     hasDragged = true;
                     ghostEl = tileEl.cloneNode(true);
                     ghostEl.classList.add('dragging-ghost');
                     ghostEl.style.width = `${tileEl.offsetWidth}px`;
                     ghostEl.style.height = `${tileEl.offsetHeight}px`;
                     document.body.appendChild(ghostEl);
                     tileEl.style.opacity = '0.35';
                  }

                  if (hasDragged && ghostEl) {
                     ghostEl.style.left = `${moveEvt.clientX - tileEl.offsetWidth / 2}px`;
                     ghostEl.style.top = `${moveEvt.clientY - tileEl.offsetHeight / 2}px`;
                     highlightHoveredSlot(moveEvt.clientX, moveEvt.clientY);
                  }
               };

               const onPointerUp = (upEvt) => {
                  window.removeEventListener('pointermove', onPointerMove);
                  window.removeEventListener('pointerup', onPointerUp);
                  clearSlotHighlights();

                  if (ghostEl) {
                     ghostEl.remove();
                     tileEl.style.opacity = '';
                  }

                  if (!hasDragged) {
                     // One-Tap Auto-Fill into next available slot (Inclusive Motor Accessibility)
                     placeTileInSlot(tileObj, null);
                  } else {
                     // Drop onto hovered bridge slot if within drop radius
                     const droppedSlotIdx = getSlotAtPoint(upEvt.clientX, upEvt.clientY);
                     if (droppedSlotIdx !== null) {
                        placeTileInSlot(tileObj, droppedSlotIdx);
                     }
                  }
               };

               window.addEventListener('pointermove', onPointerMove);
               window.addEventListener('pointerup', onPointerUp);
            });
         }

         function getSlotAtPoint(x, y) {
            const slotEls = document.querySelectorAll('.bridge-slot');
            for (let i = 0; i < slotEls.length; i++) {
               const rect = slotEls[i].getBoundingClientRect();
               const pad = 18; // Generous drop zone for children
               if (x >= rect.left - pad && x <= rect.right + pad && y >= rect.top - pad && y <= rect.bottom + pad) {
                  return i;
               }
            }
            return null;
         }

         function highlightHoveredSlot(x, y) {
            const hoveredIdx = getSlotAtPoint(x, y);
            document.querySelectorAll('.bridge-slot').forEach((el, idx) => {
               el.classList.toggle('drag-over', idx === hoveredIdx);
            });
         }

         function clearSlotHighlights() {
            document.querySelectorAll('.bridge-slot').forEach((el) => el.classList.remove('drag-over'));
         }

         // -------------------------------------------------------------------------
         // 9. BRIDGE EVALUATION & SHARK TRUCK CROSSING ANIMATION
         // -------------------------------------------------------------------------
         function evaluateBridgeSpelling() {
            const wordObj = getCurrentWordObj();
            const spelled = state.slots.map((s) => s.char).join('');

            if (spelled === wordObj.word) {
               runSuccessCrossingAnimation(wordObj);
            } else {
               runGentleCorrectionAnimation(wordObj);
            }
         }

         function runSuccessCrossingAnimation(wordObj) {
            state.isAnimating = true;
            const truck = document.getElementById('shark-truck');
            const slotEls = document.querySelectorAll('.bridge-slot');

            truck.classList.remove('idle-bounce');
            truck.classList.add('driving');
            sound.playTruckRev(state.settings.sensoryCalm);

            // Step positions across the 3 planks and onto the Rainbow Finish cliff
            const stepLeftPositions = ['26%', '42%', '58%', '75%'];

            // Plank 1 (First sound)
            setTimeout(() => {
               truck.style.left = stepLeftPositions[0];
               slotEls[0].classList.add('active-step');
               sound.playStepChime(0);
               sound.speak(LETTER_PHONICS_SPEECH[wordObj.phonemes[0]] || wordObj.phonemes[0], 1.05);
            }, 300);

            // Plank 2 (Middle vowel)
            setTimeout(() => {
               slotEls[0].classList.remove('active-step');
               truck.style.left = stepLeftPositions[1];
               slotEls[1].classList.add('active-step');
               sound.playStepChime(1);
               sound.speak(LETTER_PHONICS_SPEECH[wordObj.phonemes[1]] || wordObj.phonemes[1], 1.05);
            }, 950);

            // Plank 3 (Ending sound)
            setTimeout(() => {
               slotEls[1].classList.remove('active-step');
               truck.style.left = stepLeftPositions[2];
               slotEls[2].classList.add('active-step');
               sound.playStepChime(2);
               sound.speak(LETTER_PHONICS_SPEECH[wordObj.phonemes[2]] || wordObj.phonemes[2], 1.05);
            }, 1600);

            // Cross Rainbow Finish Line!
            setTimeout(() => {
               slotEls[2].classList.remove('active-step');
               truck.style.left = stepLeftPositions[3];
               truck.classList.remove('driving');
               truck.classList.add('idle-bounce');

               sound.playFanfare();
               sound.speak(`${wordObj.word}!`, 0.92);

               const finishRect = document.getElementById('rainbow-finish').getBoundingClientRect();
               spawnCelebrationConfetti(finishRect.left + finishRect.width / 2, finishRect.top + 30);
            }, 2250);

            // Advance to next word or Stage Complete
            setTimeout(() => {
               const stage = STAGES[state.stageIndex];
               if (state.wordIndex + 1 < stage.words.length) {
                  state.wordIndex++;
                  loadWordChallenge(true);
               } else {
                  state.isAnimating = false;
                  state.completedStages[state.stageIndex] = true;
                  saveGameData();
                  updateStageCompletionBadges();
                  openStageCompleteModal();
               }
            }, 3850);
         }

         function runGentleCorrectionAnimation(wordObj) {
            state.isAnimating = true;
            const truck = document.getElementById('shark-truck');
            const bridgeRow = document.getElementById('bridge-slots-row');
            const slotEls = document.querySelectorAll('.bridge-slot');

            // Truck nudges edge gently, bridge wobbles safely (never falls!)
            truck.style.transform = 'translateX(22px) rotate(-3deg)';
            bridgeRow.classList.add('wobble');
            sound.playGentleWobble();

            // Identify wrong positions
            let firstWrongIdx = -1;
            state.slots.forEach((tileObj, idx) => {
               if (tileObj.char !== wordObj.phonemes[idx]) {
                  slotEls[idx].classList.add('wrong-slot');
                  if (firstWrongIdx === -1) firstWrongIdx = idx;
               }
            });

            const neededLetter = wordObj.phonemes[firstWrongIdx];
            const neededSound = LETTER_PHONICS_SPEECH[neededLetter] || neededLetter;
            sound.speak(`${neededSound} ... ${wordObj.word}`, 0.85);

            // Return only the misplaced wooden tiles back to the tray so child keeps correct letters
            setTimeout(() => {
               truck.style.transform = 'translateX(0) rotate(0deg)';
               bridgeRow.classList.remove('wobble');

               state.slots.forEach((tileObj, idx) => {
                  if (tileObj && tileObj.char !== wordObj.phonemes[idx]) {
                     tileObj.used = false;
                     state.slots[idx] = null;
                  }
               });

               renderBridgeSlots();
               renderTrayTiles();
               state.isAnimating = false;
            }, 1150);
         }

         // -------------------------------------------------------------------------
         // 10. HELPER BUTTONS, KEYBOARD SUPPORT & MODALS
         // -------------------------------------------------------------------------
         function speakSlowPhonicsBreakdown() {
            const wordObj = getCurrentWordObj();
            const [p1, p2, p3] = wordObj.phonemes.map((ch) => LETTER_PHONICS_SPEECH[ch] || ch);
            sound.speak(`${p1} ... ${p2} ... ${p3} ... ${wordObj.word}`, 0.72);
         }

         function givePositiveHint() {
            if (state.isAnimating) return;
            const wordObj = getCurrentWordObj();
            // Find first slot that is either empty or wrong
            let targetIdx = state.slots.findIndex((s, i) => !s || s.char !== wordObj.phonemes[i]);
            if (targetIdx === -1) return;

            const neededChar = wordObj.phonemes[targetIdx];
            // If wrong tile is in targetIdx, clear it first
            if (state.slots[targetIdx]) {
               state.slots[targetIdx].used = false;
               state.slots[targetIdx] = null;
            }

            // Find unused matching tile in tray (or reclaim if placed in wrong slot)
            let matchingTile = state.trayTiles.find((t) => !t.used && t.char === neededChar);
            if (!matchingTile) {
               const wrongSlotIdx = state.slots.findIndex((s, i) => s && s.char === neededChar && i !== targetIdx);
               if (wrongSlotIdx !== -1) {
                  matchingTile = state.slots[wrongSlotIdx];
                  matchingTile.used = false;
                  state.slots[wrongSlotIdx] = null;
               }
            }

            if (matchingTile) {
               placeTileInSlot(matchingTile, targetIdx);
            }
         }

         function openStageCompleteModal() {
            const stage = STAGES[state.stageIndex];
            document.getElementById('complete-modal-title').textContent = `★ ${stage.id + 1} ★`;

            const grid = document.getElementById('word-garage-grid');
            grid.innerHTML = '';
            stage.words.forEach((w) => {
               const btn = document.createElement('button');
               btn.type = 'button';
               btn.className = 'garage-word-btn';
               btn.innerHTML = `${getWordIllustrationSVG(w.word)}<span class="garage-word-label">${w.word}</span>`;
               btn.setAttribute('aria-label', `Hear word ${w.word}`);
               btn.addEventListener('click', () => {
                  sound.playWoodKnock(1);
                  sound.speak(w.word, 0.88);
               });
               grid.appendChild(btn);
            });

            const nextBtn = document.getElementById('btn-next-stage');
            nextBtn.style.display = state.stageIndex < STAGES.length - 1 ? 'inline-flex' : 'none';

            document.getElementById('complete-modal').classList.remove('hidden');
            spawnCelebrationConfetti(window.innerWidth / 2, window.innerHeight / 3);
         }

         function switchScreen(screenName) {
            document.getElementById('start-screen').classList.toggle('hidden', screenName !== 'start');
            document.getElementById('game-screen').classList.toggle('hidden', screenName !== 'game');
            if (screenName !== 'game') hideTutorialHand();
         }

         // -------------------------------------------------------------------------
         // 11. EVENT LISTENERS & BOOTSTRAP
         // -------------------------------------------------------------------------
         window.addEventListener('DOMContentLoaded', () => {
            loadSavedData();
            applyAccessibilitySettings();
            updateStageCompletionBadges();

            // Inject SVG artwork into start preview & game arena
            document.getElementById('hero-truck-slot').innerHTML = SVG_ASSETS.sharkTruck;
            document.getElementById('hero-rainbow-slot').innerHTML = SVG_ASSETS.rainbowFinish;
            document.getElementById('shark-truck').innerHTML = SVG_ASSETS.sharkTruck;
            document.getElementById('rainbow-finish').innerHTML = SVG_ASSETS.rainbowFinish;

            // Stage selection radio cards
            document.querySelectorAll('.level-card').forEach((card) => {
               card.addEventListener('click', () => {
                  document.querySelectorAll('.level-card').forEach((c) => {
                     c.classList.remove('selected');
                     c.setAttribute('aria-checked', 'false');
                  });
                  card.classList.add('selected');
                  card.setAttribute('aria-checked', 'true');
                  state.stageIndex = Number(card.dataset.stage);
                  sound.playWoodKnock(state.stageIndex);
               });
            });

            // Start Game
            document.getElementById('btn-start-game').addEventListener('click', () => {
               sound.ensureContext();
               sound.playTruckRev(state.settings.sensoryCalm);
               state.wordIndex = 0;
               switchScreen('game');
               loadWordChallenge(true);
            });

            // Home button
            document.getElementById('btn-home').addEventListener('click', () => {
               switchScreen('start');
            });

            // Picture card & Speaker button
            const speakCurrentWord = () => {
               const w = getCurrentWordObj();
               sound.speak(w.word, 0.86);
            };
            document.getElementById('picture-card').addEventListener('click', speakCurrentWord);
            document.getElementById('btn-speak-word').addEventListener('click', speakCurrentWord);

            // Helper Controls
            document.getElementById('btn-slow-phonics').addEventListener('click', speakSlowPhonicsBreakdown);
            document.getElementById('btn-hint').addEventListener('click', givePositiveHint);
            document.getElementById('btn-clear-bridge').addEventListener('click', () => {
               if (state.isAnimating) return;
               state.slots.forEach((s) => {
                  if (s) s.used = false;
               });
               state.slots = [null, null, null];
               sound.playTileReturn();
               renderBridgeSlots();
               renderTrayTiles();
            });

            // Tap filled bridge slot to return plank back to tray
            document.querySelectorAll('.bridge-slot').forEach((slotEl, idx) => {
               slotEl.addEventListener('click', () => {
                  removeTileFromSlot(idx);
               });
            });

            // Accessibility Modal Triggers
            const openA11y = () => document.getElementById('a11y-modal').classList.remove('hidden');
            const closeA11y = () => document.getElementById('a11y-modal').classList.add('hidden');
            document.getElementById('btn-open-a11y-start').addEventListener('click', openA11y);
            document.getElementById('btn-open-a11y-game').addEventListener('click', openA11y);
            document.getElementById('btn-close-a11y').addEventListener('click', closeA11y);
            document.getElementById('btn-done-a11y').addEventListener('click', closeA11y);

            document.getElementById('toggle-vowels').addEventListener('click', () => {
               state.settings.vowelHighlight = !state.settings.vowelHighlight;
               applyAccessibilitySettings();
               saveGameData();
            });

            document.getElementById('toggle-letter-audio').addEventListener('click', () => {
               state.settings.letterAudio = !state.settings.letterAudio;
               applyAccessibilitySettings();
               saveGameData();
            });

            document.getElementById('toggle-contrast').addEventListener('click', () => {
               state.settings.highContrast = !state.settings.highContrast;
               applyAccessibilitySettings();
               saveGameData();
            });

            document.getElementById('toggle-calm').addEventListener('click', () => {
               state.settings.sensoryCalm = !state.settings.sensoryCalm;
               applyAccessibilitySettings();
               saveGameData();
            });

            // Stage Complete Modal Actions
            document.getElementById('btn-next-stage').addEventListener('click', () => {
               document.getElementById('complete-modal').classList.add('hidden');
               if (state.stageIndex + 1 < STAGES.length) {
                  state.stageIndex++;
                  state.wordIndex = 0;
                  loadWordChallenge(true);
               }
            });

            document.getElementById('btn-replay-stage').addEventListener('click', () => {
               document.getElementById('complete-modal').classList.add('hidden');
               state.wordIndex = 0;
               loadWordChallenge(true);
            });

            document.getElementById('btn-menu-from-complete').addEventListener('click', () => {
               document.getElementById('complete-modal').classList.add('hidden');
               switchScreen('start');
            });

            // Full Keyboard Accessibility (A-Z to place, Backspace to remove, Space to speak)
            window.addEventListener('keydown', (e) => {
               if (document.getElementById('game-screen').classList.contains('hidden')) return;
               if (!document.getElementById('a11y-modal').classList.contains('hidden')) return;
               if (!document.getElementById('complete-modal').classList.contains('hidden')) return;
               if (state.isAnimating) return;

               const key = e.key.toLowerCase();
               if (key === ' ' || (key === 'enter' && document.activeElement === document.body)) {
                  e.preventDefault();
                  speakCurrentWord();
               } else if (key === 'backspace' || key === 'delete') {
                  e.preventDefault();
                  for (let i = 2; i >= 0; i--) {
                     if (state.slots[i] !== null) {
                        removeTileFromSlot(i);
                        break;
                     }
                  }
               } else if (/^[a-z]$/.test(key)) {
                  const matchingTile = state.trayTiles.find((t) => !t.used && t.char === key);
                  if (matchingTile) {
                     e.preventDefault();
                     placeTileInSlot(matchingTile, null);
                  }
               }
            });
         });
      </script>
   </body>
</html>
