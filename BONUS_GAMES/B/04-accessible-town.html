         /**
          * ========================================================================
          * 5. STAGE INITIALIZATION & VISUAL HUD RENDERING
          * ========================================================================
          */
         function loadStage(index) {
            game.currentStageIndex = index % STAGES.length;
            const stageCfg = STAGES[game.currentStageIndex];

            // Reset score for this stage (and reset all scores if starting a fresh run from Stage 1)
            if (index === 0) {
               game.stageScores = [0, 0, 0, 0, 0];
            } else {
               game.stageScores[game.currentStageIndex] = 0;
            }

            // Reset steps
            stageCfg.steps.forEach((s) => {
               s.done = false;
            });

            // Reset player position & state
            game.player.x = 0.16;
            game.player.y = 0.54;
            game.player.z = 0;
            game.player.vz = 0;
            game.player.carrying = null;
            game.player.happyTimer = 0;
            game.stageComplete = false;
            game.idleTimer = 0;
            setHintLevel(0);

            // Build stage entities
            game.stageData = stageCfg.setup();

            // Generate gentle background wildflowers
            game.decorations = [];
            const flowerEmojis = ['🌼', '🌷', '🍀', '🌱'];
            for (let i = 0; i < 14; i++) {
               game.decorations.push({
                  x: 0.08 + Math.random() * 0.84,
                  y: 0.24 + Math.random() * 0.64,
                  icon: flowerEmojis[i % flowerEmojis.length],
                  phase: Math.random() * Math.PI * 2,
               });
            }

            // Hide celebration modal if open and refresh HUD/voice prompt
            const celeb = document.getElementById('celebrationOverlay');
            celeb.classList.add('hidden');
            celeb.classList.remove('flex');

            updateHudUI();
            sound.speakThai(stageCfg.voicePrompt);
         }

         function getTotalScore() {
            return game.stageScores.reduce((sum, val) => sum + val, 0);
         }

         function addStepPoints(points = 10) {
            game.stageScores[game.currentStageIndex] = Math.min(50, game.stageScores[game.currentStageIndex] + points);
         }

         function updateHudUI() {
            const stageCfg = STAGES[game.currentStageIndex];
            document.getElementById('hudLevelNum').textContent = `${stageCfg.id}/${STAGES.length}`;
            document.getElementById('hudScoreNum').textContent = `${getTotalScore()}`;

            // Render Visual Step-by-Step Cards
            const slotsContainer = document.getElementById('hudStepSlots');
            slotsContainer.innerHTML = '';

            stageCfg.steps.forEach((step, idx) => {
               const isNext = !step.done && stageCfg.steps.findIndex((s) => !s.done) === idx;
               const card = document.createElement('div');
               card.className = `flex flex-col items-center justify-center rounded-2xl border-[2.5px] border-[#0F172A] px-2.5 py-1.5 min-w-[56px] sm:min-w-[66px] transition-all ${
                  step.done ? 'bg-[#86EFAC] scale-95' : isNext ? 'bg-[#FEF08A] ring-4 ring-[#F59E0B]/50 scale-105' : 'bg-white opacity-80'
               }`;
               card.innerHTML = `
          <span class="text-xl sm:text-2xl leading-none">${step.done ? '✅' : step.icon}</span>
          <span class="text-[11px] font-bold text-[#0F172A] mt-1 leading-none">${step.label}</span>
        `;
               slotsContainer.appendChild(card);
            });

            // Render Visual Equation Pill at Bottom Center (Picture-based guidance)
            const eqEl = document.getElementById('hudVisualEquation');
            const nextStep = stageCfg.steps.find((s) => !s.done);
            if (nextStep) {
               eqEl.innerHTML = `
          <span class="text-2xl">🐰</span>
          <span class="font-bold text-lg text-[#0F172A]">➔</span>
          <span class="text-2xl">${nextStep.icon}</span>
          <span class="px-2.5 py-0.5 bg-[#DDD6FE] border-2 border-[#0F172A] rounded-full text-xs font-bold">กด SPACE</span>
        `;
            } else {
               eqEl.innerHTML = `<span class="text-2xl">🎉</span><span class="font-bold text-base">สำเร็จแล้ว!</span>`;
            }
         }

         /**
          * ========================================================================
          * 6. PROGRESSIVE SCAFFOLDING SYSTEM (ระบบช่วยเหลือแบบค่อยเป็นค่อยไป 3 ระดับ)
          *    Level 1: Target pulses with golden ring
          *    Level 2: Stepping-stone dotted path + Ghost Helper Spirit demonstrates
          *    Level 3: Strong magnetic assist + automatic step completion nudge
          * ========================================================================
          */
         function setHintLevel(level) {
            game.hintLevel = Math.min(3, Math.max(0, level));

            // Update 3 indicator dots on the Hint button
            const dots = document.getElementById('hintLevelDots').children;
            for (let i = 0; i < dots.length; i++) {
               dots[i].style.backgroundColor = i < game.hintLevel ? '#0F172A' : '#FFFFFF';
            }

            if (game.hintLevel >= 2) {
               startGhostDemonstration();
            } else {
               game.ghostDemo.active = false;
            }
         }

         function getCurrentObjectiveTarget() {
            const data = game.stageData;
            if (!data) return null;

            if (data.type === 'fruit_harvest') {
               if (game.player.carrying) {
                  const friend = STAGES[game.currentStageIndex].friend;
                  return { x: friend.x, y: friend.y, action: 'deliver' };
               }
               const nextFruit = data.items.find((f) => !f.delivered);
               return nextFruit ? { x: nextFruit.x, y: nextFruit.y, action: 'collect' } : null;
            }

            if (data.type === 'lilypad_river') {
               const nextPad = data.pads.find((p) => !p.activated);
               if (nextPad) return { x: nextPad.x, y: nextPad.y, action: 'jump' };
               const friend = STAGES[game.currentStageIndex].friend;
               return { x: friend.x, y: friend.y, action: 'finish' };
            }

            if (data.type === 'musical_flowers') {
               const targetId = data.sequence[data.currentIndex];
               const flower = data.flowers.find((f) => f.id === targetId);
               return flower ? { x: flower.x, y: flower.y, action: 'jump' } : null;
            }

            if (data.type === 'shape_sorting') {
               if (game.player.carrying) {
                  const ped = data.pedestals.find((p) => p.id === game.player.carrying.id);
                  return ped ? { x: ped.x, y: ped.y, action: 'place' } : null;
               }
               const nextCrystal = data.crystals.find((c) => !c.placed);
               return nextCrystal ? { x: nextCrystal.x, y: nextCrystal.y, action: 'collect' } : null;
            }

            if (data.type === 'star_festival') {
               const unlit = data.lanterns.find((l) => !l.lit);
               if (unlit) return { x: unlit.x, y: unlit.y, action: 'jump' };
               if (!data.bell.rung) return { x: data.bell.x, y: data.bell.y, action: 'jump' };
            }

            return null;
         }

         function startGhostDemonstration() {
            const target = getCurrentObjectiveTarget();
            if (!target) return;
            game.ghostDemo.active = true;
            game.ghostDemo.x = game.player.x;
            game.ghostDemo.y = game.player.y;
            game.ghostDemo.targetX = target.x;
            game.ghostDemo.targetY = target.y;
            game.ghostDemo.progress = 0;
         }

         // Manual Assist Buttons
         document.getElementById('btnRepeat').addEventListener('click', () => {
            sound.init();
            sound.playHint();
            const stageCfg = STAGES[game.currentStageIndex];
            sound.speakThai(stageCfg.voicePrompt);
            setHintLevel(Math.max(1, game.hintLevel));
         });

         document.getElementById('btnHint').addEventListener('click', () => {
            sound.init();
            sound.playHint();
            const nextHint = game.hintLevel < 3 ? game.hintLevel + 1 : 2;
            setHintLevel(nextHint);
            if (nextHint === 2) {
               sound.speakThai('ดูน้องภูตตัวอย่างเดินนำทางนะ');
            } else if (nextHint === 3) {
               sound.speakThai('เดินตามเส้นแสงสีทองได้เลย');
            }
         });

         document.getElementById('btnOpenTutorial').addEventListener('click', () => {
            sound.init();
            tutorialOverlay.classList.remove('hidden');
         });

         document.getElementById('btnStartGame').addEventListener('click', () => {
            sound.init();
            sound.playCollect();
            tutorialOverlay.classList.add('hidden');
            document.getElementById('gameHud').classList.remove('hidden');
            if (!game.started) {
               game.started = true;
               loadStage(0);
            }
         });

         document.getElementById('btnReplayStage').addEventListener('click', () => {
            sound.init();
            loadStage(game.currentStageIndex);
         });

         document.getElementById('btnHome').addEventListener('click', () => {
            sound.init();
            sound.playStep();
            // Reset game state and return to the Main / Interactive Tutorial Home Screen
            game.started = false;
            game.stageComplete = false;
            game.currentStageIndex = 0;
            game.stageScores = [0, 0, 0, 0, 0];
            document.getElementById('celebrationOverlay').classList.add('hidden');
            document.getElementById('celebrationOverlay').classList.remove('flex');
            document.getElementById('gameHud').classList.add('hidden');
            tutorialOverlay.classList.remove('hidden');
         });

         document.getElementById('btnNextStage').addEventListener('click', () => {
            sound.init();
            const isLast = game.currentStageIndex === STAGES.length - 1;
            if (isLast) {
               // Full restart from Stage 1 with reset score
               loadStage(0);
            } else {
               loadStage(game.currentStageIndex + 1);
            }
         });

         // Direct Canvas Tap/Click-to-Move & Interact (Crucial for children using tablets/mice)
         canvas.addEventListener('pointerdown', (e) => {
            if (!game.started || !tutorialOverlay.classList.contains('hidden') || game.stageComplete) return;
            sound.init();
            const rect = canvas.getBoundingClientRect();
            const nx = (e.clientX - rect.left) / rect.width;
            const ny = (e.clientY - rect.top) / rect.height;

            // Clamp within playable meadow area
            inputState.pointerTarget = {
               x: Math.max(0.08, Math.min(0.92, nx)),
               y: Math.max(0.22, Math.min(0.86, ny)),
            };
            game.idleTimer = 0;

            // If child taps right on top of Pui-Mek, trigger Jump/Action!
            if (Math.hypot(nx - game.player.x, ny - game.player.y) < 0.08) {
               triggerJumpAction();
            }
         });

         /**
          * ========================================================================
          * 7. PLAYER JUMP & INTERACTION MECHANICS (SPACEBAR / TAP)
          * ========================================================================
          */
         function triggerJumpAction() {
            if (!game.started || !tutorialOverlay.classList.contains('hidden') || game.stageComplete) return;

            // Jump physics
            if (game.player.z === 0) {
               game.player.vz = 0.036;
               game.player.scaleX = 0.78;
               game.player.scaleY = 1.26;
               sound.playJump();
               spawnParticles(game.player.x, game.player.y + 0.03, '#FFFFFF', 6);
            }

            game.idleTimer = 0;
            checkStageInteraction(true);
         }

         function checkStageInteraction(isExplicitAction = false) {
            if (game.stageComplete || !game.stageData) return;

            const p = game.player;
            const data = game.stageData;
            const stageCfg = STAGES[game.currentStageIndex];
            // Larger forgiveness radius when hintLevel is active (Accessibility boost)
            const reach = game.hintLevel >= 3 ? 0.14 : 0.095;

            // --- STAGE 1: FRUIT HARVEST ---
            if (data.type === 'fruit_harvest') {
               if (!p.carrying) {
                  for (const item of data.items) {
                     if (!item.delivered && Math.hypot(p.x - item.x, p.y - item.y) < reach) {
                        p.carrying = item;
                        item.collected = true;
                        sound.playCollect();
                        sound.speakThai('เก็บได้แล้ว! เอาไปให้พี่หมีเลย');
                        spawnParticles(item.x, item.y, '#FACC15', 10);
                        setHintLevel(0);
                        updateHudUI();
                        break;
                     }
                  }
               } else {
                  const friend = stageCfg.friend;
                  if (Math.hypot(p.x - friend.x, p.y - friend.y) < reach + 0.03) {
                     p.carrying.delivered = true;
                     const step = stageCfg.steps.find((s) => s.id === p.carrying.id);
                     if (step && !step.done) {
                        step.done = true;
                        addStepPoints(10);
                     }
                     p.carrying = null;
                     p.happyTimer = 1.0;
                     sound.playCollect();
                     sound.speakThai('เก่งมากเลย!');
                     spawnParticles(friend.x, friend.y - 0.05, '#4ADE80', 14);
                     setHintLevel(0);
                     updateHudUI();

                     if (stageCfg.steps.every((s) => s.done)) {
                        completeCurrentStage();
                     }
                  }
               }
            }

            // --- STAGE 2: RAINBOW LILYPAD RIVER (1 -> 2 -> 3) ---
            if (data.type === 'lilypad_river') {
               const nextPadIndex = data.pads.findIndex((pad) => !pad.activated);
               if (nextPadIndex !== -1) {
                  const targetPad = data.pads[nextPadIndex];
                  if (Math.hypot(p.x - targetPad.x, p.y - targetPad.y) < reach) {
                     targetPad.activated = true;
                     if (!stageCfg.steps[nextPadIndex].done) {
                        stageCfg.steps[nextPadIndex].done = true;
                        addStepPoints(10);
                     }
                     p.happyTimer = 0.8;
                     sound.playCollect();
                     sound.speakThai(`เลข ${targetPad.num} เยี่ยมมาก!`);
                     spawnParticles(targetPad.x, targetPad.y, '#38BDF8', 12);
                     setHintLevel(0);
                     updateHudUI();
                  }
               } else {
                  // All 3 pads activated -> reach Frog Friend!
                  const friend = stageCfg.friend;
                  if (Math.hypot(p.x - friend.x, p.y - friend.y) < reach + 0.03) {
                     completeCurrentStage();
                  }
               }
            }

            // --- STAGE 3: MUSICAL FLOWERS (Pink -> Blue -> Yellow) ---
            if (data.type === 'musical_flowers' && isExplicitAction) {
               const expectedId = data.sequence[data.currentIndex];
               for (const flower of data.flowers) {
                  if (Math.hypot(p.x - flower.x, p.y - flower.y) < reach) {
                     flower.glow = 1.0;
                     sound.playNoteByColor(flower.id);
                     spawnParticles(flower.x, flower.y, flower.color, 10);

                     if (flower.id === expectedId) {
                        if (!stageCfg.steps[data.currentIndex].done) {
                           stageCfg.steps[data.currentIndex].done = true;
                           addStepPoints(10);
                        }
                        data.currentIndex++;
                        p.happyTimer = 0.8;
                        setHintLevel(0);
                        updateHudUI();

                        if (data.currentIndex >= data.sequence.length) {
                           setTimeout(() => completeCurrentStage(), 450);
                        }
                     } else {
                        // Gentle positive guidance without punishment!
                        sound.speakThai('ลองดูสีที่ช่องด้านบนนะ');
                        setHintLevel(Math.max(1, game.hintLevel));
                     }
                     break;
                  }
               }
            }

            // --- STAGE 4: CRYSTAL SHAPE SORTING ---
            if (data.type === 'shape_sorting') {
               if (!p.carrying) {
                  for (const cr of data.crystals) {
                     if (!cr.placed && Math.hypot(p.x - cr.x, p.y - cr.y) < reach) {
                        p.carrying = cr;
                        sound.playCollect();
                        spawnParticles(cr.x, cr.y, cr.color, 10);
                        setHintLevel(0);
                        break;
                     }
                  }
               } else {
                  for (const ped of data.pedestals) {
                     if (!ped.filled && ped.id === p.carrying.id && Math.hypot(p.x - ped.x, p.y - ped.y) < reach + 0.02) {
                        ped.filled = true;
                        p.carrying.placed = true;
                        p.carrying.x = ped.x;
                        p.carrying.y = ped.y;
                        const step = stageCfg.steps.find((s) => s.id === ped.id);
                        if (step && !step.done) {
                           step.done = true;
                           addStepPoints(10);
                        }
                        p.carrying = null;
                        p.happyTimer = 0.9;
                        sound.playCollect();
                        sound.speakThai('วางได้ตรงเป๊ะเลย!');
                        spawnParticles(ped.x, ped.y, '#A855F7', 14);
                        setHintLevel(0);
                        updateHudUI();

                        if (stageCfg.steps.every((s) => s.done)) {
                           completeCurrentStage();
                        }
                        break;
                     }
                  }
               }
            }

            // --- STAGE 5: STARLIGHT FESTIVAL ---
            if (data.type === 'star_festival' && isExplicitAction) {
               for (const lamp of data.lanterns) {
                  if (!lamp.lit && Math.hypot(p.x - lamp.x, p.y - lamp.y) < reach) {
                     lamp.lit = true;
                     const step = stageCfg.steps.find((s) => s.id === lamp.id);
                     if (step && !step.done) {
                        step.done = true;
                        addStepPoints(10);
                     }
                     sound.playCollect();
                     sound.speakThai('โคมไฟสว่างแล้ว!');
                     spawnParticles(lamp.x, lamp.y, '#FACC15', 14);
                     setHintLevel(0);
                     updateHudUI();
                  }
               }

               const allLit = data.lanterns.every((l) => l.lit);
               if (allLit && !data.bell.rung && Math.hypot(p.x - data.bell.x, p.y - data.bell.y) < reach + 0.02) {
                  data.bell.rung = true;
                  data.bell.ringAnim = 1.0;
                  if (!stageCfg.steps[2].done) {
                     stageCfg.steps[2].done = true;
                     addStepPoints(10);
                  }
                  updateHudUI();
                  setTimeout(() => completeCurrentStage(), 450);
               }
            }
         }

         function completeCurrentStage() {
            if (game.stageComplete) return;
            game.stageComplete = true;
            sound.playVictory();

            // Award +20 stage clear bonus (30 step pts + 20 bonus = 50 pts per stage)
            addStepPoints(20);
            updateHudUI();

            const totalScore = getTotalScore();
            const maxScore = STAGES.length * 50;
            const stageCfg = STAGES[game.currentStageIndex];
            const isLast = game.currentStageIndex === STAGES.length - 1;

            const btnReplay = document.getElementById('btnReplayStage');
            const btnHome = document.getElementById('btnHome');
            const btnNextText = document.getElementById('btnNextStageText');
            const btnNextIcon = document.getElementById('btnNextStageIcon');

            document.getElementById('celebScoreLabel').textContent = isLast ? 'คะแนนรวมทั้งหมด' : 'คะแนนสะสมตอนนี้';
            document.getElementById('celebScoreValue').textContent = `${totalScore} / ${maxScore} คะแนน`;

            if (isLast) {
               document.getElementById('celebTitle').textContent = 'ยอดเยี่ยมที่สุดเลย!';
               document.getElementById('celebSubtitle').textContent = 'หนูผ่านครบทุกด่านแล้ว!';
               document.getElementById('celebFriendBadge').textContent = '🐻 🐸 🦉 🐰 🦊';

               // On Final Stage: Offer clear "เริ่มใหม่" (Restart) or "กลับหน้าหลัก" (Home) choices
               btnReplay.classList.add('hidden');
               btnHome.classList.remove('hidden');
               btnHome.classList.add('flex');
               btnNextText.textContent = 'เริ่มใหม่';
               btnNextIcon.innerHTML = '<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/>';

               sound.speakThai(`ยินดีด้วย! หนูได้ ${totalScore} คะแนน เลือกเริ่มใหม่ หรือกลับหน้าหลักได้เลยนะ`);
            } else {
               document.getElementById('celebTitle').textContent = 'เก่งมากเลย!';
               document.getElementById('celebSubtitle').textContent = `ผ่าน${stageCfg.name}แล้ว`;
               document.getElementById('celebFriendBadge').textContent = stageCfg.friend.emoji;

               btnReplay.classList.remove('hidden');
               btnHome.classList.add('hidden');
               btnHome.classList.remove('flex');
               btnNextText.textContent = 'ด่านต่อไป';
               btnNextIcon.innerHTML = '<path d="M5 12h14M13 5l7 7-7 7"/>';

               sound.speakThai('เก่งมากเลย! ไปด่านต่อไปกันเถอะ');
            }

            const overlay = document.getElementById('celebrationOverlay');
            overlay.classList.remove('hidden');
            overlay.classList.add('flex');
         }

         /**
          * ========================================================================
          * 8. PARTICLE & CUTE CHARACTER RENDERERS (CANVAS 2D VECTOR ART)
          * ========================================================================
          */
         function spawnParticles(nx, ny, color, count = 10) {
            for (let i = 0; i < count; i++) {
               const angle = (Math.PI * 2 * i) / count + Math.random() * 0.4;
               const speed = 0.003 + Math.random() * 0.005;
               game.particles.push({
                  x: nx,
                  y: ny,
                  vx: Math.cos(angle) * speed,
                  vy: Math.sin(angle) * speed - 0.002,
                  life: 1.0,
                  size: 5 + Math.random() * 5,
                  color,
               });
            }
         }

         /**
          * Draws our main adorable mascot "น้องปุยเมฆ" (Pui-Mek)
          * Supports squash-and-stretch, floppy ears, carrying items, and translucent Ghost Mode
          */
         function drawPuiMek(c, cx, cy, r, sx, sy, facing, isGhost = false, happy = false) {
            c.save();
            c.translate(cx, cy);

            if (isGhost) {
               c.globalAlpha = 0.55;
            }

            // Soft ground shadow
            c.fillStyle = 'rgba(15, 23, 42, 0.14)';
            c.beginPath();
            c.ellipse(0, r * 0.95, r * 0.85, r * 0.28, 0, 0, Math.PI * 2);
            c.fill();

            c.scale(sx, sy);

            // Floppy Bunny-Cloud Ears
            const earTilt = facing * 0.15;
            [-0.42, 0.42].forEach((offsetX) => {
               c.save();
               c.translate(r * offsetX, -r * 0.78);
               c.rotate(earTilt);
               c.fillStyle = isGhost ? '#E0F2FE' : '#FFFFFF';
               c.strokeStyle = '#0F172A';
               c.lineWidth = Math.max(2.5, r * 0.1);
               c.beginPath();
               c.ellipse(0, -r * 0.35, r * 0.24, r * 0.52, 0, 0, Math.PI * 2);
               c.fill();
               c.stroke();

               // Inner pastel pink ear
               c.fillStyle = '#FBCFE8';
               c.beginPath();
               c.ellipse(0, -r * 0.35, r * 0.11, r * 0.32, 0, 0, Math.PI * 2);
               c.fill();
               c.restore();
            });

            // Fluffy Round Body
            c.fillStyle = isGhost ? '#BAE6FD' : '#FFFFFF';
            c.strokeStyle = '#0F172A';
            c.lineWidth = Math.max(2.8, r * 0.11);
            c.beginPath();
            c.arc(0, 0, r, 0, Math.PI * 2);
            c.fill();
            c.stroke();

            // Cute Little Feet
            c.fillStyle = '#FDE68A';
            c.beginPath();
            c.ellipse(-r * 0.38, r * 0.88, r * 0.26, r * 0.16, 0, 0, Math.PI * 2);
            c.ellipse(r * 0.38, r * 0.88, r * 0.26, r * 0.16, 0, 0, Math.PI * 2);
            c.fill();
            c.stroke();

            // Face shifted slightly toward movement direction
            const faceX = facing * r * 0.12;

            // Rosy Cheeks
            c.fillStyle = '#FDA4AF';
            c.beginPath();
            c.ellipse(faceX - r * 0.46, r * 0.14, r * 0.16, r * 0.1, 0, 0, Math.PI * 2);
            c.ellipse(faceX + r * 0.46, r * 0.14, r * 0.16, r * 0.1, 0, 0, Math.PI * 2);
            c.fill();

            // Eyes (Happy ^ ^ arcs when celebrating, big shiny dots normally)
            c.strokeStyle = '#0F172A';
            c.fillStyle = '#0F172A';
            c.lineWidth = Math.max(2.5, r * 0.09);
            c.lineCap = 'round';

            if (happy) {
               c.beginPath();
               c.arc(faceX - r * 0.28, -r * 0.05, r * 0.13, Math.PI, 0);
               c.stroke();
               c.beginPath();
               c.arc(faceX + r * 0.28, -r * 0.05, r * 0.13, Math.PI, 0);
               c.stroke();
            } else {
               c.beginPath();
               c.arc(faceX - r * 0.28, -r * 0.06, r * 0.11, 0, Math.PI * 2);
               c.arc(faceX + r * 0.28, -r * 0.06, r * 0.11, 0, Math.PI * 2);
               c.fill();

               // Eye sparkles
               c.fillStyle = '#FFFFFF';
               c.beginPath();
               c.arc(faceX - r * 0.25, -r * 0.09, r * 0.04, 0, Math.PI * 2);
               c.arc(faceX + r * 0.31, -r * 0.09, r * 0.04, 0, Math.PI * 2);
               c.fill();
            }

            // Cute Smile
            c.beginPath();
            c.arc(faceX, r * 0.12, r * 0.16, 0.15 * Math.PI, 0.85 * Math.PI);
            c.stroke();

            c.restore();
         }

         function drawGeometricShape(c, shape, x, y, size, fillColor, isOutlineOnly = false) {
            c.save();
            c.translate(x, y);
            c.lineWidth = 3.5;
            c.strokeStyle = '#0F172A';
            c.fillStyle = fillColor;

            if (isOutlineOnly) {
               c.setLineDash([6, 5]);
               c.fillStyle = 'rgba(255, 255, 255, 0.65)';
            }

            c.beginPath();
            if (shape === 'circle') {
               c.arc(0, 0, size, 0, Math.PI * 2);
            } else if (shape === 'square') {
               c.rect(-size * 0.88, -size * 0.88, size * 1.76, size * 1.76);
            } else if (shape === 'triangle') {
               c.moveTo(0, -size * 1.05);
               c.lineTo(size * 0.98, size * 0.82);
               c.lineTo(-size * 0.98, size * 0.82);
               c.closePath();
            }
            c.fill();
            c.stroke();
            c.restore();
         }

         /**
          * ========================================================================
          * 9. MAIN SIMULATION & RENDER LOOP (60 FPS RESPONSIVE CANVAS)
          * ========================================================================
          */
         let lastTime = performance.now();

         function updateGame(dt) {
            if (!game.started || !tutorialOverlay.classList.contains('hidden') || game.stageComplete) return;

            const p = game.player;
            let moveX = 0;
            let moveY = 0;

            if (inputState.left) moveX -= 1;
            if (inputState.right) moveX += 1;
            if (inputState.up) moveY -= 1;
            if (inputState.down) moveY += 1;

            // Handle Tap/Click-to-Walk smooth movement
            if (moveX === 0 && moveY === 0 && inputState.pointerTarget) {
               const dx = inputState.pointerTarget.x - p.x;
               const dy = inputState.pointerTarget.y - p.y;
               const dist = Math.hypot(dx, dy);
               if (dist > 0.015) {
                  moveX = dx / dist;
                  moveY = dy / dist;
               } else {
                  inputState.pointerTarget = null;
                  checkStageInteraction(true);
               }
            }

            // Normalize diagonal movement
            const mag = Math.hypot(moveX, moveY);
            if (mag > 0) {
               moveX /= mag;
               moveY /= mag;

               const baseSpeed = 0.28;
               p.x = Math.max(0.07, Math.min(0.93, p.x + moveX * baseSpeed * dt));
               p.y = Math.max(0.22, Math.min(0.88, p.y + moveY * baseSpeed * dt));

               if (moveX < -0.1) p.facing = -1;
               if (moveX > 0.1) p.facing = 1;

               // Gentle walking bounce & soft step audio
               p.scaleY = 1 + Math.sin(performance.now() * 0.02) * 0.06;
               p.stepSoundTimer -= dt;
               if (p.stepSoundTimer <= 0 && p.z === 0) {
                  sound.playStep();
                  p.stepSoundTimer = 0.28;
               }

               game.idleTimer = 0;
               checkStageInteraction(false);
            } else {
               p.scaleY += (1 - p.scaleY) * 0.15;
               // Automatic Progressive Scaffolding if child pauses/thinks for a while
               game.idleTimer += dt;
               if (game.idleTimer > 5 && game.hintLevel === 0) {
                  setHintLevel(1);
               } else if (game.idleTimer > 11 && game.hintLevel === 1) {
                  setHintLevel(2);
                  sound.playHint();
               }
            }

            // Jump Physics
            if (p.z > 0 || p.vz !== 0) {
               p.z += p.vz;
               p.vz -= 0.0022;
               if (p.z <= 0) {
                  p.z = 0;
                  p.vz = 0;
                  p.scaleX = 1.22;
                  p.scaleY = 0.8;
               }
            }
            p.scaleX += (1 - p.scaleX) * 0.16;

            if (p.happyTimer > 0) p.happyTimer = Math.max(0, p.happyTimer - dt);

            // Update Ghost Helper Spirit animation (Hint Level >= 2)
            if (game.ghostDemo.active) {
               const target = getCurrentObjectiveTarget();
               if (target) {
                  game.ghostDemo.targetX = target.x;
                  game.ghostDemo.targetY = target.y;
                  game.ghostDemo.progress += dt * 0.55;
                  if (game.ghostDemo.progress > 1.25) {
                     game.ghostDemo.progress = 0;
                  }
                  const t = Math.min(1, game.ghostDemo.progress);
                  game.ghostDemo.x = p.x + (target.x - p.x) * t;
                  game.ghostDemo.y = p.y + (target.y - p.y) * t;
               }
            }

            // Update particles
            for (let i = game.particles.length - 1; i >= 0; i--) {
               const pt = game.particles[i];
               pt.x += pt.vx;
               pt.y += pt.vy;
               pt.life -= dt * 1.4;
               if (pt.life <= 0) game.particles.splice(i, 1);
            }
         }

         function renderGame() {
            const dpr = window.devicePixelRatio || 1;
            const rect = canvas.getBoundingClientRect();
            if (canvas.width !== Math.floor(rect.width * dpr) || canvas.height !== Math.floor(rect.height * dpr)) {
               canvas.width = Math.floor(rect.width * dpr);
               canvas.height = Math.floor(rect.height * dpr);
            }

            const w = canvas.width;
            const h = canvas.height;
            const stageCfg = STAGES[game.currentStageIndex];

            // 1. Sky & Meadow Background
            const skyGrad = ctx.createLinearGradient(0, 0, 0, h);
            skyGrad.addColorStop(0, stageCfg.bgTop);
            skyGrad.addColorStop(0.28, stageCfg.bgGround);
            skyGrad.addColorStop(1, '#FFFDF7');
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, w, h);

            // Soft rolling hills in background
            ctx.fillStyle = 'rgba(167, 243, 208, 0.35)';
            ctx.beginPath();
            ctx.ellipse(w * 0.25, h * 0.22, w * 0.35, h * 0.12, 0, 0, Math.PI * 2);
            ctx.ellipse(w * 0.78, h * 0.24, w * 0.38, h * 0.13, 0, 0, Math.PI * 2);
            ctx.fill();

            // Gentle wildflowers
            const now = performance.now() * 0.002;
            ctx.font = `${20 * dpr}px sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            game.decorations.forEach((dec) => {
               const sway = Math.sin(now + dec.phase) * 3 * dpr;
               ctx.fillText(dec.icon, dec.x * w + sway, dec.y * h);
            });

            if (!game.stageData) return;

            // 2. Render Stage-Specific World Elements
            const data = game.stageData;

            // Stage 2 River Water Stream
            if (data.type === 'lilypad_river') {
               ctx.fillStyle = '#7DD3FC';
               ctx.strokeStyle = '#0284C7';
               ctx.lineWidth = 4 * dpr;
               ctx.beginPath();
               ctx.roundRect(w * 0.26, h * 0.22, w * 0.5, h * 0.64, 32 * dpr);
               ctx.fill();
               ctx.stroke();

               // Draw Lilypads
               data.pads.forEach((pad) => {
                  const px = pad.x * w;
                  const py = pad.y * h;
                  ctx.fillStyle = pad.activated ? '#4ADE80' : '#BBF7D0';
                  ctx.strokeStyle = '#0F172A';
                  ctx.lineWidth = 3.5 * dpr;
                  ctx.beginPath();
                  ctx.arc(px, py, 34 * dpr, 0, Math.PI * 2);
                  ctx.fill();
                  ctx.stroke();

                  ctx.fillStyle = '#0F172A';
                  ctx.font = `bold ${24 * dpr}px Mali, sans-serif`;
                  ctx.fillText(pad.activated ? '★' : pad.num, px, py + 2 * dpr);
               });
            }

            // Stage 1 Fruits
            if (data.type === 'fruit_harvest') {
               data.items.forEach((item) => {
                  if (item.delivered || item === game.player.carrying) return;
                  const bob = Math.sin(now * 2 + item.x * 10) * 5 * dpr;
                  drawItemPedestal(ctx, item.x * w, item.y * h, 30 * dpr, '#FEF9C3');
                  ctx.font = `${34 * dpr}px sans-serif`;
                  ctx.fillText(item.icon, item.x * w, item.y * h + bob);
               });
            }

            // Stage 3 Musical Flowers
            if (data.type === 'musical_flowers') {
               data.flowers.forEach((fl) => {
                  if (fl.glow > 0) fl.glow = Math.max(0, fl.glow - 0.03);
                  const radius = (34 + fl.glow * 10) * dpr;
                  drawItemPedestal(ctx, fl.x * w, fl.y * h, radius, fl.glow > 0 ? fl.color : '#FFFFFF');
                  ctx.font = `${36 * dpr}px sans-serif`;
                  ctx.fillText(fl.icon, fl.x * w, fl.y * h);
               });
            }

            // Stage 4 Shape Sorting Pedestals & Crystals
            if (data.type === 'shape_sorting') {
               data.pedestals.forEach((ped) => {
                  drawGeometricShape(ctx, ped.shape, ped.x * w, ped.y * h, 28 * dpr, '#FFFFFF', !ped.filled);
               });
               data.crystals.forEach((cr) => {
                  if (cr === game.player.carrying) return;
                  drawGeometricShape(ctx, cr.shape, cr.x * w, cr.y * h, 26 * dpr, cr.color, false);
               });
            }

            // Stage 5 Starlight Lanterns & Celebration Bell
            if (data.type === 'star_festival') {
               data.lanterns.forEach((lamp) => {
                  const lx = lamp.x * w;
                  const ly = lamp.y * h;
                  if (lamp.lit) {
                     ctx.fillStyle = 'rgba(250, 204, 21, 0.35)';
                     ctx.beginPath();
                     ctx.arc(lx, ly, 48 * dpr, 0, Math.PI * 2);
                     ctx.fill();
                  }
                  drawItemPedestal(ctx, lx, ly, 32 * dpr, lamp.lit ? '#FEF08A' : '#E2E8F0');
                  ctx.font = `${36 * dpr}px sans-serif`;
                  ctx.fillText(lamp.lit ? '🏮' : '🕯️', lx, ly);
               });

               const bell = data.bell;
               drawItemPedestal(ctx, bell.x * w, bell.y * h, 36 * dpr, bell.rung ? '#FDE047' : '#F3E8FF');
               ctx.font = `${40 * dpr}px sans-serif`;
               ctx.fillText('🔔', bell.x * w, bell.y * h);
            }

            // 3. Draw Animal Friend Waiting at Goal
            const friend = stageCfg.friend;
            const fx = friend.x * w;
            const fy = friend.y * h;
            const friendBob = Math.sin(now * 1.8) * 4 * dpr;

            ctx.fillStyle = '#FFFDF7';
            ctx.strokeStyle = '#0F172A';
            ctx.lineWidth = 3.5 * dpr;
            ctx.beginPath();
            ctx.arc(fx, fy, 38 * dpr, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            ctx.font = `${42 * dpr}px sans-serif`;
            ctx.fillText(friend.emoji, fx, fy + friendBob);

            // 4. Progressive Scaffolding Visuals (Hint Levels 1, 2, 3)
            const target = getCurrentObjectiveTarget();
            if (target && game.hintLevel >= 1) {
               const tx = target.x * w;
               const ty = target.y * h;
               const pulseRadius = (42 + Math.sin(now * 4) * 10) * dpr;

               // Level 1+: Expanding golden spotlight ring on target
               ctx.strokeStyle = '#F59E0B';
               ctx.lineWidth = 4 * dpr;
               ctx.beginPath();
               ctx.arc(tx, ty, pulseRadius, 0, Math.PI * 2);
               ctx.stroke();

               // Level 2+: Dotted golden path + Ghost Helper Spirit
               if (game.hintLevel >= 2) {
                  ctx.strokeStyle = '#D97706';
                  ctx.lineWidth = 4 * dpr;
                  ctx.setLineDash([10 * dpr, 10 * dpr]);
                  ctx.beginPath();
                  ctx.moveTo(game.player.x * w, game.player.y * h);
                  ctx.lineTo(tx, ty);
                  ctx.stroke();
                  ctx.setLineDash([]);

                  if (game.ghostDemo.active) {
                     drawPuiMek(ctx, game.ghostDemo.x * w, game.ghostDemo.y * h - 10 * dpr, 22 * dpr, 1, 1, game.ghostDemo.targetX >= game.ghostDemo.x ? 1 : -1, true, true);
                  }
               }
            }

            // Tap-to-walk destination ring indicator
            if (inputState.pointerTarget) {
               ctx.strokeStyle = '#0284C7';
               ctx.lineWidth = 3 * dpr;
               ctx.beginPath();
               ctx.arc(inputState.pointerTarget.x * w, inputState.pointerTarget.y * h, 16 * dpr, 0, Math.PI * 2);
               ctx.stroke();
            }

            // 5. Draw Main Character "น้องปุยเมฆ" (Pui-Mek)
            const p = game.player;
            const px = p.x * w;
            const py = (p.y - p.z) * h;
            drawPuiMek(ctx, px, py, 28 * dpr, p.scaleX, p.scaleY, p.facing, false, p.happyTimer > 0);

            // Draw Carried Item floating cutely above Pui-Mek's head
            if (p.carrying) {
               const carryY = py - 52 * dpr;
               if (p.carrying.icon) {
                  ctx.font = `${32 * dpr}px sans-serif`;
                  ctx.fillText(p.carrying.icon, px, carryY);
               } else if (p.carrying.shape) {
                  drawGeometricShape(ctx, p.carrying.shape, px, carryY, 18 * dpr, p.carrying.color, false);
               }
            }

            // 6. Draw Celebration Sparkle Particles
            game.particles.forEach((pt) => {
               ctx.globalAlpha = Math.max(0, pt.life);
               ctx.fillStyle = pt.color;
               ctx.strokeStyle = '#0F172A';
               ctx.lineWidth = 1.5 * dpr;
               ctx.beginPath();
               ctx.arc(pt.x * w, pt.y * h, pt.size * dpr, 0, Math.PI * 2);
               ctx.fill();
               ctx.stroke();
               ctx.globalAlpha = 1;
            });
         }

         function drawItemPedestal(c, x, y, r, fill) {
            c.fillStyle = fill;
            c.strokeStyle = '#0F172A';
            c.lineWidth = 3;
            c.beginPath();
            c.arc(x, y, r, 0, Math.PI * 2);
            c.fill();
            c.stroke();
         }

         function mainLoop(now) {
            const dt = Math.min(0.05, (now - lastTime) / 1000);
            lastTime = now;

            updateAndDrawTutorialCanvas(dt);
            updateGame(dt);
            renderGame();

            requestAnimationFrame(mainLoop);
         }

         // Start the loop once the DOM is ready. Waiting for window 'load' left the
         // canvas frozen whenever a CDN asset was slow or blocked.
         let gameBooted = false;

         function bootGame() {
            if (gameBooted) return;
            gameBooted = true;
            requestAnimationFrame(mainLoop);
         }

         if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', bootGame, { once: true });
         } else {
            bootGame();
         }
      </script>
   </body>
</html>
