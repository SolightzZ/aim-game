<!doctype html>
<html lang="th">
   <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
      <title>AIM PLAY — คลังเกมการเรียนรู้</title>

      <!-- Typography: Fredoka & Prompt -->
      <link rel="preconnect" href="https://fonts.googleapis.com" />
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
      <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Prompt:wght@500;600;700;800&display=swap" rel="stylesheet" />

      <!-- Tailwind CSS -->
      <script src="https://cdn.tailwindcss.com"></script>
      <script>
         tailwind.config = {
            theme: {
               extend: {
                  fontFamily: {
                     prompt: ['Prompt', 'sans-serif'],
                     fredoka: ['Fredoka', 'Prompt', 'sans-serif'],
                  },
                  colors: {
                     canvas: '#F6F8FC',
                     surface: '#FFFFFF',
                     ink: '#1E293B',
                  },
                  boxShadow: {
                     'pill': '0 6px 20px -4px rgba(15, 23, 42, 0.08), 0 2px 6px -1px rgba(15, 23, 42, 0.04)',
                     'clay': '0 8px 0 #E2E8F0, 0 16px 28px -6px rgba(15, 23, 42, 0.08)',
                     'clay-hover': '0 12px 0 #CBD5E1, 0 24px 36px -8px rgba(15, 23, 42, 0.14)',
                     'btn-pop': '0 4px 0 rgba(0, 0, 0, 0.18)',
                  }
               }
            }
         }
      </script>

      <style>
         * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
         }

         html, body {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
            font-family: 'Prompt', sans-serif;
            background-color: #F4F7FB;
            color: #1E293B;
            overflow: hidden;
            user-select: none;
         }

         /* Sunlit Playful Dot & Wave Canvas */
         .bg-playland {
            background-color: #F4F7FB;
            background-image:
               radial-gradient(circle at 12% 15%, rgba(251, 191, 36, 0.14) 0%, transparent 32%),
               radial-gradient(circle at 88% 12%, rgba(56, 189, 248, 0.14) 0%, transparent 35%),
               radial-gradient(circle at 82% 88%, rgba(244, 114, 182, 0.12) 0%, transparent 35%),
               radial-gradient(circle at 18% 85%, rgba(52, 211, 153, 0.12) 0%, transparent 35%),
               radial-gradient(#CBD5E1 1.3px, transparent 1.3px);
            background-size: 100% 100%, 100% 100%, 100% 100%, 100% 100%, 26px 26px;
         }

         /* High Contrast Accessibility Mode */
         body.high-contrast .bg-playland {
            background: #09090B !important;
         }
         body.high-contrast .floating-pill,
         body.high-contrast .game-card,
         body.high-contrast .modal-surface {
            background-color: #121215 !important;
            border-color: #FACC15 !important;
            color: #FACC15 !important;
            box-shadow: none !important;
         }
         body.high-contrast .card-title {
            color: #FFFFFF !important;
         }

         /* Tactile Button & Card Physics */
         .tactile-btn {
            transition: transform 0.14s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.14s ease, background-color 0.15s ease;
         }
         .tactile-btn:hover {
            transform: translateY(-2px);
         }
         .tactile-btn:active {
            transform: translateY(2px) scale(0.97);
         }

         .game-card {
            transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.22s ease, border-color 0.2s ease;
         }
         .game-card:hover {
            transform: translateY(-5px);
         }
         .game-card:hover .illus-group {
            transform: scale(1.05) translateY(-2px);
         }
         .illus-group {
            transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform-origin: center center;
         }

         /* Subtle Ambient Float */
         @keyframes floatSlow {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-4px); }
         }
         .animate-float-slow {
            animation: floatSlow 3.6s ease-in-out infinite;
         }

         @keyframes diceSpin {
            0% { transform: rotate(0deg) scale(1); }
            35% { transform: rotate(-25deg) scale(1.2); }
            75% { transform: rotate(385deg) scale(1.15); }
            100% { transform: rotate(360deg) scale(1); }
         }
         .dice-rolling {
            animation: diceSpin 0.65s cubic-bezier(0.34, 1.56, 0.64, 1);
         }

         /* Clean Custom Scrollbar for Inner Grid */
         .grid-scroll::-webkit-scrollbar {
            width: 6px;
         }
         .grid-scroll::-webkit-scrollbar-track {
            background: transparent;
         }
         .grid-scroll::-webkit-scrollbar-thumb {
            background: rgba(148, 163, 184, 0.45);
            border-radius: 999px;
         }
         .grid-scroll::-webkit-scrollbar-thumb:hover {
            background: rgba(100, 116, 139, 0.7);
         }
      </style>
   </head>

   <body class="bg-playland flex flex-col h-screen w-screen overflow-hidden">

      <!-- Decorative Background Clouds (Pure Light Ambient Art) -->
      <div class="fixed inset-0 pointer-events-none overflow-hidden z-0 opacity-65">
         <svg class="absolute -top-6 left-[6%] w-44 h-24 text-white/80 animate-float-slow" viewBox="0 0 200 100" fill="currentColor">
            <path d="M45 80h110a30 30 0 0 0 5-59.5A42 42 0 0 0 80 18a35 35 0 0 0-35 32A25 25 0 0 0 45 80z"/>
         </svg>
         <svg class="absolute top-12 right-[8%] w-52 h-28 text-white/75 animate-float-slow" style="animation-delay: 1.4s" viewBox="0 0 200 100" fill="currentColor">
            <path d="M45 80h110a30 30 0 0 0 5-59.5A42 42 0 0 0 80 18a35 35 0 0 0-35 32A25 25 0 0 0 45 80z"/>
         </svg>
      </div>

      <!-- FULLSCREEN FLOATING HUD (No Navbar, Icon-First) -->
      <div class="relative z-30 w-full max-w-[1440px] mx-auto px-4 sm:px-6 pt-3.5 sm:pt-5 pb-2 flex flex-wrap items-center justify-between gap-2.5 shrink-0">

         <!-- Left: Brand Emblem + Trophy Counter Pill -->
         <div class="flex items-center gap-2.5">
            <button onclick="resetAllFilters()" title="AIM PLAY"
               class="floating-pill tactile-btn h-12 px-3.5 rounded-2xl bg-white/95 backdrop-blur-md border-2 border-slate-200/90 shadow-pill flex items-center gap-2.5">
               <!-- Custom Playful Brand Logo SVG -->
               <svg class="w-7 h-7 shrink-0" viewBox="0 0 36 36" fill="none">
                  <rect width="36" height="36" rx="11" fill="url(#brandGrad)"/>
                  <path d="M11 22.5C11 18.9 13.9 16 17.5 16h1c3.6 0 6.5 2.9 6.5 6.5a3.5 3.5 0 0 1-5.8 2.6l-1.2-1.1-1.2 1.1A3.5 3.5 0 0 1 11 22.5z" fill="#FFF"/>
                  <circle cx="15" cy="20.5" r="1.3" fill="#4F46E5"/>
                  <circle cx="21" cy="20.5" r="1.3" fill="#EC4899"/>
                  <path d="M18 9.5l1.1 2.2 2.4.4-1.7 1.7.4 2.4-2.2-1.1-2.2 1.1.4-2.4-1.7-1.7 2.4-.4L18 9.5z" fill="#FDE047"/>
                  <defs>
                     <linearGradient id="brandGrad" x1="0" y1="0" x2="36" y2="36" gradientUnits="userSpaceOnUse">
                        <stop stop-color="#6366F1"/>
                        <stop offset="0.55" stop-color="#EC4899"/>
                        <stop offset="1" stop-color="#F59E0B"/>
                     </linearGradient>
                  </defs>
               </svg>
               <span class="font-fredoka font-bold text-lg tracking-tight text-slate-800 hidden sm:inline">AIM PLAY</span>
            </button>

            <!-- Played Trophy Pill -->
            <div class="floating-pill h-12 px-3.5 rounded-2xl bg-white/95 backdrop-blur-md border-2 border-amber-200/90 shadow-pill flex items-center gap-2" title="ความคืบหน้า">
               <svg class="w-6 h-6 text-amber-500 shrink-0" viewBox="0 0 24 24" fill="none">
                  <path d="M7 4h10v6a5 5 0 0 1-10 0V4z" fill="#FBBF24" stroke="#D97706" stroke-width="1.8"/>
                  <path d="M7 6H4.5A1.5 1.5 0 0 0 3 7.5v1A3.5 3.5 0 0 0 6.5 12H7M17 6h2.5A1.5 1.5 0 0 1 21 7.5v1a3.5 3.5 0 0 1-3.5 3.5H17" stroke="#D97706" stroke-width="1.8" stroke-linecap="round"/>
                  <path d="M12 15v4M8.5 19h7" stroke="#D97706" stroke-width="2" stroke-linecap="round"/>
               </svg>
               <span id="playedCountText" class="font-fredoka font-bold text-sm sm:text-base text-amber-700">0/12</span>
            </div>
         </div>

         <!-- Center: Minimalist Icon Category Dock -->
         <div class="floating-pill h-12 p-1.5 rounded-2xl bg-white/95 backdrop-blur-md border-2 border-slate-200/90 shadow-pill flex items-center gap-1 order-3 sm:order-2 mx-auto sm:mx-0">
            <!-- All Games -->
            <button onclick="setCategoryFilter('all')" id="tab-all" title="ทั้งหมด"
               class="cat-tab h-full px-3.5 rounded-xl font-fredoka font-bold text-xs sm:text-sm flex items-center gap-1.5 transition-all bg-slate-900 text-white shadow-sm">
               <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/>
               </svg>
               <span>12</span>
            </button>

            <!-- Series A: Arcade & Skill -->
            <button onclick="setCategoryFilter('A')" id="tab-A" title="ชุด A: อาร์เคด"
               class="cat-tab h-full px-3.5 rounded-xl font-fredoka font-bold text-xs sm:text-sm flex items-center gap-1.5 transition-all text-slate-600 hover:bg-pink-50 hover:text-pink-600">
               <svg class="w-4 h-4 text-pink-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="6" y1="12" x2="10" y2="12"/><line x1="8" y1="10" x2="8" y2="14"/><line x1="15" y1="13" x2="15.01" y2="13"/><line x1="18" y1="11" x2="18.01" y2="11"/><rect x="2" y="6" width="20" height="12" rx="6"/>
               </svg>
               <span>A</span>
            </button>

            <!-- Series B: Science & English -->
            <button onclick="setCategoryFilter('B')" id="tab-B" title="ชุด B: วิทย์และภาษา"
               class="cat-tab h-full px-3.5 rounded-xl font-fredoka font-bold text-xs sm:text-sm flex items-center gap-1.5 transition-all text-slate-600 hover:bg-sky-50 hover:text-sky-600">
               <svg class="w-4 h-4 text-sky-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="12" r="2.5"/><ellipse cx="12" cy="12" rx="9" ry="4" transform="rotate(30 12 12)"/><ellipse cx="12" cy="12" rx="9" ry="4" transform="rotate(-30 12 12)"/>
               </svg>
               <span>B</span>
            </button>

            <!-- Series C: Health & Phonics -->
            <button onclick="setCategoryFilter('C')" id="tab-C" title="ชุด C: สุขภาพ"
               class="cat-tab h-full px-3.5 rounded-xl font-fredoka font-bold text-xs sm:text-sm flex items-center gap-1.5 transition-all text-slate-600 hover:bg-emerald-50 hover:text-emerald-600">
               <svg class="w-4 h-4 text-rose-500" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M12 20.5s-7-4.5-9-9.2C1.4 7.7 4 4.5 7.5 4.5c2 0 3.6 1 4.5 2.4.9-1.4 2.5-2.4 4.5-2.4 3.5 0 6.1 3.2 4.5 6.8-2 4.7-9 9.2-9 9.2z"/>
               </svg>
               <span>C</span>
            </button>

            <!-- Favorite Filter Toggle -->
            <button onclick="toggleFavoriteFilter()" id="tab-fav" title="เกมโปรด"
               class="cat-tab h-full px-3 rounded-xl font-fredoka font-bold text-xs sm:text-sm flex items-center justify-center transition-all text-slate-500 hover:bg-amber-50 hover:text-amber-500">
               <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5-4.8-4.6 6.6-.9L12 2.5z"/>
               </svg>
            </button>
         </div>

         <!-- Right: Expandable Search + Random Dice + Settings -->
         <div class="flex items-center gap-2 order-2 sm:order-3">
            <!-- Expandable Compact Search Pill -->
            <div id="searchPill" class="floating-pill h-12 rounded-2xl bg-white/95 backdrop-blur-md border-2 border-slate-200/90 shadow-pill flex items-center px-3 transition-all w-12 focus-within:w-44 sm:focus-within:w-56 overflow-hidden">
               <button onclick="focusSearch()" class="shrink-0 text-slate-600 hover:text-indigo-600 flex items-center justify-center" title="ค้นหา">
                  <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                     <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>
                  </svg>
               </button>
               <input type="text" id="searchInput" oninput="handleSearch()" placeholder="ค้นหา..."
                  class="w-full bg-transparent pl-2.5 pr-1 text-sm font-semibold text-slate-800 outline-none placeholder:text-slate-400" />
               <button onclick="clearSearch()" id="clearSearchBtn" class="hidden text-slate-400 hover:text-slate-700 shrink-0">
                  <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                     <path d="M18 6L6 18M6 6l12 12"/>
                  </svg>
               </button>
            </div>

            <!-- Random Dice Button -->
            <button onclick="launchRandomGame()" title="สุ่มเกม"
               class="tactile-btn h-12 w-12 rounded-2xl bg-gradient-to-br from-amber-400 to-orange-500 text-white shadow-pill border-2 border-amber-300 flex items-center justify-center">
               <svg id="diceIcon" class="w-6 h-6" viewBox="0 0 24 24" fill="none">
                  <rect x="3" y="3" width="18" height="18" rx="5" fill="#FFF" fill-opacity="0.22" stroke="#FFF" stroke-width="2"/>
                  <circle cx="8.5" cy="8.5" r="1.5" fill="#FFF"/>
                  <circle cx="15.5" cy="8.5" r="1.5" fill="#FFF"/>
                  <circle cx="12" cy="12" r="1.5" fill="#FFF"/>
                  <circle cx="8.5" cy="15.5" r="1.5" fill="#FFF"/>
                  <circle cx="15.5" cy="15.5" r="1.5" fill="#FFF"/>
               </svg>
            </button>

            <!-- Settings Gear Icon -->
            <button onclick="openModal('settingsModal')" title="ตั้งค่า"
               class="floating-pill tactile-btn h-12 w-12 rounded-2xl bg-white/95 backdrop-blur-md border-2 border-slate-200/90 shadow-pill text-slate-700 hover:text-indigo-600 flex items-center justify-center">
               <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="12" r="3"/>
                  <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9c.26.604.852.997 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
               </svg>
            </button>
         </div>
      </div>

      <!-- FULLSCREEN ILLUSTRATED GAME STAGE -->
      <main class="relative z-10 flex-1 w-full max-w-[1440px] mx-auto px-4 sm:px-6 pb-5 pt-1 overflow-y-auto grid-scroll flex flex-col">

         <!-- Game Grid -->
         <div id="gameGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 sm:gap-5 my-auto py-1">
            <!-- Populated dynamically with illustrated cards -->
         </div>

         <!-- Visual Empty State (Minimalist Icon + Reset Button) -->
         <div id="emptyState" class="hidden m-auto flex flex-col items-center justify-center text-center p-8 bg-white/90 rounded-3xl border-2 border-slate-200 shadow-pill">
            <svg class="w-20 h-20 text-slate-300 mb-3" viewBox="0 0 64 64" fill="none">
               <circle cx="28" cy="28" r="18" stroke="currentColor" stroke-width="5"/>
               <path d="M41 41l13 13" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
               <path d="M22 25h12M24 32h8" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
            </svg>
            <button onclick="resetAllFilters()" class="tactile-btn px-5 py-2.5 rounded-2xl bg-indigo-600 text-white font-fredoka font-bold text-sm flex items-center gap-2 shadow-btn-pop">
               <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                  <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/>
               </svg>
               <span>แสดงทั้งหมด</span>
            </button>
         </div>

      </main>

      <!-- ================= MINIMALIST ICON MODALS ================= -->

      <!-- Settings Popover Modal -->
      <div id="settingsModal" class="fixed inset-0 bg-slate-900/45 backdrop-blur-xs z-50 flex items-center justify-center p-4 hidden" onclick="if(event.target===this) closeModal('settingsModal')">
         <div class="modal-surface bg-white rounded-3xl max-w-xs w-full p-5 shadow-2xl border-2 border-slate-200 space-y-3">
            <div class="flex items-center justify-between pb-1">
               <div class="flex items-center gap-2 text-slate-800 font-fredoka font-bold text-base">
                  <svg class="w-5 h-5 text-indigo-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4">
                     <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9c.26.604.852.997 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                  </svg>
                  <span>ตั้งค่า</span>
               </div>
               <button onclick="closeModal('settingsModal')" class="w-8 h-8 rounded-xl bg-slate-100 hover:bg-slate-200 flex items-center justify-center text-slate-600">
                  <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
               </button>
            </div>

            <!-- Sound Toggle -->
            <label class="flex items-center justify-between p-3 rounded-2xl bg-slate-50 border border-slate-200/80 cursor-pointer">
               <div class="flex items-center gap-2.5 font-semibold text-sm text-slate-700">
                  <svg class="w-5 h-5 text-sky-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                     <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
                  </svg>
                  <span>เสียงเอฟเฟกต์</span>
               </div>
               <input type="checkbox" id="soundToggle" checked onchange="toggleSound(this.checked)" class="w-5 h-5 accent-indigo-600 rounded cursor-pointer" />
            </label>

            <!-- High Contrast Toggle -->
            <label class="flex items-center justify-between p-3 rounded-2xl bg-slate-50 border border-slate-200/80 cursor-pointer">
               <div class="flex items-center gap-2.5 font-semibold text-sm text-slate-700">
                  <svg class="w-5 h-5 text-amber-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                     <circle cx="12" cy="12" r="9"/><path d="M12 3v18a9 9 0 0 0 0-18z" fill="currentColor"/>
                  </svg>
                  <span>คอนทราสต์สูง</span>
               </div>
               <input type="checkbox" id="contrastToggle" onchange="toggleHighContrast(this.checked)" class="w-5 h-5 accent-indigo-600 rounded cursor-pointer" />
            </label>

            <!-- New Tab Toggle -->
            <label class="flex items-center justify-between p-3 rounded-2xl bg-slate-50 border border-slate-200/80 cursor-pointer">
               <div class="flex items-center gap-2.5 font-semibold text-sm text-slate-700">
                  <svg class="w-5 h-5 text-emerald-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                     <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/>
                  </svg>
                  <span>เปิดแท็บใหม่</span>
               </div>
               <input type="checkbox" id="newTabToggle" checked onchange="toggleNewTab(this.checked)" class="w-5 h-5 accent-indigo-600 rounded cursor-pointer" />
            </label>

            <!-- Reset Progress Action -->

         // App State
         let currentCategory = 'all';

         let playedGames = JSON.parse(localStorage.getItem('aim_played_games') || '[]');
         let soundEnabled = true;
         let openInNewTab = true;

         // Zero-Dependency Web Audio Synthesizer
         const audioCtx = (typeof AudioContext !== 'undefined' || typeof webkitAudioContext !== 'undefined')
            ? new (window.AudioContext || window.webkitAudioContext)()
            : null;

         function playSound(type) {
            if (!soundEnabled || !audioCtx) return;
            try {
               if (audioCtx.state === 'suspended') audioCtx.resume();
               const now = audioCtx.currentTime;
               const osc = audioCtx.createOscillator();
               const gain = audioCtx.createGain();
               osc.connect(gain);
               gain.connect(audioCtx.destination);

               if (type === 'click') {
                  osc.type = 'sine';
                  osc.frequency.setValueAtTime(520, now);
                  osc.frequency.exponentialRampToValueAtTime(760, now + 0.055);
                  gain.gain.setValueAtTime(0.11, now);
                  gain.gain.exponentialRampToValueAtTime(0.001, now + 0.055);
                  osc.start(now);
                  osc.stop(now + 0.06);
               } else if (type === 'pop') {
                  osc.type = 'triangle';
                  osc.frequency.setValueAtTime(360, now);
                  osc.frequency.exponentialRampToValueAtTime(880, now + 0.09);
                  gain.gain.setValueAtTime(0.14, now);
                  gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
                  osc.start(now);
                  osc.stop(now + 0.1);
               } else if (type === 'fanfare') {
                  [523.25, 659.25, 783.99, 1046.5].forEach((freq, idx) => {
                     const o = audioCtx.createOscillator();
                     const g = audioCtx.createGain();
                     o.connect(g);
                     g.connect(audioCtx.destination);
                     o.type = 'triangle';
                     o.frequency.setValueAtTime(freq, now + idx * 0.07);
                     g.gain.setValueAtTime(0.13, now + idx * 0.07);
                     g.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.07 + 0.2);
                     o.start(now + idx * 0.07);
                     o.stop(now + idx * 0.07 + 0.22);
                  });
               }
            } catch (e) {}
         }

         // Initialize
         window.addEventListener('DOMContentLoaded', () => {

               document.getElementById('contrastToggle').checked = true;
            }

            if (savedSound !== null) {
               soundEnabled = savedSound === 'true';
               document.getElementById('soundToggle').checked = soundEnabled;
            }
            const savedNewTab = localStorage.getItem('aim_new_tab');
            if (savedNewTab !== null) {
               openInNewTab = savedNewTab === 'true';
               document.getElementById('newTabToggle').checked = openInNewTab;
            }
         });

         // Render Illustrated Cards
         function renderGames() {
            const grid = document.getElementById('gameGrid');
            const emptyState = document.getElementById('emptyState');
            if (!grid) return;

            const filtered = GAMES.filter(game => {
               if (onlyFavorites && !favorites.includes(game.id)) return false;
               if (currentCategory !== 'all' && game.series !== currentCategory) return false;
               if (searchQuery.trim() !== '') {
                  const q = searchQuery.toLowerCase().trim();
                  const haystack = `${game.id} ${game.title} ${game.badgeText} ${game.keywords}`.toLowerCase();
                  if (!haystack.includes(q)) return false;
               }
               return true;
            });

            if (filtered.length === 0) {
               grid.innerHTML = '';
               emptyState.classList.remove('hidden');
               return;
            }
            emptyState.classList.add('hidden');
            grid.innerHTML = '';

            filtered.forEach(game => {
               const isFav = favorites.includes(game.id);
               const isPlayed = playedGames.includes(game.id);
               const targetAttr = openInNewTab ? 'target="_blank" rel="noopener noreferrer"' : '';

               const card = document.createElement('div');
               card.className = 'game-card bg-white rounded-[26px] border-2 border-slate-200/90 shadow-clay hover:shadow-clay-hover overflow-hidden flex flex-col justify-between group relative';

            const tabs = ['all', 'A', 'B', 'C'];

               const active = !onlyFavorites && currentCategory === id;
               btn.className = active
                  ? 'cat-tab h-full px-3.5 rounded-xl font-fredoka font-bold text-xs sm:text-sm flex items-center gap-1.5 transition-all bg-slate-900 text-white shadow-xs'

         function handleSearch() {
            const input = document.getElementById('searchInput');
            const pill = document.getElementById('searchPill');
            const clearBtn = document.getElementById('clearSearchBtn');
            searchQuery = input ? input.value : '';

            if (searchQuery.trim().length > 0) {
               clearBtn.classList.remove('hidden');
               pill.classList.add('w-44', 'sm:w-56');
            } else {
               clearBtn.classList.add('hidden');
               pill.classList.remove('w-44', 'sm:w-56');
            }
            renderGames();
         }

            playSound('click');
            const input = document.getElementById('searchInput');
            if (input) input.value = '';
            searchQuery = '';
            document.getElementById('clearSearchBtn').classList.add('hidden');
            document.getElementById('searchPill').classList.remove('w-44', 'sm:w-56');
            renderGames();

            playSound('pop');

            currentCategory = 'all';
            clearSearch();
            updateTabStyles();
            renderGames();

         // Favorites & Played State
         function toggleFavorite(id, event) {
            if (event) {
               event.preventDefault();
               event.stopPropagation();
            }
            playSound('pop');
            const idx = favorites.indexOf(id);
            if (idx > -1) favorites.splice(idx, 1);
            else favorites.push(id);
            localStorage.setItem('aim_favorites', JSON.stringify(favorites));
            renderGames();
         }

         function markAsPlayed(id) {
            playSound('click');
            if (!playedGames.includes(id)) {
               playedGames.push(id);
               localStorage.setItem('aim_played_games', JSON.stringify(playedGames));
               updatePlayedUI();
               renderGames();
            }
         }

         function updatePlayedUI() {
            const el = document.getElementById('playedCountText');
            if (el) el.innerText = `${playedGames.length}/${GAMES.length}`;
         }

         function resetPlayedProgress() {
            playSound('click');
            playedGames = [];
            localStorage.removeItem('aim_played_games');
            updatePlayedUI();
            renderGames();
            closeModal('settingsModal');
         }

         // Random Game Launcher
         function launchRandomGame() {
            playSound('fanfare');
            const dice = document.getElementById('diceIcon');
            if (dice) {
               dice.classList.remove('dice-rolling');
               void dice.offsetWidth;
               dice.classList.add('dice-rolling');
            }

            const chosen = GAMES[Math.floor(Math.random() * GAMES.length)];
            document.getElementById('randomModalArt').innerHTML = getGameIllustrationSVG(chosen.id);
            document.getElementById('randomModalCode').innerText = `${chosen.id} · ${chosen.badgeText}`;
            document.getElementById('randomModalTitle').innerText = chosen.title;

            const playBtn = document.getElementById('randomModalPlayBtn');
            playBtn.href = encodeURI(chosen.filename);
            if (openInNewTab) {
               playBtn.target = '_blank';
               playBtn.rel = 'noopener noreferrer';
            } else {
               playBtn.removeAttribute('target');
               playBtn.removeAttribute('rel');
            }
            playBtn.onclick = () => {
               markAsPlayed(chosen.id);
               closeModal('randomModal');
            };

            openModal('randomModal');
         }

         // Modals & Accessibility Settings
         function openModal(id) {
            const m = document.getElementById(id);
            if (m) m.classList.remove('hidden');
         }

         function closeModal(id) {
            playSound('click');
            const m = document.getElementById(id);
            if (m) m.classList.add('hidden');
         }

         window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
               ['settingsModal', 'randomModal'].forEach(id => {
                  const m = document.getElementById(id);
                  if (m && !m.classList.contains('hidden')) closeModal(id);
               });
            }
         });

         function toggleHighContrast(enabled) {
            playSound('click');
            document.body.classList.toggle('high-contrast', enabled);
            localStorage.setItem('aim_contrast', enabled);
         }

         function toggleSound(enabled) {
            soundEnabled = enabled;
            localStorage.setItem('aim_sound', enabled);
            if (enabled) playSound('click');
         }

         function toggleNewTab(enabled) {
            openInNewTab = enabled;
            localStorage.setItem('aim_new_tab', enabled);
            renderGames();
         }
